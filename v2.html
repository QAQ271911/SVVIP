<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>抵抗之弧 · 战略指挥中心</title>
<style>
:root{--bg:#090d11;--panel:#111820;--panel2:#18212b;--line:#293746;--text:#edf2f5;--muted:#93a2ae;--amber:#e7ad55;--green:#64c89a;--red:#df746b;--cyan:#67b9d2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#182431,#090d11 58%);color:var(--text);font-family:"Microsoft YaHei UI",sans-serif;overflow:hidden}button,input{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-rows:66px 1fr 28px}.top{display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:#0d1319dd}.brand{min-width:250px}.brand b{color:var(--amber);letter-spacing:.08em}.brand small{color:var(--muted)}.stats{display:flex;gap:10px;margin-left:auto}.stat{min-width:76px;border-left:1px solid var(--line);padding-left:10px}.stat span{display:block;color:var(--muted);font-size:9px}.stat b{font-size:20px}.actions{display:flex;gap:5px}.actions button,.cmd,.modal button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:4px;padding:8px 10px}.actions button:hover,.cmd:hover,.modal button:hover{border-color:var(--amber);color:var(--amber)}.primary{border-color:var(--amber)!important;color:var(--amber)!important}.stage{min-height:0;display:grid;grid-template-columns:250px 1fr 270px}.rail,.lograil{min-height:0;overflow:auto;padding:12px;background:#0d1319cc}.rail{border-right:1px solid var(--line)}.lograil{border-left:1px solid var(--line)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:11px;margin-bottom:9px}.panel h3{margin:0 0 8px;font-size:10px;color:var(--amber);letter-spacing:.13em}.pressure{height:5px;background:#263340;border-radius:4px;margin:8px 0;overflow:hidden}.pressure i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--amber),var(--red));transition:.5s}.map{position:relative;overflow:hidden}.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px),radial-gradient(circle at 48% 48%,#1a2935,#090d11 75%);background-size:44px 44px,44px 44px,100% 100%}.map-toolbar{position:absolute;z-index:5;left:12px;top:12px;display:flex;gap:4px}.chip{border:1px solid var(--line);background:#111820d9;color:var(--muted);border-radius:3px;padding:5px 8px;font-size:10px}.chip.on{border-color:var(--amber);color:var(--amber)}.node{position:absolute;z-index:3;width:92px;height:92px;border:1px solid #4b5b68;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#1a2630,#10171d);box-shadow:0 10px 28px #000a;transition:.25s}.node:hover,.node.selected{border-color:var(--amber);transform:scale(1.04)}.node.own{border-color:var(--green)}.node.enemy{border-color:var(--red)}.node.contested{border-color:var(--amber)}.node b{display:block;font-size:12px}.node i{display:block;font-style:normal;color:var(--muted);font-size:9px}.ring{position:absolute;inset:-7px;border:1px dashed var(--amber);border-radius:50%;opacity:.45}.arc{position:absolute;z-index:1;height:2px;background:linear-gradient(90deg,var(--amber),#e7ad5555);transform-origin:left center}.map-tip{position:absolute;z-index:8;display:none;pointer-events:none;border-left:2px solid var(--amber);background:#0d1319ef;padding:7px 9px;font-size:10px}.meter{height:4px;background:#263340;border-radius:3px;overflow:hidden;margin:5px 0}.meter i{display:block;height:100%;transition:.4s}.objective{display:flex;gap:8px}.objective i{font-style:normal;color:var(--amber)}.logline{border-bottom:1px solid #ffffff09;padding:7px 2px 7px 9px;font-size:11px;color:#bdc8ce;line-height:1.55;border-left:2px solid transparent}.logline.good{border-left-color:var(--green);color:#afd4bf}.logline.bad{border-left-color:var(--red);color:#ddb0ab}.logline.warn{border-left-color:var(--amber);color:#dfc58e}.logline time{display:block;color:var(--muted);font-size:9px}.news{display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--line);background:#0d1319;overflow:hidden;white-space:nowrap;color:var(--muted);font-size:10px}.news b{color:var(--amber)}.modalmask{position:fixed;z-index:50;inset:0;background:#050709cc;display:none;align-items:center;justify-content:center}.modalmask.show{display:flex}.modal{width:min(480px,calc(100% - 30px));border:1px solid var(--amber);border-top:3px solid var(--amber);background:var(--panel);padding:20px;border-radius:5px}.modal h2{margin:0 0 8px}.modal p{color:#bbc7ce;line-height:1.7}.choices{display:grid;gap:7px}.choices button{text-align:left}.toast{position:fixed;z-index:60;bottom:45px;left:50%;transform:translate(-50%,20px);border:1px solid var(--amber);background:#171f27;padding:9px 14px;border-radius:4px;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:980px){.stage{grid-template-columns:1fr 220px}.rail{display:none}.brand{min-width:180px}.stats .stat:nth-child(n+3){display:none}}@media(max-width:680px){body{overflow:auto}.app{height:auto;min-height:100vh}.top{height:auto;min-height:66px;flex-wrap:wrap;padding:8px}.brand{min-width:150px}.stats{margin-left:0}.stage{height:620px;grid-template-columns:1fr}.lograil{display:none}.node{width:76px;height:76px}.actions button:nth-child(-n+2){display:none}.news{height:28px}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand"><b>抵抗之弧 · 指挥中心</b><br><small id="date"></small></div><div class="stats"><div class="stat"><span>积分</span><b id="points">0</b></div><div class="stat"><span>胜利</span><b id="victory">0</b></div><div class="stat"><span>失败</span><b id="failure">0</b></div><div class="stat"><span>回合</span><b id="turn">1</b></div></div><div class="actions"><button onclick="saveGame()">保存</button><button onclick="undo()" id="undoBtn">撤销</button><button onclick="exportSave()">导出</button><button class="primary" onclick="advanceDay()">推进一天</button></div></header>
<div class="stage"><aside class="rail"><div class="panel"><h3>动态威胁评估</h3><b id="difficulty" style="color:var(--amber)">标准</b><div class="pressure"><i id="pressure" style="width:35%"></i></div><small id="reason" style="color:var(--muted)"></small></div><div class="panel"><h3>战略目标</h3><div class="objective"><i id="objectiveProgress">0</i><span>/ 3 当前节点达到优势</span></div></div><div class="panel"><h3>补给态势</h3><div id="resourceInfo"></div></div></aside>
<main class="map" id="map"><div class="map-toolbar"><button class="chip on" onclick="setView(this,'control')">控制度</button><button class="chip" onclick="setView(this,'supply')">补给线</button><button class="chip" onclick="setView(this,'risk')">风险</button></div><div class="map-tip" id="mapTip"></div>
<div class="arc" style="left:22%;top:48%;width:23%;transform:rotate(-12deg)"></div><div class="arc" style="left:46%;top:42%;width:21%;transform:rotate(12deg)"></div><div class="arc" style="left:47%;top:56%;width:23%;transform:rotate(-15deg)"></div>
<div class="node own selected" data-id="tehran" style="left:18%;top:43%"><div class="ring"></div><b>德黑兰</b><i>核心</i></div><div class="node own" data-id="tabriz" style="left:40%;top:20%"><b>大不里士</b><i>友军</i></div><div class="node contested" data-id="isfahan" style="left:42%;top:62%"><b>伊斯法罕</b><i>争夺</i></div><div class="node enemy" data-id="shiraz" style="left:68%;top:64%"><b>设拉子</b><i>敌军</i></div><div class="node enemy" data-id="bushehr" style="left:69%;top:34%"><b>布什尔</b><i>敌军</i></div></main>
<aside class="lograil"><div class="panel"><h3 id="selectedName">德黑兰</h3><div id="selectedInfo"></div><div style="display:grid;gap:6px;margin-top:8px"><button class="cmd" onclick="action('reinforce')">强化据点 −35</button><button class="cmd" onclick="action('intel')">侦查情报 −25</button><button class="cmd" onclick="action('diplomacy')">外交施压 −40</button></div></div><div class="panel"><h3>作战日志</h3><div id="log"></div></div></aside></div><footer class="news"><b>滚动战报</b><span id="ticker">指挥系统已上线。</span></footer></div>
<div class="modalmask" id="eventMask"><div class="modal"><small id="eventTag" style="color:var(--amber)"></small><h2 id="eventTitle"></h2><p id="eventDesc"></p><div class="choices" id="eventChoices"></div></div></div><div class="modalmask" id="endingMask"><div class="modal"><small style="color:var(--amber)">战局结算</small><h2 id="endingTitle"></h2><p id="endingDesc"></p><div class="choices"><button onclick="restart()">重新开始</button><button onclick="exportSave()">导出战报</button></div></div></div><div class="toast" id="toast"></div>
<script>
const nodes={tehran:{name:'德黑兰',side:'own',control:82,stability:76,supply:88,terrain:'城市'},tabriz:{name:'大不里士',side:'own',control:64,stability:58,supply:72,terrain:'山地'},isfahan:{name:'伊斯法罕',side:'contested',control:48,stability:44,supply:55,terrain:'平原'},shiraz:{name:'设拉子',side:'enemy',control:76,stability:69,supply:63,terrain:'沙漠'},bushehr:{name:'布什尔',side:'enemy',control:71,stability:61,supply:67,terrain:'港口'}};
const fresh=()=>({day:1,points:360,victory:12,failure:8,selected:'tehran',seed:Date.now()%100000,log:[{text:'指挥系统上线，局势评估开始运行。',type:'',day:1}],history:[],ended:false});
let s=load();function load(){try{return JSON.parse(localStorage.getItem('svvip-v2-save'))||fresh()}catch(e){return fresh()}}function $(id){return document.getElementById(id)}
function clone(){return JSON.parse(JSON.stringify(s))}function snapshot(){s.history=s.history||[];s.history.push(clone());if(s.history.length>20)s.history.shift()}function undo(){if(!s.history?.length)return toast('没有可撤销的行动');let cur=s.history.pop();s=cur;render();toast('已撤销上一行动')}
function date(){let d=new Date(2000,0,s.day);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')}
function rnd(){s.seed=(s.seed*48271)%2147483647;return s.seed/2147483647}
function assess(){let n=nodes[s.selected];let pressure=Math.max(0,Math.min(100,s.failure*1.7+(100-n.control)*.45+(100-n.stability)*.35-s.victory*.35+(s.points<100?12:0)));let level='轻松',reason='局势顺于目标，资源仍可维持。';if(pressure>62){level='地狱';reason='敌军压力、补给缺口与失败分形成叠加。'}else if(pressure>48){level='困难';reason='敌势与资源压力正在同步上升。'}else if(pressure>30){level='标准';reason='局势尚可控，关键节点仍需持续投入。'}$('pressure').style.width=pressure+'%';$('difficulty').textContent=level;$('reason').textContent=reason}
function add(text,type=''){s.log.push({text,type,day:s.day});if(s.log.length>150)s.log.shift();$('ticker').textContent=text}
function render(){document.querySelectorAll('.node').forEach(el=>el.classList.toggle('selected',el.dataset.id===s.selected));$('date').textContent=date();$('points').textContent=s.points;$('victory').textContent=s.victory;$('failure').textContent=s.failure;$('turn').textContent=s.day;let n=nodes[s.selected];$('selectedName').textContent=n.name;$('selectedInfo').innerHTML=`控制度 ${n.control}%<div class="meter"><i style="width:${n.control}%;background:${n.control>65?'var(--green)':'var(--amber)'}"></i></div>稳定度 ${n.stability}%<div class="meter"><i style="width:${n.stability}%;background:${n.stability>65?'var(--cyan)':'var(--amber)'}"></i></div>补给 ${n.supply}% · 地形：${n.terrain}`;$('resourceInfo').innerHTML=`积分储备：${s.points}<br>补给缺口：${Math.max(0,60-Math.round(Object.values(nodes).reduce((a,n)=>a+n.supply,0)/5))}<br>优势节点：${Object.values(nodes).filter(n=>n.control>=65).length}`;$('objectiveProgress').textContent=Object.values(nodes).filter(n=>n.control>=65&&n.side==='own').length;assess();$('log').innerHTML=s.log.slice(-60).reverse().map(x=>`<div class="logline ${x.type}"><time>${dateFromTurn(x.day)}</time>${x.text}</div>`).join('');$('undoBtn').disabled=!s.history?.length}
function dateFromTurn(t){let d=new Date(2000,0,t);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')}
document.querySelectorAll('.node').forEach(el=>el.onclick=()=>{s.selected=el.dataset.id;render()});
function action(type){snapshot();let n=nodes[s.selected],cost={reinforce:35,intel:25,diplomacy:40}[type];if(s.points<cost){s.history.pop();toast('积分不足，行动未能执行');return}s.points-=cost;if(type==='reinforce'){n.control=Math.min(100,n.control+7);n.stability=Math.min(100,n.stability+5);n.supply=Math.min(100,n.supply+4);s.victory+=1;add(n.name+'完成强化，控制度提升至 '+n.control+'%。','good')}if(type==='intel'){n.stability=Math.max(0,n.stability-2);n.supply=Math.min(100,n.supply+2);s.victory+=2;add('侦查确认'+n.name+'稳定度为 '+n.stability+'%，情报已录入。','good')}if(type==='diplomacy'){n.control=Math.min(100,n.control+3);n.stability=Math.min(100,n.stability+7);s.failure=Math.max(0,s.failure-1);s.victory+=1;add('向'+n.name+'施加外交压力，局势风险下降。','good')}render()}
function advanceDay(){snapshot();s.day++;let income=18+Math.round(Object.values(nodes).filter(n=>n.side==='own').reduce((a,n)=>a+n.control*n.supply/100,0)/8);s.points+=income;Object.values(nodes).forEach(n=>{n.supply=Math.max(20,Math.min(100,n.supply+(n.side==='own'?rnd()*4-1:rnd()*3-1)));if(n.side==='enemy')n.control=Math.min(100,n.control+(rnd()<.38?1:0));if(n.side==='own')n.control=Math.min(100,n.control+(rnd()<.34?1:0));n.control=Math.max(20,n.control)});let advantage=Object.values(nodes).filter(n=>n.side==='own'&&n.control>=65).length;if(advantage>=3)s.victory++;else s.failure++;add('日结算完成：补给收入 '+income+'，全局优势节点 '+advantage+'。',advantage>=3?'good':'warn');if(s.day%9===0)randomEvent();checkEnd();render()} 
function randomEvent(){let r=rnd(),title,desc,choices;if(r<.33){title='边境风暴';desc='强降雨切断了前线补给，指挥部必须决定优先保障哪条战线。';choices=[['紧急抢修补给线',()=>{snapshot();Object.values(nodes).forEach(n=>n.supply=Math.min(100,n.supply+5));s.points-=20;add('抢修补给线成功，物流恢复。','good')}],['保持兵力状态',()=>{snapshot();Object.values(nodes).forEach(n=>n.supply=Math.max(20,n.supply-4));add('补给优先级未调整，战区承受损失。','bad')}]]}else if(r<.66){title='地方势力接触';desc='一支地方组织提出合作，但要求公开承诺并承担政治风险。';choices=[['秘密接触',()=>{snapshot();s.points+=45;s.failure+=2;add('秘密接触成功获得资源，失败风险微升。','warn')}],['公开合作',()=>{snapshot();s.victory+=3;s.failure=Math.max(0,s.failure-1);nodes.tehran.stability+=6;add('公开合作改善了首都稳定度。','good')}]]}else{title='敌方指挥体系波动';desc='侦察显示敌方指挥链出现短暂异常，是进攻还是保存实力？';choices=[['集中行动',()=>{snapshot();nodes.isfahan.control+=9;s.points-=30;s.victory+=3;add('集中行动取得局部突破。','good')}],['继续侦查',()=>{snapshot();s.points+=10;add('继续侦查，获得额外情报资源。','good')}]]}showEvent(title,desc,choices)}
function showEvent(title,desc,choices){$('eventTag').textContent='突发事件 · 需要决策';$('eventTitle').textContent=title;$('eventDesc').textContent=desc;$('eventChoices').innerHTML=choices.map((x,i)=>`<button onclick="eventChoice(${i})">${x[0]}</button>`).join('');window._eventChoices=choices;$('eventMask').classList.add('show')}
function eventChoice(i){$('eventMask').classList.remove('show');snapshot();window._eventChoices[i][1]();window._eventChoices=null;render()}
function checkEnd(){if(s.victory>=80&&Object.values(nodes).filter(n=>n.side==='own'&&n.control>=65).length>=3){ending(true,'获得长期战略优势','胜利分达到目标，并且至少三个友军核心节点保持优势。');return true}if(s.failure>=92||Object.values(nodes).every(n=>n.control<35)){ending(false,'战局失去持续能力','失败分或关键控制度已不可逆地失衡。');return true}return false}
function ending(win,title,desc){s.ended=true;add(win?'战略目标达成，战局胜利。':'战局进入终局，指挥系统停止推进。',win?'good':'bad');$('endingTitle').textContent=title;$('endingDesc').textContent=desc+'\n胜利分 '+s.victory+' · 失败分 '+s.failure+' · 推进 '+s.day+' 天。';$('endingMask').classList.add('show')}
function restart(){localStorage.removeItem('svvip-v2-save');s=fresh();nodes.tehran.control=82;nodes.tehran.stability=76;nodes.tehran.supply=88;nodes.tabriz.control=64;nodes.tabriz.stability=58;nodes.tabriz.supply=72;nodes.isfahan.control=48;nodes.isfahan.stability=44;nodes.isfahan.supply=55;nodes.shiraz.control=76;nodes.shiraz.stability=69;nodes.shiraz.supply=63;nodes.bushehr.control=71;nodes.bushehr.stability=61;nodes.bushehr.supply=67;$('endingMask').classList.remove('show');render()}
function saveGame(){localStorage.setItem('svvip-v2-save',JSON.stringify(s));add('战局已保存到本机。','good');render();toast('战局已保存')}
function exportSave(){saveGame();let data={version:'v2.0',date:date(),state:s,nodes};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='抵抗之弧-战报-'+date()+'.json';a.click();URL.revokeObjectURL(url)}
function setView(el,type){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));el.classList.add('on');toast(type==='control'?'已切换为控制度视图':type==='supply'?'已切换为补给视图':'已切换为风险视图')}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').classList.remove('show'),1800)}
render();
</script>
</body>
</html>
