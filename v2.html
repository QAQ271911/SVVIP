<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抵抗之弧 · 战略实验场</title>
<style>
:root{--bg:#090d11;--panel:#111820;--panel2:#18212b;--line:#263340;--text:#edf2f5;--muted:#93a2ae;--amber:#e7ad55;--green:#64c89a;--red:#df746b;--cyan:#67b9d2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#18202a,#090d11 55%);color:var(--text);font-family:'Microsoft YaHei UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr 280px}.rail,.side{background:#0d1319cc;border-right:1px solid var(--line);padding:16px}.side{border-right:0;border-left:1px solid var(--line)}.main{display:flex;flex-direction:column}.top{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand b{color:var(--amber);letter-spacing:.08em}.stats{display:flex;gap:18px}.stat{text-align:right}.stat span{display:block;color:var(--muted);font-size:10px}.stat b{font-size:21px}.map{position:relative;flex:1;min-height:520px;overflow:hidden}.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px}.node{position:absolute;width:84px;height:84px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:#151e26dd;text-align:center;box-shadow:0 10px 30px #0009;transition:.25s}.node:hover,.node.selected{border-color:var(--amber);transform:translateY(-3px)}.node b{display:block;font-size:13px}.node i{font-style:normal;color:var(--muted);font-size:10px}.node.enemy{border-color:#a64d49}.node.own{border-color:#4aa27b}.arc{position:absolute;height:2px;background:linear-gradient(90deg,var(--amber),transparent);transform-origin:left center;opacity:.7}.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:12px;margin-bottom:10px}.panel h3{margin:0 0 8px;font-size:12px;color:var(--amber);letter-spacing:.12em}.meter{height:5px;background:#25303a;border-radius:4px;overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:var(--amber);transition:.4s}.actions{display:grid;gap:6px}.actions button,.top button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:4px;padding:8px}.actions button:hover,.top button:hover{border-color:var(--amber);color:var(--amber)}.difficulty{color:var(--amber)}.log{height:calc(100vh - 250px);overflow:auto}.log div{border-bottom:1px solid #ffffff08;padding:7px 0;font-size:12px;color:#bbc6cd}.log b{color:var(--amber)}.log .good{color:var(--green)}.log .bad{color:var(--red)}@media(max-width:900px){.shell{grid-template-columns:1fr}.rail,.side{display:none}.map{min-height:520px}}
</style>
</head>
<body>
<div class="shell">
<aside class="rail"><div class="panel"><h3>动态评估</h3><div class="difficulty" id="difficulty">标准</div><div class="meter"><i id="pressure" style="width:35%"></i></div><small id="reason" style="color:var(--muted)">局势尚未形成明显压力。</small></div><div class="panel"><h3>胜利目标</h3><div id="objective">控制核心据点并维持局势稳定。</div></div><div class="panel"><h3>资源态势</h3><div id="resources"></div></div></aside>
<main class="main"><header class="top"><div class="brand"><b>抵抗之弧</b><br><small id="date">2000.01.01</small></div><div class="stats"><div class="stat"><span>积分</span><b id="points">360</b></div><div class="stat"><span>胜利分</span><b id="victory">12</b></div><div class="stat"><span>失败分</span><b id="failure">8</b></div></div><div><button onclick="saveGame()">保存</button> <button onclick="exportSave()">导出</button> <button onclick="advanceDay()">推进一天</button></div></header><section class="map" id="map"><div class="grid"></div><div class="arc" style="left:26%;top:51%;width:18%;transform:rotate(-8deg)"></div><div class="arc" style="left:47%;top:47%;width:19%;transform:rotate(10deg)"></div><div class="node own selected" data-id="tehran" style="left:20%;top:43%"><div><b>德黑兰</b><i>核心 · 82%</i></div></div><div class="node own" data-id="tabriz" style="left:43%;top:24%"><div><b>大不里士</b><i>友军 · 64%</i></div></div><div class="node enemy" data-id="isfahan" style="left:43%;top:62%"><div><b>伊斯法罕</b><i>争夺 · 48%</i></div></div><div class="node enemy" data-id="bushehr" style="left:67%;top:44%"><div><b>布什尔</b><i>敌军 · 76%</i></div></div></section></main>
<aside class="side"><div class="panel"><h3 id="selectedName">德黑兰</h3><div id="selectedInfo"></div><div class="actions"><button onclick="action('reinforce')">强化据点 <span>−35</span></button><button onclick="action('intel')">侦查情报 <span>−25</span></button><button onclick="action('diplomacy')">外交施压 <span>−40</span></button></div></div><div class="panel"><h3>作战日志</h3><div class="log" id="log"></div></div></aside>
</div>
<script>
const nodes={tehran:{name:'德黑兰',side:'own',control:82,stability:76},tabriz:{name:'大不里士',side:'own',control:64,stability:58},isfahan:{name:'伊斯法罕',side:'enemy',control:48,stability:44},bushehr:{name:'布什尔',side:'enemy',control:76,stability:69}};
let s=JSON.parse(localStorage.getItem('svvip-v2-save')||'null')||{day:1,points:360,victory:12,failure:8,selected:'tehran',log:[{text:'指挥系统已上线，动态评估开始运行。',type:''}]};
const $=id=>document.getElementById(id);const names={reinforce:'强化据点',intel:'侦查情报',diplomacy:'外交施压'};
function date(){let d=new Date(2000,0, s.day);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')}
function assess(){let n=nodes[s.selected];let pressure=Math.max(0,Math.min(100,s.failure*1.7+(100-n.control)*.45+(100-n.stability)*.35-s.victory*.35));let level='轻松',reason='局势顺于目标，仍需避免资源膨胀。';if(pressure>62){level='地狱';reason='多重压力叠加，行动链可能随时断裂。'}else if(pressure>48){level='困难';reason='敌势与资源压力同时上升。'}else if(pressure>30){level='标准';reason='局势尚可控，关键节点需要保持关注。'}$('pressure').style.width=pressure+'%';$('difficulty').textContent=level;$('reason').textContent=reason}
function render(){$('date').textContent=date();$('points').textContent=s.points;$('victory').textContent=s.victory;$('failure').textContent=s.failure;let n=nodes[s.selected];$('selectedName').textContent=n.name;$('selectedInfo').innerHTML=`控制度：${n.control}%<div class="meter"><i style="width:${n.control}%"></i></div>稳定度：${n.stability}%<div class="meter"><i style="width:${n.stability}%"></i></div>`;$('resources').innerHTML=`<div>积分储备：${s.points}</div><div>胜率压力：${s.failure-s.victory}</div>`;assess();$('log').innerHTML=s.log.slice(-40).reverse().map(x=>`<div class="${x.type}"><b>${date()}</b> ${x.text}</div>`).join('')}
function add(text,type=''){s.log.push({text,type});if(s.log.length>100)s.log.shift()}
document.querySelectorAll('.node').forEach(e=>e.onclick=()=>{document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));e.classList.add('selected');s.selected=e.dataset.id;render()});
function action(type){let n=nodes[s.selected],cost={reinforce:35,intel:25,diplomacy:40}[type];if(s.points<cost){add('积分不足，行动未能执行。','bad');render();return}s.points-=cost;if(type==='reinforce'){n.control=Math.min(100,n.control+7);n.stability=Math.min(100,n.stability+5);s.victory+=1;add(`${n.name}完成强化，控制度提升至 ${n.control}%。`,'good')}if(type==='intel'){n.stability=Math.max(0,n.stability-2);s.victory+=2;add(`侦查显示${n.name}稳定度为 ${n.stability}%，情报已录入。`,'good')}if(type==='diplomacy'){n.control=Math.min(100,n.control+3);n.stability=Math.min(100,n.stability+7);s.victory+=1;s.failure=Math.max(0,s.failure-1);add(`向${n.name}施加外交压力，局势风险下降。`,'good')}render()}
function advanceDay(){s.day++;s.points+=18+Math.round(nodes.tehran.control*.12);let own=Object.values(nodes).filter(n=>n.side==='own').reduce((a,n)=>a+n.control,0)/2;let enemy=Object.values(nodes).filter(n=>n.side==='enemy').reduce((a,n)=>a+n.control,0)/2;if(own>=enemy){s.victory+=1;add('友军据点整体态势改善。','good')}else{s.failure+=1;add('敌方压力继续增长，失败分上升。','bad')}Object.values(nodes).forEach(n=>n.control=Math.max(20,Math.min(100,n.control+(n.side==='enemy'?1:-1)+Math.round(Math.random()*3-1))));if(s.victory>=80&&s.day>3650){add('长期目标达成，战略胜利。','good')}if(s.failure>=92){add('失败阈值已触发，战局进入终局。','bad')}render()}
function saveGame(){localStorage.setItem('svvip-v2-save',JSON.stringify(s));add('战局已保存到本机。','good');render()}
function exportSave(){saveGame();const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='svvip-save.json';a.click();URL.revokeObjectURL(url)}
render();
</script>
</body>
</html>
