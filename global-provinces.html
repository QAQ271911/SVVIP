<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>抵抗之弧 · 全球行政区划图层</title>
<style>
:root{color-scheme:dark;--bg:#090e13;--panel:#121a22;--line:#2b3945;--text:#eaf0f3;--muted:#91a1ac;--amber:#e5ad5c;--cyan:#68bbd3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Microsoft YaHei UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#10171e;border-bottom:1px solid var(--line);flex-wrap:wrap}.top b{color:var(--amber);letter-spacing:.08em}.top small{color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}select,input,button{font:inherit;color:var(--text);background:#18222c;border:1px solid var(--line);border-radius:4px;padding:8px 10px}select{min-width:min(360px,70vw)}button{cursor:pointer}button:hover{border-color:var(--amber);color:var(--amber)}.status{padding:7px 18px;background:#0d141a;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.mapbox{position:relative;flex:1;min-height:65vh;overflow:hidden;background:radial-gradient(ellipse,#1c2a34,#0b1117 74%)}svg{width:100%;height:100%;position:absolute;inset:0;touch-action:none;cursor:grab}svg.drag{cursor:grabbing}.graticule{stroke:#ffffff17;stroke-width:.7;fill:none;vector-effect:non-scaling-stroke}.province{fill:#738a82;stroke:#18232a;stroke-width:.75;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .1s}.province:nth-child(3n){fill:#8c967f}.province:nth-child(4n){fill:#728c98}.province:hover{fill:#e2ae61;stroke:#fff;stroke-width:1.2}.tip{position:absolute;display:none;pointer-events:none;background:#0b1118ed;border:1px solid #53616c;border-left:3px solid var(--amber);padding:7px 10px;font-size:12px;z-index:2;max-width:260px;box-shadow:0 6px 20px #0008}.tip b{display:block;color:var(--amber)}.tip span{color:var(--muted)}.foot{padding:9px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.foot a{color:var(--cyan)}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);pointer-events:none}.count{color:var(--amber)}@media(max-width:600px){.top{padding:10px}.toolbar{margin-left:0;width:100%}select{flex:1;min-width:0}.mapbox{min-height:68vh}}
</style>
</head>
<body>
<header class="top"><div><b>抵抗之弧 · 全球行政区划图层</b><br><small>全球国家一级行政区 / ADM1 · 在线加载、按需绘制</small></div><div class="toolbar"><input id="search" type="search" placeholder="搜索国家名称或 ISO3" aria-label="搜索国家"><select id="country" aria-label="选择国家" disabled><option>正在加载国家目录…</option></select><button id="reload" type="button">重新加载</button><button id="reset" type="button">重置视图</button></div></header>
<div class="status" id="status" role="status" aria-live="polite">正在连接 geoBoundaries 全球行政区划目录…</div>
<main class="mapbox" id="mapbox"><div class="empty" id="empty">选择国家后加载该国的省、州或其他一级行政区。<br>可拖动平移、滚轮缩放；点击区域查看名称。</div><div class="tip" id="tip"></div><svg id="map" viewBox="0 0 1200 650" aria-label="国家一级行政区地图"><g id="viewport"><g id="grid"></g><g id="features"></g></g></svg></main>
<footer class="foot"><span id="count">数据源：geoBoundaries gbOpen · CC BY 4.0（需署名）</span><span>地图仅供游戏推演展示；边界数据精度和年份因国家而异。</span><span><a href="https://www.geoboundaries.org/" target="_blank" rel="noopener">geoBoundaries 数据与许可</a></span></footer>
<script>
(()=>{'use strict';
const API='https://www.geoboundaries.org/api/current/gbOpen/ALL/ADM1/';
const $=id=>document.getElementById(id),status=$('status'),countrySelect=$('country'),search=$('search'),svg=$('map'),viewport=$('viewport'),featureGroup=$('features'),grid=$('grid'),tip=$('tip');
let catalog=[],activeFeatures=[],bounds=null,view={x:0,y:0,k:1},drag=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(text){status.textContent=text}
function recordsFrom(data){if(Array.isArray(data))return data;if(data&&Array.isArray(data.data))return data.data;if(data&&Array.isArray(data.boundaries))return data.boundaries;return []}
async function loadCatalog(){setStatus('正在获取全球 ADM1 国家目录…');countrySelect.disabled=true;try{const r=await fetch(API,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('目录请求失败（HTTP '+r.status+'）');const records=recordsFrom(await r.json()).filter(x=>x&&x.ISO&&x.gjDownloadURL);if(!records.length)throw Error('服务未返回可用的 GeoJSON 元数据');catalog=records.sort((a,b)=>String(a.boundaryName||a.name||a.ISO).localeCompare(String(b.boundaryName||b.name||b.ISO),'zh'));fillOptions();countrySelect.disabled=false;setStatus(`目录已就绪：${catalog.length} 个国家/地区可选。选择国家以加载一级行政区。`)}catch(e){setStatus('无法连接全球数据目录：'+e.message+'。请检查网络、浏览器跨域限制，或稍后重试。');countrySelect.innerHTML='<option value="">目录暂不可用</option>'}}
function label(c){return `${c.boundaryName||c.name||c.ISO} · ${c.ISO}`}
function fillOptions(filter=''){let current=countrySelect.value;let q=filter.trim().toLocaleLowerCase();let rows=catalog.filter(c=>!q||`${c.boundaryName||c.name||''} ${c.ISO}`.toLocaleLowerCase().includes(q));countrySelect.innerHTML='<option value="">选择国家 / 地区…</option>'+rows.map(c=>`<option value="${esc(c.ISO)}">${esc(label(c))}</option>`).join('');if(current&&rows.some(c=>c.ISO===current))countrySelect.value=current}
search.addEventListener('input',()=>fillOptions(search.value));
countrySelect.addEventListener('change',()=>{let rec=catalog.find(c=>c.ISO===countrySelect.value);if(rec)loadCountry(rec)});
function geoBounds(geo){let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;function coords(c){if(!Array.isArray(c))return;if(typeof c[0]==='number'&&typeof c[1]==='number'){minX=Math.min(minX,c[0]);maxX=Math.max(maxX,c[0]);minY=Math.min(minY,c[1]);maxY=Math.max(maxY,c[1]);return}for(const v of c)coords(v)}for(const f of geo.features||[])coords(f.geometry?.coordinates);if(!Number.isFinite(minX))throw Error('GeoJSON 中没有有效坐标');return{minX,minY,maxX,maxY}}
function pathForGeometry(g,b){if(!g)return'';let out='';const pt=([lon,lat])=>{let w=1080,h=550,pad=30,dx=b.maxX-b.minX||1,dy=b.maxY-b.minY||1,scale=Math.min((w-2*pad)/dx,(h-2*pad)/dy),offsetX=(w-dx*scale)/2,offsetY=(h-dy*scale)/2;return [60+offsetX+(lon-b.minX)*scale,50+offsetY+(b.maxY-lat)*scale]};function ring(a){if(!a?.length)return'';let p=a.map(pt);return 'M'+p.map(v=>v[0].toFixed(2)+','+v[1].toFixed(2)).join('L')+'Z'}function polygon(poly){return(poly||[]).map(ring).join('')}if(g.type==='Polygon')out=polygon(g.coordinates);else if(g.type==='MultiPolygon')out=g.coordinates.map(polygon).join('');return out}
function drawGrid(){let s='';for(let x=60;x<=1140;x+=90)s+=`<path class="graticule" d="M${x} 30V620"/>`;for(let y=50;y<=620;y+=60)s+=`<path class="graticule" d="M30 ${y}H1170"/>`;grid.innerHTML=s}
function applyView(){viewport.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`)}
function resetView(){view={x:0,y:0,k:1};applyView()}
$('reset').addEventListener('click',resetView);
async function loadCountry(meta){featureGroup.replaceChildren();activeFeatures=[];bounds=null;resetView();$('empty').style.display='grid';$('count').textContent='正在载入 '+label(meta)+'…';setStatus('正在下载 '+label(meta)+' 的边界 GeoJSON…');try{const r=await fetch(meta.gjDownloadURL,{headers:{Accept:'application/geo+json,application/json'}});if(!r.ok)throw Error('边界下载失败（HTTP '+r.status+'）');const geo=await r.json();if(!Array.isArray(geo.features))throw Error('下载内容不是有效 GeoJSON FeatureCollection');bounds=geoBounds(geo);activeFeatures=geo.features;const frag=document.createDocumentFragment();for(let i=0;i<geo.features.length;i++){const f=geo.features[i],p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',pathForGeometry(f.geometry,bounds));p.setAttribute('class','province');p.dataset.index=i;const prop=f.properties||{},name=prop.shapeName||prop.name||prop.NAME_1||prop.NAME||`行政区 ${i+1}`;p.setAttribute('aria-label',name);p.addEventListener('pointermove',ev=>showTip(ev,name,meta));p.addEventListener('pointerleave',()=>tip.style.display='none');p.addEventListener('click',()=>setStatus(`${meta.boundaryName||meta.name||meta.ISO} / ${name}`));frag.appendChild(p)}featureGroup.appendChild(frag);$('empty').style.display='none';$('count').innerHTML=`<span class="count">${geo.features.length}</span> 个一级行政区 · ${esc(meta.boundaryName||meta.name||meta.ISO)} · ${esc(meta.boundaryYear||meta.year||'年份未标注')}`;setStatus(`已加载 ${label(meta)}；点击各区查看名称。`)}catch(e){$('count').textContent='全球 ADM1 · 数据加载失败';setStatus('无法加载该国边界：'+e.message+'。可换一个国家，或检查数据源是否可访问。');$('empty').style.display='grid';$('empty').innerHTML='该国行政区数据暂不可用。<br>可选择其他国家，或点击“重新加载”重试。'}}
function showTip(ev,name,meta){let box=$('mapbox').getBoundingClientRect();tip.innerHTML=`<b>${esc(name)}</b><span>${esc(meta.boundaryName||meta.name||meta.ISO)} · ADM1</span>`;tip.style.display='block';tip.style.left=Math.min(ev.clientX-box.left+12,box.width-260)+'px';tip.style.top=Math.min(ev.clientY-box.top+12,box.height-70)+'px'}
svg.addEventListener('wheel',e=>{e.preventDefault();const factor=e.deltaY<0?1.12:.89;const rect=svg.getBoundingClientRect(),px=(e.clientX-rect.left)*1200/rect.width,py=(e.clientY-rect.top)*650/rect.height;let k=Math.max(.65,Math.min(14,view.k*factor));view.x=px-(px-view.x)*k/view.k;view.y=py-(py-view.y)*k/view.k;view.k=k;applyView()},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.province'))return;drag={x:e.clientX,y:e.clientY,ox:view.x,oy:view.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const rect=svg.getBoundingClientRect();view.x=drag.ox+(e.clientX-drag.x)*1200/rect.width;view.y=drag.oy+(e.clientY-drag.y)*650/rect.height;applyView()});function stop(){drag=null;svg.classList.remove('drag')}svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
$('reload').addEventListener('click',loadCatalog);drawGrid();loadCatalog();
})();
</script>
</body>
</html>
