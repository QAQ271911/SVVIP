<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>抵抗之弧 · 全球省区战略图</title>
<style>
:root{color-scheme:dark;--bg:#080d12;--panel:#111922;--line:#293947;--text:#edf2f4;--muted:#91a0aa;--amber:#e7b15e;--green:#62bc91;--red:#d66d65}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 30%,#1a2934,#080d12 75%);color:var(--text);font:14px "Microsoft YaHei UI",sans-serif}.shell{height:100%;display:grid;grid-template-rows:64px 1fr 28px}.top{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#0d141bdc}.brand b{color:var(--amber)}.search{margin-left:auto;display:flex;gap:6px}.search input,.search select{height:36px;border:1px solid var(--line);border-radius:4px;background:#151f28;color:var(--text);padding:0 10px}.search input{width:180px}.search select{width:270px}.top button,.panel button{height:36px;border:1px solid var(--line);background:#18232d;color:var(--text);border-radius:4px;padding:0 10px}.top button:hover,.panel button:hover{border-color:var(--amber);color:var(--amber)}.stage{min-height:0;display:grid;grid-template-columns:220px 1fr 250px}.rail,.detail{background:#0d1419cc;padding:12px;border-right:1px solid var(--line);overflow:auto}.detail{border-right:none;border-left:1px solid var(--line)}.box{border:1px solid var(--line);background:#111922;border-radius:5px;padding:11px;margin-bottom:9px}.box h3{margin:0 0 8px;font-size:10px;letter-spacing:.12em;color:var(--amber)}.map{position:relative;overflow:hidden}.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:44px 44px}svg{position:absolute;width:100%;height:100%;inset:0;touch-action:none}.province{fill:#799084;stroke:#152129;stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer}.province:nth-child(3n){fill:#718b99}.province:nth-child(5n){fill:#8c967c}.province:hover,.province.active{fill:#e4ad60;stroke:#fff;stroke-width:1.2}.graticule{fill:none;stroke:#fff1;stroke-width:.7}.tip{position:absolute;z-index:3;display:none;pointer-events:none;background:#0a1017;border-left:2px solid var(--amber);padding:7px 10px;font-size:11px}.status{color:var(--muted);font-size:11px;line-height:1.7}.meter{height:4px;background:#26333d;margin:6px 0;border-radius:3px}.meter i{display:block;height:100%;background:var(--green)}.news{display:flex;align-items:center;padding:0 12px;border-top:1px solid var(--line);background:#0d1419;font-size:10px;color:var(--muted)}.news b{color:var(--amber);margin-right:8px}@media(max-width:900px){.stage{grid-template-columns:1fr 220px}.rail{display:none}.search input{display:none}.search select{width:220px}}@media(max-width:650px){.stage{grid-template-columns:1fr}.detail{display:none}.search select{width:150px}.top{padding:0 8px}.brand span{display:none}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div class="brand"><b>抵抗之弧</b> <span>· 全球省区战略图</span></div><div class="search"><input id="search" placeholder="搜索国家或 ISO3"><select id="country"><option>正在加载国家目录…</option></select><button id="load">加载</button><button id="reset">重置</button></div></header>
<div class="stage"><aside class="rail"><div class="box"><h3>行政区统计</h3><div id="stats" class="status">尚未加载国家</div></div><div class="box"><h3>地图说明</h3><div class="status">ADM1 为一级行政区：省、州、邦、地区等。边界按需加载，不会预载全球几何。</div></div></aside><main class="map" id="map"><svg id="svg" viewBox="0 0 1200 700" aria-label="全球国家一级行政区"><g id="viewport"><g id="grid"></g><g id="features"></g></g></svg><div class="tip" id="tip"></div></main><aside class="detail"><div class="box"><h3>选中行政区</h3><div id="detail" class="status">请选择地图中的一级行政区。</div></div><div class="box"><h3>局势模拟</h3><div class="status">控制度</div><div class="meter"><i id="controlBar" style="width:50%"></i></div><button id="capture" style="width:100%;height:32px;margin-top:6px">记录控制意图</button></div></aside></div><footer class="news"><b>边界数据</b><span id="news">geoBoundaries gbOpen · CC BY 4.0 · 数据连接中</span></footer></div>
<script>
(()=>{'use strict';const API='https://www.geoboundaries.org/api/current/gbOpen/ALL/ADM1/';const $=id=>document.getElementById(id),country=$('country'),search=$('search'),svg=$('svg'),viewport=$('viewport'),features=$('features'),grid=$('grid'),tip=$('tip');let catalog=[],bounds=null,view={x:0,y:0,k:1},drag=null,selected=null,meta=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);
function gridDraw(){let s='';for(let x=50;x<1200;x+=100)s+=`<path class="graticule" d="M${x} 20V680"/>`;for(let y=50;y<700;y+=70)s+=`<path class="graticule" d="M20 ${y}H1180"/>`;grid.innerHTML=s}gridDraw();
async function catalogLoad(){try{const r=await fetch(API,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('目录 HTTP '+r.status);let data=await r.json();let rows=Array.isArray(data)?data:(data.data||data.boundaries||[]);catalog=rows.filter(x=>x&&x.ISO&&(x.gjDownloadURL||x.simplifiedGeometryGeoJSON)).sort((a,b)=>String(a.boundaryName||a.name||a.ISO).localeCompare(String(b.boundaryName||b.name||b.ISO),'zh'));fill();$('news').textContent=`目录就绪：${catalog.length} 个国家或地区可选择 · geoBoundaries gbOpen`;}catch(e){country.innerHTML='<option>目录加载失败</option>';$('news').textContent='目录加载失败：'+e.message}}
function nameOf(x){return x.boundaryName||x.name||x.ISO}function fill(){const q=search.value.trim().toLowerCase();const rows=catalog.filter(x=>!q||`${nameOf(x)} ${x.ISO}`.toLowerCase().includes(q));country.innerHTML='<option value="">选择国家…</option>'+rows.map(x=>`<option value="${esc(x.ISO)}">${esc(nameOf(x))} · ${esc(x.ISO)}</option>`).join('')}search.addEventListener('input',fill);
function boundsFor(g){let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;function walk(c){if(!Array.isArray(c))return;if(typeof c[0]=='number'&&typeof c[1]=='number'){minX=Math.min(minX,c[0]);maxX=Math.max(maxX,c[0]);minY=Math.min(minY,c[1]);maxY=Math.max(maxY,c[1]);return}c.forEach(walk)}(g.features||[]).forEach(f=>walk(f.geometry?.coordinates));return{minX,minY,maxX,maxY}}
function path(g,b){const pt=([lon,lat])=>{const dx=b.maxX-b.minX||1,dy=b.maxY-b.minY||1,scale=Math.min(1080/dx,560/dy),ox=(1200-dx*scale)/2,oy=(700-dy*scale)/2;return[ox+(lon-b.minX)*scale,oy+(b.maxY-lat)*scale]},ring=r=>{if(!r?.length)return'';return'M'+r.map(p=>pt(p).map(v=>v.toFixed(2)).join(',')).join('L')+'Z'},poly=p=>(p||[]).map(ring).join('');if(g.type==='Polygon')return poly(g.coordinates);if(g.type==='MultiPolygon')return g.coordinates.map(poly).join('');return''}
function apply(){viewport.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`)}function reset(){view={x:0,y:0,k:1};apply()}$('reset').onclick=reset;
async function load(){const rec=catalog.find(x=>x.ISO===country.value);if(!rec){$('news').textContent='请先选择国家';return}meta=rec;$('news').textContent='正在加载 '+nameOf(rec)+'…';try{const r=await fetch(rec.gjDownloadURL,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('边界 HTTP '+r.status);const geo=await r.json(),list=geo.features||[];if(!list.length)throw Error('该数据源没有 ADM1 图形');bounds=boundsFor(geo);reset();features.replaceChildren();list.forEach((f,i)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path'),pr=f.properties||{},name=pr.shapeName||pr.name||pr.NAME_1||pr.NAME||'一级行政区 '+(i+1);p.setAttribute('d',path(f.geometry,bounds));p.setAttribute('class','province');p.setAttribute('tabindex','0');p.setAttribute('aria-label',name);p.onclick=()=>select(p,name);p.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')select(p,name)};p.onpointermove=e=>showTip(e,name);p.onpointerleave=()=>tip.style.display='none';features.appendChild(p)});$('stats').innerHTML=`国家：${esc(nameOf(rec))}<br>ISO3：${esc(rec.ISO)}<br>一级行政区：<b>${list.length}</b>`;$('news').textContent=`已加载 ${nameOf(rec)}：${list.length} 个一级行政区 · <a href="https://www.geoboundaries.org/" target="_blank" style="color:var(--amber)">geoBoundaries</a>`}catch(e){$('news').textContent='加载失败：'+e.message+'；可切换其他国家重试'}}
function select(p,name){if(selected)selected.classList.remove('active');selected=p;p.classList.add('active');$('detail').innerHTML=`<b style="color:var(--amber)">${esc(name)}</b><br>国家：${esc(meta?nameOf(meta):'未知')}<br>行政级别：一级行政区（ADM1）<br>状态：待接入真实控制度`}
function showTip(e,name){tip.textContent=name;tip.style.display='block';const r=$('map').getBoundingClientRect();tip.style.left=Math.min(e.clientX-r.left+10,r.width-220)+'px';tip.style.top=Math.min(e.clientY-r.top+10,r.height-50)+'px'}$('load').onclick=load;
svg.onwheel=e=>{e.preventDefault();const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*1200/r.width,py=(e.clientY-r.top)*700/r.height,f=e.deltaY<0?1.12:.89,k=Math.max(.7,Math.min(12,view.k*f));view.x=px-(px-view.x)*k/view.k;view.y=py-(py-view.y)*k/view.k;view.k=k;apply()};svg.onpointerdown=e=>{if(e.target.classList.contains('province'))return;drag={x:e.clientX,y:e.clientY,ox:view.x,oy:view.y};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;const r=svg.getBoundingClientRect();view.x=drag.ox+(e.clientX-drag.x)*1200/r.width;view.y=drag.oy+(e.clientY-drag.y)*700/r.height;apply()};function stop(){drag=null}svg.onpointerup=stop;svg.onpointercancel=stop;
$('capture').onclick=()=>selected?($('detail').innerHTML=$('detail').innerHTML+'<br><span style="color:#62bc91">已记录当前控制意图。</span>'):$('detail').textContent='请先选择一个一级行政区。';catalogLoad();
})();
</script>
</body>
</html>
