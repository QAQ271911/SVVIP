<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>抵抗之弧 · 世界省区指挥系统</title>
<style>
:root{color-scheme:dark;--bg:#090e13;--panel:#111922;--panel2:#18232c;--line:#293945;--text:#edf2f4;--muted:#91a1ab;--amber:#e5af60;--green:#65bd94;--red:#d86d65}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;color:var(--text);background:radial-gradient(circle at 50% 30%,#1b2b35,#090e13 74%);font:14px "Microsoft YaHei UI",sans-serif}.shell{height:100%;display:grid;grid-template-rows:68px 1fr 30px}.top{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:#0d141bd9}.brand b{color:var(--amber);letter-spacing:.08em}.top-right{margin-left:auto;display:flex;gap:6px}.top input,.top select,.panel button,.top button{height:38px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);color:var(--text);padding:0 10px}.top input{width:170px}.top select{width:260px}.top button,.panel button{cursor:pointer}.top button:hover,.panel button:hover{border-color:var(--amber);color:var(--amber)}.stage{min-height:0;display:grid;grid-template-columns:230px 1fr 270px}.rail,.detail{min-height:0;overflow:auto;padding:12px;background:#0d1419c9}.rail{border-right:1px solid var(--line)}.detail{border-left:1px solid var(--line)}.panel{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:11px;margin-bottom:9px}.panel h3{margin:0 0 8px;font-size:10px;color:var(--amber);letter-spacing:.13em}.muted{color:var(--muted);font-size:11px;line-height:1.7}.statrow{display:flex;justify-content:space-between;margin:5px 0;font-size:11px}.meter{height:4px;border-radius:3px;background:#26343e;margin:6px 0;overflow:hidden}.meter i{display:block;height:100%;background:var(--green);transition:.35s}.map{position:relative;overflow:hidden}.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:44px 44px}.map svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.province{fill:#718b82;stroke:#18252d;stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer;transition:.12s}.province:nth-child(3n){fill:#738f9c}.province:nth-child(5n){fill:#8b947a}.province:hover,.province.active{fill:#e1aa61;stroke:#fff;stroke-width:1.15}.province.own{fill:#669d86}.province.enemy{fill:#a86560}.province.contested{fill:#bd9c5e}.graticule{fill:none;stroke:#fff12;stroke-width:.7}.tip{display:none;position:absolute;z-index:4;pointer-events:none;border-left:2px solid var(--amber);background:#0a1017f2;padding:7px 10px;font-size:11px;max-width:230px}.toast{position:fixed;z-index:20;bottom:44px;left:50%;transform:translate(-50%,18px);border:1px solid var(--amber);border-radius:4px;background:#17212a;padding:9px 14px;opacity:0;transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}.news{display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid var(--line);background:#0d1419;color:var(--muted);font-size:10px}.news b{color:var(--amber)}.actions{display:grid;gap:6px}.actions button{width:100%;height:32px}.actions button:disabled{opacity:.35}.fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}@media(max-width:980px){.stage{grid-template-columns:1fr 230px}.rail{display:none}.top input{display:none}}@media(max-width:650px){.stage{grid-template-columns:1fr}.detail{display:none}.top select{width:150px}.top-right{gap:3px}.top button{padding:0 7px}.brand span{display:none}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><b>抵抗之弧</b> <span>· 世界省区指挥系统</span></div><div class="top-right"><input id="search" type="search" placeholder="国家 / ISO3"><select id="country" aria-label="国家"><option>目录加载中…</option></select><button id="load">加载</button><button id="cache">清缓存</button></div></header>
<div class="stage"><aside class="rail"><div class="panel"><h3>行政区态势</h3><div id="stats" class="muted">尚未选择国家</div></div><div class="panel"><h3>本地缓存</h3><div id="cacheInfo" class="muted">暂无缓存</div></div></aside>
<main class="map" id="map"><svg id="svg" viewBox="0 0 1200 700" aria-label="国家一级行政区地图"><g id="viewport"><g id="grid"></g><g id="features"></g></g></svg><div class="fallback" id="fallback">选择国家后加载一级行政区<br><span class="muted">支持省、州、邦、地区等 ADM1 单元</span></div><div class="tip" id="tip"></div></main>
<aside class="detail"><div class="panel"><h3>选中区域</h3><div id="detail" class="muted">请选择行政区。</div></div><div class="panel"><h3>区域属性</h3><div class="statrow"><span>控制度</span><b id="controlText">50</b></div><div class="meter"><i id="controlBar" style="width:50%"></i></div><div class="statrow"><span>稳定度</span><b id="stabilityText">50</b></div><div class="meter"><i id="stabilityBar" style="width:50%"></i></div><div class="actions"><button id="ownBtn">标记为友方���制</button><button id="enemyBtn">标记为敌方控制</button><button id="contestedBtn">标记为争夺区域</button></div></div></aside></div>
<footer class="news"><b>边界数据</b><span id="news">geoBoundaries gbOpen · CC BY 4.0</span></footer></div>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const API='https://www.geoboundaries.org/api/current/gbOpen/ALL/ADM1/',CAT='svvip-adm1-catalog-v1',PREFIX='svvip-adm1-';const $=id=>document.getElementById(id);const search=$('search'),country=$('country'),svg=$('svg'),viewport=$('viewport'),features=$('features'),grid=$('grid'),tip=$('tip'),fallback=$('fallback');let catalog=[],meta=null,bounds=null,view={x:0,y:0,k:1},drag=null,selected=null,controlMap=JSON.parse(localStorage.getItem('svvip-adm1-control')||'{}');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function makeGrid(){let s='';for(let x=50;x<1200;x+=100)s+=`<path class="graticule" d="M${x} 20V680"/>`;for(let y=50;y<700;y+=70)s+=`<path class="graticule" d="M20 ${y}H1180"/>`;grid.innerHTML=s}makeGrid();
function nameOf(r){return r.boundaryName||r.name||r.ISO}
async function loadCatalog(force=false){$('news').textContent='正在加载全球 ADM1 国家目录…';try{let data=null;if(!force){try{data=JSON.parse(localStorage.getItem(CAT))}catch(e){}}if(!data){const r=await fetch(API,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('目录 HTTP '+r.status);data=await r.json();localStorage.setItem(CAT,JSON.stringify({time:Date.now(),data}))}const raw=data.data||data;catalog=(Array.isArray(raw)?raw:(raw.boundaries||raw.data||[])).filter(r=>r&&r.ISO&&(r.gjDownloadURL||r.simplifiedGeometryGeoJSON)).sort((a,b)=>nameOf(a).localeCompare(nameOf(b),'zh'));fillCatalog();$('news').textContent=`目录就绪：${catalog.length} 个国家或地区可选择${force?'（已刷新）':''}`;$('cacheInfo').textContent='目录缓存：'+new Date((data.time||Date.now())).toLocaleString()}catch(e){country.innerHTML='<option>目录加载失败</option>';$('news').textContent='目录加载失败：'+e.message}}
function fillCatalog(){const q=search.value.trim().toLowerCase(),rows=catalog.filter(r=>!q||`${nameOf(r)} ${r.ISO}`.toLowerCase().includes(q));country.innerHTML='<option value="">选择国家…</option>'+rows.map(r=>`<option value="${esc(r.ISO)}">${esc(nameOf(r))} · ${esc(r.ISO)}</option>`).join('')}search.oninput=fillCatalog;
function boundsFor(g){let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;function walk(c){if(!Array.isArray(c))return;if(typeof c[0]=='number'&&typeof c[1]=='number'){minX=Math.min(minX,c[0]);maxX=Math.max(maxX,c[0]);minY=Math.min(minY,c[1]);maxY=Math.max(maxY,c[1]);return}c.forEach(walk)}(g.features||[]).forEach(f=>walk(f.geometry?.coordinates));if(!isFinite(minX))throw Error('无有效坐标');return{minX,minY,maxX,maxY}}
function geometryPath(g,b){const pt=([lon,lat])=>{const dx=b.maxX-b.minX||1,dy=b.maxY-b.minY||1,scale=Math.min(1080/dx,560/dy),ox=(1200-dx*scale)/2,oy=(700-dy*scale)/2;return[ox+(lon-b.minX)*scale,oy+(b.maxY-lat)*scale]},ring=r=>r?.length?'M'+r.map(p=>pt(p).map(v=>v.toFixed(2)).join(',')).join('L')+'Z':'',poly=p=>(p||[]).map(ring).join('');if(g.type==='Polygon')return poly(g.coordinates);if(g.type==='MultiPolygon')return g.coordinates.map(poly).join('');return''}
function apply(){viewport.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`)}function reset(){view={x:0,y:0,k:1};apply()}
async function loadCountry(){const r=catalog.find(x=>x.ISO===country.value);if(!r){toast('请先选择国家');return}meta=r;fallback.style.display='grid';fallback.innerHTML='正在加载一级行政区…';$('news').textContent='正在加载 '+nameOf(r)+' 的边界…';try{const key=PREFIX+r.ISO;let geo=null;try{geo=JSON.parse(localStorage.getItem(key))}catch(e){}if(!geo){const q=await fetch(r.gjDownloadURL,{headers:{Accept:'application/json'}});if(!q.ok)throw Error('边界 HTTP '+q.status);geo=await q.json();if(!geo.features)throw Error('不是有效 FeatureCollection');try{localStorage.setItem(key,JSON.stringify(geo))}catch(e){$('cacheInfo').textContent+='；此国家文件过大，浏览器未能缓存'}}bounds=boundsFor(geo);const list=geo.features||[];reset();features.replaceChildren();list.forEach((f,i)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path'),pr=f.properties||{},name=pr.shapeName||pr.name||pr.NAME_1||pr.NAME||'一级行政区 '+(i+1),id=r.ISO+'-'+i,state=(controlMap[r.ISO]||{})[i];p.setAttribute('d',geometryPath(f.geometry,bounds));p.setAttribute('class','province '+(state||''));p.setAttribute('tabindex','0');p.setAttribute('aria-label',name);p.dataset.id=id;p.dataset.index=i;p.dataset.name=name;p.onclick=()=>select(p);p.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')select(p)};p.onpointermove=e=>showTip(e,name);p.onpointerleave=()=>tip.style.display='none';features.appendChild(p)});fallback.style.display='none';$('stats').innerHTML=`国家：${esc(nameOf(r))}<br>ISO3：${esc(r.ISO)}<br>一级行政区：<b>${list.length}</b>`;$('cacheInfo').textContent='目录与已加载边界支持本地缓存';$('news').innerHTML=`已加载 ${esc(nameOf(r))}：${list.length} 个 ADM1 区域 · <a href="https://www.geoboundaries.org/" target="_blank" style="color:var(--amber)">geoBoundaries</a>`}catch(e){fallback.style.display='grid';fallback.innerHTML='行政区数据加载失败<br><span class="muted">'+esc(e.message)+'</span>';$('news').textContent='加载失败：'+e.message}}
function showTip(e,name){tip.textContent=name;tip.style.display='block';const r=$('map').getBoundingClientRect();tip.style.left=Math.min(e.clientX-r.left+12,r.width-240)+'px';tip.style.top=Math.min(e.clientY-r.top+12,r.height-55)+'px'}
function select(p){if(selected)selected.classList.remove('active');selected=p;p.classList.add('active');const i=p.dataset.index,name=p.dataset.name,r=controlMap[meta.ISO]?.[i],n=r&&r.control!=null?r.control:50,s=r&&r.stability!=null?r.stability:50;$('detail').innerHTML=`<b style="color:var(--amber)">${esc(name)}</b><br>国家：${esc(nameOf(meta))}<br>行政级别：一级行政区（ADM1）<br>数据状态：已加载边界`;setBars(n,s)}
function setBars(c,s){$('controlText').textContent=c;$('controlBar').style.width=c+'%';$('stabilityText').textContent=s;$('stabilityBar').style.width=s+'%'}
function setState(state){if(!selected||!meta){toast('请先选择行政区');return}const i=selected.dataset.index,name=selected.dataset.name;selected.classList.remove('own','enemy','contested');selected.classList.add(state);controlMap[meta.ISO]=controlMap[meta.ISO]||{};const old=controlMap[meta.ISO][i]||{control:50,stability:50};const delta={own:[8,5],enemy:[-8,-5],contested:[0,-2]}[state];const c=Math.max(0,Math.min(100,old.control+(delta[0]||0))),s=Math.max(0,Math.min(100,old.stability+(delta[1]||0)));controlMap[meta.ISO][i]={control:c,stability:s};localStorage.setItem('svvip-adm1-control',JSON.stringify(controlMap));setBars(c,s);$('detail').innerHTML=`<b style="color:var(--amber)">${esc(name)}</b><br>国家：${esc(nameOf(meta))}<br>状态：${state==='own'?'友方控制':state==='enemy'?'敌方控制':'争夺区域'}<br>控制度：${c} · 稳定度：${s}`;toast('区域态势已保存')}
$('ownBtn').onclick=()=>setState('own');$('enemyBtn').onclick=()=>setState('enemy');$('contestedBtn').onclick=()=>setState('contested');$('load').onclick=loadCountry;$('cache').onclick=()=>{Object.keys(localStorage).filter(k=>k===CAT||k.startsWith(PREFIX)).forEach(k=>localStorage.removeItem(k));$('cacheInfo').textContent='边界与目录缓存已清除';toast('地图缓存已清除')};
svg.onwheel=e=>{e.preventDefault();const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*1200/r.width,py=(e.clientY-r.top)*700/r.height,f=e.deltaY<0?1.12:.89,k=Math.max(.7,Math.min(12,view.k*f));view.x=px-(px-view.x)*k/view.k;view.y=py-(py-view.y)*k/view.k;view.k=k;apply()};svg.onpointerdown=e=>{if(e.target.classList.contains('province'))return;drag={x:e.clientX,y:e.clientY,ox:view.x,oy:view.y};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;const r=svg.getBoundingClientRect();view.x=drag.ox+(e.clientX-drag.x)*1200/r.width;view.y=drag.oy+(e.clientY-drag.y)*700/r.height;apply()};svg.onpointerup=()=>drag=null;svg.onpointercancel=()=>drag=null;
loadCatalog();
})();
</script>
</body>
</html>
