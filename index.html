<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大时代：五线史诗 v0.1.11</title>
<style>
:root{--bg:#08121d;--panel:#102131;--line:#2b4d69;--text:#edf7ff;--muted:#9eb8cd;--gold:#f5d17a;--blue:#6ebaff;--green:#79e2a6;--red:#ff8888;--purple:#d3b1ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif}.app{max-width:1460px;margin:auto;padding:22px 18px 40px}.top,.panel{background:rgba(16,33,49,.97);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 22px #0005}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;margin-bottom:18px}.brand{font-size:1.7rem;font-weight:700;color:var(--gold)}.version{display:inline-block;margin-left:8px;padding:5px 9px;border:1px solid #f5d17a66;border-radius:99px;color:var(--gold);font-size:.75rem}.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.year{padding:9px 13px;border:1px solid #6ebaff55;border-radius:10px;background:#6ebaff1c}.btn,.choice,.action{color:var(--text);border:1px solid var(--line);border-radius:10px;background:#ffffff08;cursor:pointer;font-weight:700}.btn{padding:10px 15px}.btn.main{background:linear-gradient(#8f6a1a,#654a0a);border-color:#f5d17a88}.grid{display:grid;grid-template-columns:1.05fr 1.7fr 1.2fr;gap:18px;margin-bottom:18px}.panel{padding:16px}.panel h2{margin:0 0 12px;font-size:1.08rem;display:flex;justify-content:space-between;gap:8px}.sub,small,.muted{color:var(--muted);font-weight:400;font-size:.8rem}select{width:100%;padding:10px;background:#ffffff0a;border:1px solid var(--line);border-radius:10px;color:var(--text);margin-bottom:10px}.card,.metric,.region,.goal,.log{background:#ffffff05;border:1px solid var(--line);border-radius:12px;padding:11px}.card{margin-bottom:10px}.card h3{margin:0 0 7px;color:var(--gold);font-size:.94rem}.card p{margin:0;color:var(--muted);line-height:1.55;font-size:.9rem}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric .head{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-bottom:6px}.bar{height:7px;background:#ffffff0c;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:5px 8px;border-radius:99px;background:#f5d17a14;border:1px solid #f5d17a55;color:var(--gold);font-size:.75rem}.regions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.region{text-align:center}.region b{display:block;font-size:1.05rem;margin-top:5px}.actions{display:grid;gap:9px}.action{text-align:left;padding:11px}.action:hover,.choice:hover{border-color:#6ebaff99}.action-head{display:flex;justify-content:space-between;margin-bottom:5px}.cost{color:var(--gold);font-size:.78rem}.bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.list{display:grid;gap:8px;max-height:340px;overflow:auto}.log{font-size:.88rem;line-height:1.5;border-left:3px solid var(--blue)}.goals{display:grid;gap:8px}.goal{display:flex;justify-content:space-between;gap:8px}.chip{padding:4px 8px;border-radius:99px;font-size:.72rem;white-space:nowrap}.done{background:var(--green);color:#06140e}.todo{background:#ffffff0b}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#01050ab8;z-index:3}.modal.show{display:flex}.modal-box{width:min(720px,calc(100vw - 28px));padding:20px;background:#0d1c2a;border:1px solid var(--line);border-radius:18px}.modal h2{margin:0 0 10px;color:var(--gold)}.modal p{color:var(--muted);line-height:1.7}.choices{display:grid;gap:10px}.choice{text-align:left;padding:12px}.choice b,.choice small{display:block}.choice b{margin-bottom:4px}@media(max-width:1100px){.grid,.bottom{grid-template-columns:1fr}}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.regions{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app">
<header class="top"><div><span class="brand">大时代 · 五线史诗</span><span class="version">v0.1.11</span></div><div class="topright"><span class="year" id="year"></span><button class="btn main" id="next">推进一年</button><button class="btn" id="save">保存</button><button class="btn" id="reset">重置</button></div></header>
<div class="grid"><aside class="panel"><h2>国家与制度 <span class="sub">选择你的历史路径</span></h2><select id="nation"></select><select id="route"></select><div class="card"><h3 id="lineName"></h3><p id="lineDesc"></p></div><div class="card"><h3>制度与地缘</h3><p id="institution"></p></div><div class="stats" id="stats"></div></aside>
<main class="panel"><h2>历史舞台 <span class="sub">每个选择都会留下后果</span></h2><div class="card"><h3>时代锚点</h3><p id="anchor"></p></div><div class="card"><h3>国策特长</h3><div class="tags" id="traits"></div><p id="traitDesc" style="margin-top:9px"></p></div><div class="card"><h3>政治叙事</h3><p id="narrative"></p></div><div class="card"><h3>地区格局</h3><div class="regions" id="regions"></div></div></main>
<aside class="panel"><h2>战略行动 <span class="sub">每年一次</span></h2><div class="actions" id="actions"></div></aside></div>
<div class="bottom"><section class="panel"><h2>历史日志 <span class="sub">角色、政党与事件</span></h2><div class="list" id="logs"></div></section><section class="panel"><h2>结局树 <span class="sub">你的国家将走向哪里</span></h2><div class="goals" id="goals"></div></section></div></div>
<div class="modal" id="modal"><div class="modal-box"><h2 id="eventTitle"></h2><p id="eventText"></p><div class="choices" id="choices"></div></div></div>
<script>
const VERSION='0.1.11', YEARS={start:1830,end:1950}, METRICS=['经济','军力','科技','稳定','财政','威望','人口','影响','社会','产业','贸易','军需'];
const anchors={1830:'工业革命与铁路扩张改写国家能力。',1848:'革命浪潮让旧制度与新社会正面相撞。',1871:'统一与民族国家重构大陆力量平衡。',1914:'世界大战把工业、财政与社会动员推向极限。',1918:'战后秩序与民族自决重新划分世界。',1929:'信贷崩溃考验国家的社会契约。',1939:'全球冲突迫使每个政权重新选择。',1945:'旧帝国退场，新秩序开始成形。'};
const countries={
'大英帝国':{base:{经济:75,军力:68,科技:72,稳定:76,财政:620,威望:78,人口:240,影响:81,社会:58,产业:55,贸易:52,军需:60},tags:['海权','工业','金融'],institution:'议会君主制；海岛防御、殖民航线与金融网络构成地缘优势。',trait:'海上霸权：贸易和影响增长更快，但海军维护会持续消耗财政。',bias:{贸易:2,影响:2}},
'清王朝':{base:{经济:58,军力:62,科技:52,稳定:60,财政:410,威望:64,人口:360,影响:68,社会:58,产业:55,贸易:52,军需:60},tags:['帝国','农业','改革'],institution:'皇权官僚制；人口与纵深巨大，但边疆压力和制度惯性拖慢现代化。',trait:'人口纵深：社会与人口恢复较强；改革若失败会放大稳定损失。',bias:{人口:3,社会:1}},
'法兰西':{base:{经济:66,军力:67,科技:69,稳定:72,财政:540,威望:74,人口:200,影响:73,社会:58,产业:55,贸易:52,军需:60},tags:['革命','文化','共和'],institution:'制度竞争激烈；大陆核心位置带来文化威望，也带来革命与战争风险。',trait:'革命传统：改革与威望收益高，但党派撕裂更容易冲击稳定。',bias:{威望:2,科技:1}},
'德意志':{base:{经济:61,军力:74,科技:70,稳定:67,财政:500,威望:71,人口:190,影响:70,社会:58,产业:55,贸易:52,军需:60},tags:['统一','军备','工业'],institution:'联邦帝国；铁路、军工与官僚体系强，邻国围堵使外交成本上升。',trait:'军工国家：产业、军需与军力协同；过度军备会伤害稳定。',bias:{产业:2,军需:2}},
'日本':{base:{经济:57,军力:66,科技:63,稳定:64,财政:430,威望:69,人口:180,影响:62,社会:58,产业:55,贸易:52,军需:60},tags:['转型','海军','近代化'],institution:'中央集权转型国家；岛国资源有限，必须在海军、贸易与工业之间取舍。',trait:'转型韧性：科技行动成本较低，但资源与财政波动更明显。',bias:{科技:2,产业:1}},
'美国':{base:{经济:64,军力:63,科技:73,稳定:75,财政:610,威望:72,人口:210,影响:79,社会:58,产业:55,贸易:52,军需:60},tags:['新大陆','工业','扩张'],institution:'联邦共和制；大陆资源与市场规模巨大，远洋影响力随工业化释放。',trait:'大陆资源：经济与产业增长快，但扩张会增加社会矛盾。',bias:{经济:2,产业:2}}
};
const routes={history:{name:'真实主线',desc:'尊重历史骨架，在约束中争取最优解。',bonus:{稳定:2}},reform:{name:'宪政改革',desc:'用法治、教育与社会妥协重写现代化。',bonus:{社会:4,威望:2}},federation:{name:'海洋联邦',desc:'用贸易、海权与外交网络改写全球秩序。',bonus:{贸易:4,影响:3}},industrial:{name:'工业跃迁',desc:'用技术革命和重工业拉开时代差距。',bonus:{科技:4,产业:5}},equilibrium:{name:'大陆均衡',desc:'用军备、联盟和地缘威慑保住国家地位。',bonus:{军力:4,军需:4}}};
const actions=[{id:'industry',name:'工业化建设',cost:40,desc:'工厂、铁路与城市基础设施。',e:{经济:12,科技:4,产业:10,财政:-35,威望:2}},{id:'army',name:'军制改革',cost:35,desc:'整顿编制，提高训练与后勤。',e:{军力:9,稳定:3,军需:8,财政:-25}},{id:'education',name:'教育改革',cost:25,desc:'扩展学校体系与科教投入。',e:{科技:6,稳定:4,社会:5,财政:-15,威望:2}},{id:'diplomacy',name:'外交扩展',cost:30,desc:'建立协作网络与贸易机会。',e:{影响:8,贸易:4,威望:3,财政:-18}}];
const routeActions={reform:[{name:'扩大议会',cost:30,desc:'提高制度合法性与社会参与。',e:{稳定:8,社会:8,威望:7,财政:-20}}],federation:[{name:'海军扩张',cost:35,desc:'控制航线并维护海外网络。',e:{影响:9,贸易:6,军力:5,财政:-25}}],industrial:[{name:'钢铁与电力',cost:40,desc:'以重工业换取技术与产能。',e:{科技:9,经济:14,产业:12,财政:-30}}],equilibrium:[{name:'战略铁路',cost:32,desc:'连接军工、资源与边疆。',e:{军力:7,经济:6,产业:7,军需:10,财政:-23}}],history:[]};
const events=[
{id:'1848',year:1848,title:'1848：改革压力',text:'城市工人、知识分子与旧精英都要求重新定义国家。谁能代表未来？',choices:[{n:'压制动乱',e:{稳定:5,威望:-5,社会:-9,财政:-8},r:'秩序暂时恢复，但民怨进入地下。',f:'保守派'} ,{n:'召集改革会议',e:{稳定:7,威望:6,社会:9,财政:-12},r:'改革派获得合法舞台，社会契约被重新书写。',f:'改革派'},{n:'技术官僚接管',e:{科技:5,经济:4,稳定:-3,社会:-3},r:'效率提高，却让政治参与者感到被排除。',f:'官僚集团'}]},
{id:'1871',year:1871,title:'1871：统一与均势',text:'新的民族国家改变大陆格局。军方、外交官和商人给出了不同答案。',choices:[{n:'强化军事均势',e:{军力:10,军需:8,稳定:-4,财政:-20},r:'威慑增强，邻国也开始重新计算你的意图。',f:'军方'},{n:'推动外交协商',e:{影响:8,威望:6,贸易:5,财政:-10},r:'外交空间扩大，商业集团获得安全感。',f:'外交派'}]},
{id:'1914',year:1914,title:'1914：世界大战',text:'动员、谈判或中立都会留下代价。你的制度能承受总动员吗？',choices:[{n:'全面动员',e:{军力:12,军需:12,稳定:-8,社会:-6,财政:-30},r:'战争机器启动，但每个家庭都开始支付代价。',f:'军方'},{n:'高压外交',e:{影响:6,稳定:5,威望:2,财政:-12},r:'暂时避免全面冲突，外交官赢得了时间。',f:'外交派'}]},
{id:'1929',year:1929,title:'1929：经济危机',text:'银行、工厂和家庭同时失去安全感。救市意味着债务，紧缩意味着失业。',choices:[{n:'大规模救市',e:{财政:-26,稳定:4,经济:5,产业:5,社会:6},r:'财政承压，但社会相信政府仍会承担责任。',f:'改革派'},{n:'坚持紧缩',e:{财政:10,稳定:-5,经济:-6,贸易:-8,社会:-8},r:'账面得到修复，政治信任却迅速流失。',f:'保守派'}]},
{id:'1945',year:1945,title:'1945：新世界',text:'战争结束，帝国、民族国家与新国际组织争夺未来叙事。',choices:[{n:'参与新秩序',e:{影响:10,稳定:6,贸易:5,财政:-14},r:'国家在新秩序中获得发言权。',f:'外交派'},{n:'保持强硬威慑',e:{军力:9,军需:7,稳定:-4,财政:-20},r:'安全感提高，但旧式权力政治仍在延续。',f:'军方'}]}
];
let S={year:1830,country:'大英帝国',route:'history',stats:{},logs:[],used:false,ended:false,flags:{},faction:'未知'};const $=id=>document.getElementById(id);function clamp(){METRICS.forEach(k=>{S.stats[k]=Number(S.stats[k]||0);if(k==='财政')S.stats[k]=Math.round(S.stats[k]);else if(k==='人口')S.stats[k]=Math.max(1,Math.round(S.stats[k]));else S.stats[k]=Math.max(0,Math.min(100,Math.round(S.stats[k])))});}function apply(e){Object.keys(e).forEach(k=>S.stats[k]=(S.stats[k]||0)+e[k]);clamp()}function era(y){return y<=1850?'工业前夜':y<=1875?'扩张时代':y<=1900?'大国博弈':y<=1918?'世界大战':y<=1930?'重组时代':y<=1945?'全球冲突':'战后秩序'}function log(t){S.logs.unshift(t);S.logs=S.logs.slice(0,40)}function country(){return countries[S.country]}function route(){return routes[S.route]}
function reset(){const c=country();S.year=1830;S.used=false;S.ended=false;S.logs=[];S.flags={};S.faction='未知';S.stats={...c.base};apply(c.bias);apply(route().bonus);log(`${S.country} 于 1830 年起步，选择路线：${route().name}。`);render()}function candidates(){return events.filter(e=>e.year===S.year&&!S.flags[e.id])}function show(e){S.event=e;$('eventTitle').textContent=e.title;$('eventText').textContent=e.text;$('choices').innerHTML=e.choices.map((c,i)=>`<button class="choice" data-i="${i}"><b>${c.n}</b><small>${c.r}</small></button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i));$('modal').classList.add('show')}function choose(i){const e=S.event,c=e.choices[i];if(!c)return;apply(c.e);S.flags[e.id]=c.n;S.faction=c.f;log(`${S.year}年：${e.title} → ${c.n}。${c.r}`);$('modal').classList.remove('show');S.event=null;render()}function action(id){if(S.used||S.ended)return;const a=[...actions,...(routeActions[S.route]||[])][id];if(!a)return;if(S.stats.财政<a.cost){log(`${S.year}年：财政不足，无法执行“${a.name}”。`);render();return}apply({财政:-a.cost,...a.e});S.used=true;log(`${S.year}年：执行“${a.name}”。`);render()}function end(){const s=S.stats;let title='漫长延续';if(s.稳定<25)title='崩解与革命';else if(s.军力>=85&&s.影响>=80)title='大陆霸权';else if(s.科技>=85&&s.经济>=80)title='工业巨人';else if(s.稳定>=80&&s.威望>=80)title='宪政强国';else if(s.贸易>=85&&s.影响>=85)title='海洋霸权';log(`1950年结局：${title}。${S.faction}在最后阶段留下了决定性影响。`);S.ended=true;render()}function next(){if(S.ended||$('modal').classList.contains('show'))return;if(S.year>=1950){end();return}S.year++;S.used=false;const s=S.stats;s.财政+=Math.max(18,Math.round(24+s.经济*.35-s.军力*.1));s.社会+=2+(S.route==='reform'?2:0);s.贸易+=S.route==='federation'?2:1;s.产业+=S.route==='industrial'?3:1;s.军需+=S.route==='equilibrium'?2:0;if(s.财政<0){s.稳定-=4;s.威望-=2;log(`${S.year}年：债务压力削弱了政权合法性。`)}if(s.社会<35){s.稳定-=5;log(`${S.year}年：社会不安开始扩散。`)}clamp();const es=candidates();if(es.length){log(`${S.year}年：${es[0].title}正在发生。`);show(es[0])}render()}
function render(){const c=country(),r=route();$('year').textContent=`${S.year}年 · ${era(S.year)}`;$('nation').value=S.country;$('route').value=S.route;$('lineName').textContent=r.name;$('lineDesc').textContent=r.desc;$('institution').textContent=c.institution;$('anchor').textContent=anchors[S.year]||'结构性变化正在累积，下一次选择可能改变时代。';$('traits').innerHTML=c.tags.map(x=>`<span class="tag">${x}</span>`).join('');$('traitDesc').textContent=c.trait;$('narrative').textContent=`${S.faction}正在争取影响力。${S.year<1875?'旧秩序与现代化的冲突仍是主线。':S.year<1914?'政党、军方和产业集团正在争夺国家方向。':'战争与危机使每个政治选择都带有不可逆的代价。'}`;$('stats').innerHTML=METRICS.map(k=>{let v=S.stats[k],w=k==='财政'?Math.max(5,Math.min(100,(v+500)/12)):k==='人口'?Math.min(100,v/4):v;return `<div class="metric"><div class="head"><span>${k}</span><b>${v}</b></div><div class="bar"><i style="width:${w}%;background:${k==='稳定'?'var(--green)':k==='军力'?'var(--red)':k==='财政'?'var(--gold)':'var(--blue)'}"></i></div></div>`}).join('');let core=(S.stats.影响+S.stats.军力+S.stats.经济+S.stats.产业)/4;$('regions').innerHTML=['欧洲','东亚','南亚','中东','非洲','美洲'].map((n,i)=>`<div class="region"><span class="muted">${n}</span><b>${Math.round(Math.min(100,Math.max(10,core*(.72+i*.08))))}</b></div>`).join('');const as=[...actions,...(routeActions[S.route]||[])];$('actions').innerHTML=as.map((a,i)=>`<button class="action" ${S.used||S.ended?'disabled':''} data-i="${i}"><div class="action-head"><span>${a.name}</span><span class="cost">${a.cost}财</span></div><small>${a.desc}</small></button>`).join('');document.querySelectorAll('.action').forEach(b=>b.onclick=()=>action(+b.dataset.i));$('logs').innerHTML=(S.logs.length?S.logs:['暂无历史记录。']).map(x=>`<div class="log">${x}</div>`).join('');const goals=[['跨越时代',S.year>=1950],['制度稳定',S.stats.稳定>=70],['工业化',S.stats.科技>=80&&S.stats.产业>=75],['国际影响',S.stats.影响>=80],['财政生存',S.stats.财政>=0]];$('goals').innerHTML=goals.map(g=>`<div class="goal"><span>${g[0]}</span><span class="chip ${g[1]?'done':'todo'}">${g[1]?'已达成':'待达成'}</span></div>`).join('')}
function save(){localStorage.setItem('SVVIP_SAVE',JSON.stringify(S));log('游戏已保存。');render()}function load(){try{const x=JSON.parse(localStorage.getItem('SVVIP_SAVE'));if(x){S={...S,...x};S.stats={...S.stats};clamp();return true}}catch(e){}return false}
function init(){Object.keys(countries).forEach(n=>$('nation').add(new Option(n,n)));Object.keys(routes).forEach(k=>$('route').add(new Option(routes[k].name,k)));$('nation').onchange=e=>{S.country=e.target.value;reset()};$('route').onchange=e=>{S.route=e.target.value;reset()};$('next').onclick=next;$('save').onclick=save;$('reset').onclick=reset;if(!load())reset();else render()}init();
</script></body></html>
