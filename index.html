{id:'e1914',year:1914,title:'1914：世界大战',text:'动员、谈判或中立都会留下代价。',choices:[['全面动员','国力提升，但社会与财政受压。',{军力:14,军需:14,财政:-35,社会:-7,稳定:-6},{军方:22,保守派:12}],['有限动员','先保住国力，再扭转局势。',{稳定:4,经济:6,军力:8,财政:-18},{外交派:15,商业派:8}],['中立求稳','财政与社会受益，国际影响下降。',{财政:20,稳定:5,影响:-10,威望:-4},{外交派:18,商业派:6}]]},

const $=id=>document.getElementById(id);
function clamp(){METRICS.forEach(k=>{let v=Number(state.stats[k]||0);state.stats[k]=k==='财政'?Math.round(v):k==='人口'?Math.max(0,Math.min(500,v)):Math.max(0,Math.min(100,v))})}

function pressure(){let s=state.stats,avg=state.regions.reduce((a,r)=>a+r.heat,0)/state.regions.length;return Math.round(Math.max(0,Math.min(100,(100-s.稳定)*.4+(100-s.威望)*.16+avg*.44+(100-s.财政/6)*.12)))}

function available(){let e=EVENTS.find(x=>x.year===state.year&&!state.flags[x.id]);if(e)return e;let h=[...state.regions].sort((a,b)=>b.heat-a.heat)[0];if(h&&h.heat>70)return{id:'crisis_'+state.year+'_'+h.name,title:state.year+'：'+h.name+'割据危机',text:`${h.contender}正在${h.name}集结力量，地区潜力与国家政治冲突叠加。`,choices:[['镇压并整编','短期恢复秩序，社会受损。',{稳定:8,军力:5,社会:-8,财政:-22},{军方:20,地方派:10}],['地方自治改革','延缓叛乱，但中央控制下降。',{稳定:5,社会:8,影响:7,财政:-15},{改革派:15,地方派:18}],['联合当地名士','提高合法性，削弱割据。',{稳定:6,威望:7,社会:5,财政:-12},{工党:10,外交派:8}]]};return null}
function actionList(){let x=[...ACTIONS],n=route()[0];if(n==='宪政改革')x.push(['parliament','扩大议会',30,'提高制度合法性与社会参与。',{稳定:8,社会:8,威望:7,财政:-20}]);if(n==='海洋联邦')x.push(['navy','海军扩张',35,'控制航线并维护海外网络。',{影响:9,贸易:6,军力:5,财政:-25}]);if(n==='工业跃迁')x.push(['steel','钢铁与电力',40,'以重工业换取技术与产能。',{科技:9,经济:14,产业:12,财政:-30}]);if(n==='大陆均衡')x.push(['railway','战略铁路',32,'连接军工、资源与边疆。',{军力:7,经济:6,产业:7,军需:10,财政:-23}]);return x}
function render(){let c=country(),r=route();$('year').textContent=`${state.year}年 · ${era(state.year)}`;$('nation').value=state.country;$('route').value=state.route;$('anchor').textContent=anchors[state.year]||'结构性变化正在累积，下一次选择可能改变时代。';$('institution').textContent=c.institution;$('tags').innerHTML=c.tags.map(x=>`<span class="tag">${x}</span>`).join('')+` <span class="tag">${r[0]}</span>`;$('trait').textContent=c.trait+' '+r[1];state.ai=advice();$('ai').textContent=state.ai;$('leaderName').textContent=`${state.leader.name} · ${state.leader.authority}权威`;$('leaderDesc').textContent=`${c.mood} 领袖风格：${state.leader.reform>65?'改革型':state.leader.ruthlessness>55?'铁腕型':state.leader.charisma>75?'威严型':'务实型'}。`;$('leaderStats').innerHTML=[['威望',state.leader.charisma],['决断',state.leader.resolve],['智慧',state.leader.wisdom],['合法',state.leader.legitimacy],['改革',state.leader.reform],['铁腕',state.leader.ruthlessness]].map(x=>`<div class="attr"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('power').innerHTML=FACTIONS.map(f=>`<div class="power-row"><span>${f}</span><div class="power-track"><i style="width:${state.faction[f]}%"></i></div><b>${Math.round(state.faction[f])}</b></div>`).join('');let s=state.stats;$('stateGrid').innerHTML=[['合法性',Math.round((s.稳定+s.威望+state.leader.legitimacy)/3)],['财政',Math.max(0,Math.min(100,Math.round((s.财政+100)/10)))],['军政',Math.round((s.军力+state.leader.resolve)/2)],['压力',pressure()]].map(x=>`<div class="state"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('stats').innerHTML=METRICS.map(k=>{let v=s[k],w=k==='财政'?Math.max(5,Math.min(100,(v+500)/12)):k==='人口'?Math.min(100,v/4):v,col=k==='稳定'?'var(--green)':k==='军力'?'var(--red)':k==='财政'?'var(--gold)':k==='影响'?'var(--purple)':'var(--blue)';return`<div class="metric"><div class="head"><span>${k}</span><b>${v}</b></div><div class="bar"><i style="width:${w}%;background:${col}"></i></div></div>`}).join('');$('regions').innerHTML=state.regions.map(x=>`<div class="region"><div class="region-head"><strong>${x.name}</strong><b class="${x.heat>70?'hot':x.heat>45?'warm':'cool'}">${Math.round(x.heat)}</b></div><small>${x.contender} · 风险${x.risk} · 综合${x.score}</small></div>`).join('');$('inertia').innerHTML=[...state.inertia,...state.logs.slice(0,2)].slice(0,7).map(x=>`<div class="point">${x}</div>`).join('');$('actions').innerHTML=actionList().map((a,i)=>`<button class="action" data-i="${i}" ${state.used||state.ended?'disabled':''}><div class="action-head"><span>${a[1]}</span><span class="cost">${a[2]}财</span></div><small>${a[3]}</small></button>`).join('');$('actions').querySelectorAll('.action').forEach(b=>b.onclick=()=>perform(+b.dataset.i));$('summary').innerHTML=[`路线：${r[0]}`,`派系：${FACTIONS.slice().sort((a,b)=>state.faction[b]-state.faction[a]).slice(0,3).map(f=>f+':'+Math.round(state.faction[f])).join(' / ')}`,`热点：${state.regions.filter(x=>x.heat>50).length}个`,`压力：${pressure()}/100`].map(x=>`<div class="mini">${x}</div>`).join('');$('logs').innerHTML=(state.logs.length?state.logs:['暂无历史记录。']).map(x=>`<div class="log">${x}</div>`).join('');let goals=[['跨越时代',state.year>=1950],['制度稳定',s.稳定>=70],['工业化',s科技>=80&&s.产业>=75],['国际影响',s.影响>=80],['社会契约',s.社会>=70],['地方整合',state.regions.every(x=>x.heat<40)]];$('goals').innerHTML=goals.map(x=>`<div class="goal"><span>${x[0]}</span><span class="chip ${x[1]?'done':'todo'}">${x[1]?'已达成':'待达成'}</span></div>`).join('')}
function show(e){state.event=e;$('eventTitle').textContent=e.title;$('eventText').textContent=e.text;$('choices').innerHTML=e.choices.map((x,i)=>`<button class="choice" data-i="${i}"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('');$('choices').querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i));$('modal').classList.add('show')}
function choose(i){let e=state.event,x=e.choices[i];if(!x)return;apply(x[2]);faction(x[3]);state.flags[e.id]=1;log(`${state.year}年：${e.title} → ${x[0]}：${x[1]}`);$('modal').classList.remove('show');state.event=null;render()}
function perform(i){if(state.used||state.ended)return;let a=actionList()[i];if(!a)return;if(state.stats.财政<a[2]){log(`${state.year}年：财政不足，无法执行“${a[1]}”。`);return render()}apply(a[4]);state.stats.财政-=a[2];const h=[...state.regions].sort((a,b)=>b.heat-a.heat)[0];if(a[0]==='control')h.heat=Math.max(0,h.heat-20);if(a[0]==='integrate')h.heat=Math.max(0,h.heat-14);if(a[0]==='army')state.faction.军方=Math.min(100,state.faction.军方+6);if(a[0]==='education')state.faction.工党=Math.min(100,state.faction.工党+7);state.used=true;log(`${state.year}年：执行“${a[1]}”。`);render()}
function ending(){let s=state.stats;if(s.稳定<25)return'国家崩解与革命';if(s.军力>=85&&s.影响>=80&&s.稳定>=65)return'大陆霸权';if(s.科技>=85&&s.经济>=80&&s.产业>=75)return'工业巨人';if(s.稳定>=80&&s.威望>=80&&state.route==='reform')return'宪政强国';if(s.贸易>=85&&s.影响>=85&&state.route==='federation')return'海洋霸权';return'长时现代化'}
function next(){if(state.ended||state.event)return;if(state.year>=YEARS.end)return finish();state.year++;state.used=false;let s=state.stats;s.财政+=Math.max(18,Math.round(24+s.经济*.35-s.军力*.1));s.社会+=state.route==='reform'?4:2;s.贸易+=state.route==='federation'?2:1;s.产业+=state.route==='industrial'?3:1;s.军需+=state.route==='equilibrium'?2:0;state.regions.forEach(r=>r.heat=Math.min(100,r.heat+(s.稳定<60?3:1)+(state.route==='reform'?1:0)));if(s.财政<0){s.稳定-=4;s.威望-=2;log(`${state.year}年：债务压力削弱合法性。`)}if(s.社会<35){s.稳定-=5;log(`${state.year}年：社会不安扩散。`)}let h=[...state.regions].sort((a,b)=>b.heat-a.heat)[0];if(h.heat>60)state.inertia.unshift(`惯性：${h.name}热度${Math.round(h.heat)}，地方势力正在积累。`);state.inertia=state.inertia.slice(0,5);clamp();let e=available();if(e){log(`${state.year}年：${e.title}正在发生。`);show(e)}if(state.year>=YEARS.end)finish();render()}
function finish(){state.ended=true;log(`1950年结局：${ending()}。`);render()}
function save(){localStorage.setItem('SVVIP_SAVE_V19',JSON.stringify(state));log('游戏已保存。');render()}
function load(){try{let x=JSON.parse(localStorage.getItem('SVVIP_SAVE_V19'));if(!x||!x.country)return false;Object.assign(state,x);if(!state.faction)state.faction={};FACTIONS.forEach(f=>state.faction[f]=Number(state.faction[f]||0));if(!state.regions?.length){buildAfterLoad()}clamp();render();return true}catch(e){return false}}
function buildAfterLoad(){let c=country(),p=c.leader;state.leader={name:p[0],charisma:p[1],resolve:p[2],wisdom:p[3],ruthlessness:p[4],reform:p[5],legitimacy:p[6],authority:Math.round((p[1]+p[2]+p[6])/3)};state.regions=c.regions.map(r=>({name:r[0],heat:r[1],risk:r[2],contender:r[3],score:Math.round(r[1]*.55+r[2]*.45)}))}
Object.keys(countries).forEach(n=>$('nation').add(new Option(n,n)));Object.keys(routes).forEach(k=>$('route').add(new Option(routes[k][0],k)));$('nation').onchange=e=>{state.country=e.target.value;reset()};$('route').onchange=e=>{state.route=e.target.value;reset()};$('next').onclick=next;$('save').onclick=save;$('reset').onclick=reset;$('plan').onclick=()=>{log('AI推演：'+state.ai);render()};if(!load())reset();
</script></body></html>
