<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大时代：五线史诗 v0.1.15</title>
<style>
:root{--bg:#08121d;--panel:#102131;--line:#2b4d69;--text:#edf7ff;--muted:#9eb8cd;--gold:#f5d17a;--blue:#6ebaff;--green:#79e2a6;--red:#ff8888;--purple:#d3b1ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#17334b 0,#08121d 48%);color:var(--text);font:14px/1.6 "Microsoft YaHei","PingFang SC",sans-serif}.app{max-width:1500px;margin:auto;padding:18px}.top,.panel,.modal-box{background:rgba(16,33,49,.94);border:1px solid var(--line);box-shadow:0 12px 30px #0005}.top{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:12px}.brand{font-size:22px;font-weight:800;color:var(--gold)}.version,.sub,.muted{color:var(--muted);font-size:12px}.topright{display:flex;gap:8px;align-items:center}.year{color:var(--gold);font-weight:bold;margin-right:6px}.btn,.action,.choice{border:1px solid #38617f;background:#142d43;color:var(--text);border-radius:7px;padding:8px 12px;cursor:pointer}.btn:hover,.action:hover,.choice:hover{border-color:var(--gold);background:#1b3c57}.btn.main{background:#72552a;border-color:var(--gold)}.btn:disabled,.action:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:270px 1fr 310px;gap:14px;margin-top:14px}.bottom{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:14px}.panel{padding:16px;border-radius:12px}h2{font-size:17px;margin:0 0 13px;color:var(--gold)}h3{margin:0 0 6px;font-size:15px}.card{border:1px solid #29445a;background:#0c1c2b;padding:11px;border-radius:8px;margin:10px 0}.card p{margin:4px 0;color:#d0e2ef}select{width:100%;padding:9px;margin-bottom:8px;background:#0b1b2a;border:1px solid var(--line);color:var(--text);border-radius:6px}.mini{padding:6px 0;border-bottom:1px solid #21394b;color:#c7d9e7}.stats{margin-top:10px}.metric{margin:8px 0}.head{display:flex;justify-content:space-between}.head b{color:var(--gold)}.bar{height:6px;background:#0a1621;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag,.chip{padding:3px 8px;border-radius:12px;background:#1c3c57;color:var(--blue);font-size:12px}.regions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.region{padding:9px;background:#0a1b2a;border:1px solid #24435b;border-radius:7px}.region b{display:block;font-size:20px}.hot{color:var(--red)}.warm{color:var(--gold)}.cool{color:var(--green)}.actions{display:grid;gap:8px}.action{text-align:left}.action-head{display:flex;justify-content:space-between;font-weight:bold}.cost{color:var(--gold)}.action small,.choice small{display:block;color:var(--muted);margin-top:3px}.list{max-height:310px;overflow:auto}.log{padding:7px 0;border-bottom:1px solid #21394b}.goal{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #21394b}.done{background:#236b4a;color:#d8ffe9}.todo{background:#3a4550;color:#b9c5cd}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{max-width:650px;width:100%;padding:24px;border-radius:12px}.choices{display:grid;gap:9px;margin-top:18px}.choice{text-align:left}.choice b{font-size:14px;color:var(--gold)}@media(max-width:1050px){.grid{grid-template-columns:1fr 1fr}.grid main{grid-column:span 2}}@media(max-width:700px){.top{display:block}.topright{margin-top:10px;flex-wrap:wrap}.grid,.bottom{grid-template-columns:1fr}.grid main{grid-column:auto}}
</style></head>
<body><div class="app">
<header class="top"><div><span class="brand">大时代 · 五线史诗</span> <span class="version">v0.1.15 · 国家统治模拟器</span></div><div class="topright"><span class="year" id="year"></span><button class="btn main" id="next">推进一年</button><button class="btn" id="save">保存</button><button class="btn" id="reset">重置</button></div></header>
<div class="grid"><aside class="panel"><h2>国家与制度 <span class="sub">统治中心</span></h2><select id="nation"></select><select id="route"></select><div class="card"><h3 id="leaderName"></h3><p id="leaderDesc"></p></div><div class="card"><h3>制度与地缘</h3><p id="institution"></p></div><div id="miniList"></div><div class="stats" id="stats"></div></aside>
<main class="panel"><h2>历史舞台 <span class="sub">最高领导人、权力集团与事件链</span></h2><div class="card"><h3>时代锚点</h3><p id="anchor"></p></div><div class="card"><h3>领导人特质</h3><div class="tags" id="traits"></div><p id="traitDesc"></p></div><div class="card"><h3>国家AI辅助决策 · 本地微行AI</h3><p id="aiAdvisor"></p><button class="btn" id="plan">生成国策推演</button></div><div class="card"><h3>统治集团与内斗</h3><p id="factions"></p></div><div class="card"><h3>地方叛乱热力图</h3><div class="regions" id="regions"></div><p class="sub">热度超过 70 将触发割据；镇压会降低热度但损害社会。</p></div></main>
<aside class="panel"><h2>战略行动 <span class="sub">每年部署一次</span></h2><div class="actions" id="actions"></div></aside></div>
<div class="bottom"><section class="panel"><h2>历史日志 <span class="sub">事件链与分支结果</span></h2><div class="list" id="logs"></div></section><section class="panel"><h2>多结局树 <span class="sub">路线、危机与国家命运</span></h2><div id="goals"></div></section></div></div>
<div class="modal" id="modal"><div class="modal-box"><h2 id="eventTitle"></h2><p id="eventText"></p><div class="choices" id="choices"></div></div></div>
<script>
const VERSION='0.1.15',START=1830,END=1950,metrics=['经济','军力','科技','稳定','财政','威望','人口','影响','社会','产业','贸易','军需'];
const factions=['保守派','改革派','军方','商业派','外交派','工党','地方派'];
const anchors={1848:'革命浪潮让旧制度与新社会正面相撞。',1871:'统一与民族国家重构大陆力量平衡。',1914:'世界大战把工业、财政与社会动员推向极限。',1918:'战后秩序与民族自决重新划分世界。',1929:'信贷崩溃考验国家的社会契约。',1939:'全球冲突迫使每个政权重新选择。',1945:'旧帝国退场，新秩序开始成形。'};
const countries={
'大英帝国':{base:{经济:75,军力:68,科技:72,稳定:76,财政:620,威望:78,人口:240,影响:81,社会:58,产业:55,贸易:52,军需:60},institution:'议会帝国 · 海外网络',tags:['海权','工业','金融'],leader:'女王/首相',desc:'威严与妥协并用，在议会、军方和自治领之间维持帝国。',bias:{影响:3,贸易:3},regions:['不列颠','印度','埃及','加拿大','澳洲','非洲']},
'清王朝':{base:{经济:58,军力:62,科技:52,稳定:60,财政:410,威望:64,人口:360,影响:68,社会:58,产业:55,贸易:52,军需:60},institution:'皇权官僚制 · 多民族帝国',tags:['帝国','农业','改革'],leader:'皇帝/摄政',desc:'以天命与官僚维系天下，地方督抚和新军正成为新的权力中心。',bias:{人口:8,稳定:-2},regions:['直隶','江南','西北','东北','两湖','边疆']},
'法兰西':{base:{经济:66,军力:67,科技:69,稳定:72,财政:540,威望:74,人口:200,影响:73,社会:58,产业:55,贸易:52,军需:60},institution:'共和国家 · 中央集权',tags:['革命','文化','共和'],leader:'共和国总统',desc:'革命记忆塑造政治合法性，街垒、议会和军队都在争夺国家叙事。',bias:{威望:4,社会:2},regions:['巴黎','北部','南部','阿尔萨斯','殖民地','阿尔及利亚']},
'德意志':{base:{经济:61,军力:74,科技:70,稳定:67,财政:500,威望:71,人口:190,影响:70,社会:58,产业:55,贸易:52,军需:60},institution:'联邦帝国 · 军工体系',tags:['统一','军备','工业'],leader:'皇帝/宰相',desc:'联邦、军方与工业资本共同推动崛起，也共同制造内斗。',bias:{军力:5,产业:4},regions:['普鲁士','莱茵','巴伐利亚','萨克森','波兰地','海外']},
'日本':{base:{经济:57,军力:66,科技:63,稳定:64,财政:430,威望:69,人口:180,影响:62,社会:58,产业:55,贸易:52,军需:60},institution:'近代天皇制 · 官僚军部',tags:['转型','海军','近代化'],leader:'天皇/内阁',desc:'改革家与军部推动跃迁，社会承受着急速工业化的代价。',bias:{科技:4,军需:3},regions:['关东','关西','东北','北海道','朝鲜','台湾']},
'美国':{base:{经济:64,军力:63,科技:73,稳定:75,财政:610,威望:72,人口:210,影响:79,社会:58,产业:55,贸易:52,军需:60},institution:'联邦共和 · 工业资本',tags:['新大陆','工业','扩张'],leader:'总统/国会',desc:'联邦、州权、资本与工党在扩张时代重新定义权力边界。',bias:{经济:5,产业:5},regions:['东北','南方','中西部','西部','太平洋','海外']}};
const routes={history:['真实主线','尊重历史骨架，在约束中争取最优解.',{稳定:2}],reform:['宪政改革','用法治、教育与社会妥协重写现代化.',{社会:4,威望:2}],federation:['海洋联邦','用贸易、海权与外交网络改写全球秩序.',{贸易:4,影响:3}],industrial:['工业跃迁','用技术革命和重工业拉开时代差距.',{科技:4,产业:5}],equilibrium:['大陆均衡','用军备、联盟和地缘威慑保住国家地位.',{军力:4,军需:4}]};
const actions=[['industry','工业化建设',40,'工厂、铁路与城市基础设施。',{经济:12,科技:4,产业:10,财政:-35,威望:2}],['army','军制改革',35,'整顿编制，提高训练与后勤。',{军力:9,稳定:3,军需:8,财政:-25}],['education','教育改革',25,'扩展学校体系与科教投入。',{科技:6,稳定:4,社会:5,财政:-15,威望:2}],['diplomacy','外交扩展',30,'建立协作网络与贸易机会。',{影响:8,贸易:4,威望:3,财政:-18}],['control','镇压叛乱',28,'派军警恢复秩序，降低地方叛乱热度。',{稳定:8,军力:4,财政:-18,社会:-5}],['integrate','地方整编',32,'承认地方利益并把武装纳入国家体系。',{稳定:4,影响:5,社会:4,财政:-23}]];
const state={year:START,country:'大英帝国',route:'history',stats:{},used:false,ended:false,flags:{},logs:[],factions:{},heat:{},leaderType:'威严',event:null};
const $=id=>document.getElementById(id), clamp=()=>metrics.forEach(k=>state.stats[k]=k==='财政'?Math.round(state.stats[k]||0):Math.max(0,Math.min(k==='人口'?500:100,Number(state.stats[k]||0))));
function apply(x){Object.keys(x).forEach(k=>{if(k in state.stats)state.stats[k]+=x[k]});clamp()}function log(x){state.logs.unshift(x);state.logs=state.logs.slice(0,45)}
function reset(){let c=countries[state.country];state.year=START;state.stats={...c.base};state.used=false;state.ended=false;state.flags={};state.logs=[];state.event=null;state.factions={};factions.forEach((f,i)=>state.factions[f]=[18,14,16,15,10,8,19][i]);state.heat={};c.regions.forEach((r,i)=>state.heat[r]=25+(i%3)*9);state.leaderType=['威严','改革家','铁腕','杂碎'][Math.floor(Math.random()*4)];apply(c.bias);apply(routes[state.route][2]);log(`${state.country}于1830年起步。你以“${state.leaderType}”风格担任${c.leader}，统治国家。`);render()}
function factionText(){let a=Object.entries(state.factions).sort((x,y)=>y[1]-x[1]);return a.slice(0,4).map(x=>`${x[0]} ${Math.round(x[1])}`).join(' · ')+'。最强集团会左右下一次危机。'}
function advice(){let s=state.stats;if(s.稳定<42)return '红色预警：稳定与合法性正在断裂。建议镇压后立刻整编，避免单纯暴力形成叛乱惯性。';if(Math.max(...Object.values(state.heat))>65)return '地方预警：叛乱热区正在形成割据网络。可用整编换取忠诚，或以军力进行有限镇压。';if(s.财政<180)return '财政预警：国库无法支撑多线扩张。先保护税源与产业，避免债务把社会推向工党。';if(s.社会<42)return '社会预警：工党与改革派正在积累动员力。教育、议会和社会妥协比继续加税更有效。';if(s.军力<58)return '安全建议：军方影响尚可但军力不足，建议军制改革；若贸然扩张会触发国际压力。';return '综合判断：国家处于可塑窗口。优先选择能同时改善稳定、财政与社会的行动，保留应对危机的余量。'}
function event(){let s=state.stats, hot=Object.entries(state.heat).sort((a,b)=>b[1]-a[1])[0];if(s.稳定<38||hot[1]>72)return{id:'rebellion'+state.year,title:hot[1]>72?'地方割据危机':'叛乱与镇压',text:`${hot[0]}的地方派、工党与不满军官形成临时联盟。热度${Math.round(hot[1])}，首都要求你立刻表态。`,choices:[['全面镇压','以军力恢复秩序，但社会与地方派会付出代价。',{稳定:10,军力:3,社会:-12,财政:-25},-8],['地方整编','承认部分自治，把地方武装转入国家体系。',{稳定:5,影响:5,社会:6,财政:-18},5],['召开国民会议','让改革派与工党进入制度，短期削弱中央权威。',{稳定:2,社会:13,威望:8,财政:-12},8]]};if(state.year===1848||state.year===1929||state.year===1914)return{id:'global'+state.year,title:state.year+'：时代危机',text:anchors[state.year]||'国家结构受到时代冲击。',choices:[['动员国家机器','以行政与军力优先保证国家存续。',{军力:8,稳定:-2,财政:-35,军需:8},-3],['改革统治契约','把危机转化为新的合法性与社会联盟。',{稳定:6,社会:9,威望:5,财政:-22},7],['谨慎观望','保存财政与军力，但会失去影响力。',{财政:18,影响:-8,威望:-4},0]]};return null}
function choose(i){let e=state.event,c=e.choices[i];apply(c[2]);state.factions['地方派']+=c[3];state.factions['改革派']+=c[3]/2;let hot=Object.keys(state.heat).sort((a,b)=>state.heat[b]-state.heat[a])[0];state.heat[hot]=Math.max(5,state.heat[hot]-(c[3]>0?18: c[3]<0?-5:8));state.flags[e.id]=1;log(`${state.year}年：${e.title} → ${c[0]}：${c[1]}`);state.event=null;$('modal').classList.remove('show');render()}
function show(e){state.event=e;$('eventTitle').textContent=e.title;$('eventText').textContent=e.text;$('choices').innerHTML=e.choices.map((c,i)=>`<button class="choice" data-i="${i}"><b>${c[0]}</b><small>${c[1]}</small></button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i));$('modal').classList.add('show')}
function act(i){if(state.used||state.ended)return;let a=actions[i];if(state.stats.财政<a[2]){log(`${state.year}年：财政不足，无法执行“${a[1]}”。`);return render()}apply(a[4]);state.used=true;let heat=Object.keys(state.heat).sort((x,y)=>state.heat[y]-state.heat[x])[0];if(a[0]==='control')state.heat[heat]=Math.max(0,state.heat[heat]-28);if(a[0]==='integrate'){state.heat[heat]=Math.max(0,state.heat[heat]-17);state.factions['地方派']+=7}if(a[0]==='education')state.factions['工党']+=5;log(`${state.year}年：执行“${a[1]}”。`);render()}
function next(){if(state.ended||state.event)return;if(state.year>=END)return finish();state.year++;state.used=false;let s=state.stats;s.财政+=Math.max(12,Math.round(18+s.经济*.3-s.军力*.08));s.社会+=state.route==='reform'?3:1;s.贸易+=state.route==='federation'?2:1;s.产业+=state.route==='industrial'?3:1;Object.keys(state.heat).forEach(r=>state.heat[r]+=Math.max(0,Math.round((48-s.稳定)/16)+(state.year%7===0?3:0)));state.factions['工党']+=s.社会<45?2:.3;state.factions['军方']+=s.军力>75?1:.2;if(s.财政<0){s.稳定-=5;log(`${state.year}年：财政崩溃削弱统治合法性。`)}clamp();let e=event();if(e){log(`${state.year}年：${e.title}爆发。`);show(e)}render()}
function finish(){state.ended=true;let s=state.stats,end=s.稳定<25?'国家崩解与革命':s.科技>85&&s.产业>80?'工业巨人':s.影响>85&&s.贸易>85?'海洋霸权':s.稳定>78&&s.社会>70?'宪政强国':s.军力>88?'军事霸权':'长时现代化';log(`1950年结局：${end}。`);render()}
function render(){let c=countries[state.country],r=routes[state.route];$('year').textContent=`${state.year}年 · ${state.ended?'历史已定局':''}`;$('nation').value=state.country;$('route').value=state.route;$('leaderName').textContent=`${c.leader} · ${state.leaderType}`;$('leaderDesc').textContent=c.desc;$('institution').textContent=c.institution;$('anchor').textContent=anchors[state.year]||'结构性变化正在累积，下一次选择可能改变时代。';$('traits').innerHTML=[...c.tags,state.leaderType,r[0]].map(x=>`<span class="tag">${x}</span>`).join('');$('traitDesc').textContent=`路线：${r[1]} 领导风格会改变危机取舍：铁腕偏向军力，改革家偏向社会，威严偏向威望，杂碎偏向短期财政。`;$('aiAdvisor').textContent=advice();$('factions').textContent=factionText();$('miniList').innerHTML=[`路线：${r[0]}`,`关键议题：${r[1]}`,`统治中心：${c.leader}`,`危机惯性：${Object.values(state.heat).filter(x=>x>60).length} 个热区`].map(x=>`<div class="mini">${x}</div>`).join('');$('stats').innerHTML=metrics.map(k=>{let v=state.stats[k],w=k==='财政'?Math.max(4,Math.min(100,v/8)):k==='人口'?Math.min(100,v/4):v,col=k==='稳定'?'var(--green)':k==='军力'?'var(--red)':k==='财政'?'var(--gold)':'var(--blue)';return`<div class="metric"><div class="head"><span>${k}</span><b>${v}</b></div><div class="bar"><i style="width:${w}%;background:${col}"></i></div></div>`}).join('');$('regions').innerHTML=Object.entries(state.heat).map(([n,v])=>`<div class="region"><span class="muted">${n}</span><b class="${v>70?'hot':v>48?'warm':'cool'}">${Math.round(v)}</b></div>`).join('');$('actions').innerHTML=actions.map((a,i)=>`<button class="action" data-i="${i}" ${state.used||state.ended?'disabled':''}><div class="action-head"><span>${a[1]}</span><span class="cost">${a[2]}财</span></div><small>${a[3]}</small></button>`).join('');document.querySelectorAll('.action').forEach(b=>b.onclick=()=>act(+b.dataset.i));$('logs').innerHTML=(state.logs.length?state.logs:['暂无历史记录。']).map(x=>`<div class="log">${x}</div>`).join('');let s=state.stats,goals=[['跨越时代',state.year>=END],['制度稳定',s.稳定>=70],['工业化',s科技>=80&&s.产业>=75],['地方整合',Object.values(state.heat).every(x=>x<40)],['社会契约',s.社会>=70],['国际影响',s.影响>=80]];$('goals').innerHTML=goals.map(x=>`<div class="goal"><span>${x[0]}</span><span class="chip ${x[1]?'done':'todo'}">${x[1]?'已达成':'待达成'}</span></div>`).join('')}
$('plan').onclick=()=>{log('AI推演：以当前热区为锚点，建议“'+(state.stats.稳定<50?'地方整编':'教育改革')+'”，并保留财政应对下一事件。');render()};$('next').onclick=next;$('reset').onclick=reset;$('save').onclick=()=>{localStorage.setItem('SVVIP_SAVE_V15',JSON.stringify(state));log('游戏已保存。');render()};$('nation').onchange=e=>{state.country=e.target.value;reset()};$('route').onchange=e=>{state.route=e.target.value;reset()};Object.keys(countries).forEach(x=>$('nation').add(new Option(x,x)));Object.entries(routes).forEach(([k,v])=>$('route').add(new Option(v[0],k)));try{let x=JSON.parse(localStorage.getItem('SVVIP_SAVE_V15'));if(x&&x.stats)Object.assign(state,x);else reset()}catch(e){reset()}render();
</script></body></html>
