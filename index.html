<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大时代战略游戏</title>
  <style>
    :root {
      --bg-1: #07131d;
      --bg-2: #0e1d2c;
      --panel: rgba(16, 27, 38, 0.92);
      --panel-strong: rgba(12, 22, 31, 0.96);
      --card: rgba(24, 39, 53, 0.9);
      --line: rgba(149, 192, 255, 0.22);
      --line-strong: rgba(149, 192, 255, 0.46);
      --text: #edf7ff;
      --muted: #9bb5ca;
      --gold: #f7d27d;
      --green: #76e6a4;
      --blue: #72b9ff;
      --red: #ff8c8c;
      --orange: #ffbb73;
      --purple: #d6b8ff;
      --shadow: 0 24px 52px rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(71, 118, 180, 0.25), transparent 23%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    }

    body {
      padding: 20px;
    }

    button, select {
      font: inherit;
    }

    .app {
      max-width: 1500px;
      margin: 0 auto;
      background: rgba(10, 18, 25, 0.9);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 22px;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 24px;
      background: rgba(9, 17, 24, 0.96);
      border-bottom: 1px solid var(--line);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(247, 210, 125, 0.24), rgba(114, 185, 255, 0.18));
      border: 1px solid var(--line);
      color: var(--gold);
      font-weight: 700;
      font-size: 1.25rem;
    }

    .brand {
      font-size: 1.26rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .year-pill {
      min-width: 180px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(28, 48, 63, 0.9), rgba(14, 24, 35, 0.9));
      padding: 10px 18px;
      font-weight: 700;
      color: var(--text);
    }

    .btn {
      border: 1px solid rgba(255,255,255,0.14);
      background: linear-gradient(135deg, rgba(114, 185, 255, 0.15), rgba(48, 81, 131, 0.17));
      color: var(--text);
      border-radius: 12px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      box-shadow: 0 12px 20px rgba(20, 42, 60, 0.25);
    }

    .btn.warn {
      background: linear-gradient(135deg, rgba(255, 187, 115, 0.16), rgba(155, 111, 48, 0.18));
    }

    .btn.danger {
      background: linear-gradient(135deg, rgba(255, 140, 140, 0.14), rgba(137, 58, 58, 0.18));
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .layout {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr) 350px;
      background: rgba(11, 18, 25, 0.9);
    }

    .panel {
      background: rgba(16, 25, 36, 0.72);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 16px;
      margin: 16px;
      min-height: 200px;
    }

    .panel h3 {
      margin: 0 0 14px 0;
      color: var(--gold);
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .panel h3 .sub {
      color: var(--muted);
      font-size: 0.74rem;
      letter-spacing: 0;
      margin-left: 8px;
      text-transform: none;
    }

    .country-select {
      width: 100%;
      background: rgba(8, 16, 23, 0.9);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat-box {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 78px;
    }

    .stat-box .label {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .stat-box .value {
      font-size: 1.08rem;
      font-weight: 700;
      word-break: break-word;
    }

    .resource-bars {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 52px 1fr 32px;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .bar {
      position: relative;
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .bar > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--blue));
      box-shadow: 0 0 20px rgba(114,185,255,0.3);
    }

    .warning {
      margin-top: 14px;
      color: var(--orange);
      background: rgba(255, 187, 115, 0.08);
      border: 1px solid rgba(255, 187, 115, 0.28);
      border-radius: 12px;
      padding: 10px 12px;
      line-height: 1.6;
      font-size: 0.8rem;
    }

    .view-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tab {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.82rem;
    }

    .tab.active {
      background: rgba(114, 185, 255, 0.12);
      border-color: rgba(114, 185, 255, 0.5);
      color: var(--text);
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .region-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .region-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      min-height: 112px;
    }

    .region-card h4 {
      margin: 0 0 8px 0;
      font-size: 0.96rem;
    }

    .region-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(118, 230, 164, 0.1);
      border: 1px solid rgba(118, 230, 164, 0.28);
      color: var(--green);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      margin-bottom: 9px;
    }

    .region-badge.warn {
      background: rgba(255, 187, 115, 0.08);
      border-color: rgba(255, 187, 115, 0.28);
      color: var(--orange);
    }

    .region-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.74rem;
      margin-top: 8px;
    }

    .tag {
      display: inline-block;
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(114, 185, 255, 0.12);
      border: 1px solid rgba(114, 185, 255, 0.28);
      color: var(--blue);
      font-size: 0.7rem;
      font-weight: 700;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .mini-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }

    .mini-card .label {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .mini-card .value {
      font-size: 1.08rem;
      font-weight: 700;
    }

    .summary-detail {
      margin-top: 10px;
      line-height: 1.7;
      color: var(--muted);
      font-size: 0.82rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }

    .actions-list {
      display: grid;
      gap: 10px;
    }

    .action-btn {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      color: var(--text);
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .action-btn:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      box-shadow: 0 12px 18px rgba(18, 35, 48, 0.18);
    }

    .action-btn .head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      align-items: center;
    }

    .action-btn strong {
      font-size: 0.95rem;
    }

    .action-btn .cost {
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .action-btn span {
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.6;
      display: block;
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      border-top: 1px solid var(--line);
      background: rgba(11, 18, 25, 0.9);
    }

    .event-list,
    .objective-list,
    .achievement-list {
      display: grid;
      gap: 10px;
      max-height: 260px;
      overflow: auto;
      padding-right: 4px;
    }

    .event-item,
    .objective-item,
    .achievement-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      line-height: 1.6;
    }

    .event-item {
      border-left: 3px solid var(--blue);
      font-size: 0.82rem;
    }

    .objective-item,
    .achievement-item {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .objective-item strong,
    .achievement-item strong {
      color: var(--text);
    }

    .objective-item.done,
    .achievement-item.done {
      background: rgba(118, 230, 164, 0.06);
      border-color: rgba(118, 230, 164, 0.32);
      color: var(--green);
    }

    .achievement-item.done {
      color: var(--gold);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 14px;
      font-size: 0.9rem;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }

    .modal.active {
      display: flex;
    }

    .modal-card {
      width: min(560px, 100%);
      background: rgba(12, 22, 31, 0.98);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 20px 18px;
    }

    .modal-card h2 {
      margin: 0 0 8px 0;
      color: var(--gold);
      font-size: 1.3rem;
    }

    .modal-card p {
      margin: 0 0 15px 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .choice-list {
      display: grid;
      gap: 10px;
    }

    .choice-btn {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      color: var(--text);
      text-align: left;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .choice-btn:hover {
      border-color: var(--line-strong);
      background: rgba(114, 185, 255, 0.08);
    }

    .choice-btn strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.96rem;
    }

    .choice-btn small {
      display: block;
      color: var(--muted);
      line-height: 1.5;
    }

    @media (max-width: 1080px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .bottom-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .top-actions {
        width: 100%;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 10px;
      }

      .panel {
        margin: 10px;
        padding: 14px 12px;
      }

      .stats-grid,
      .summary-grid,
      .region-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">帝</div>
        <div class="brand">大时代战略游戏</div>
      </div>
      <div class="top-actions">
        <div class="year-pill" id="yearLabel">1830年 · 工业前夜</div>
        <button class="btn" id="nextTurnBtn">推进一年</button>
        <button class="btn warn" id="saveBtn">保存</button>
        <button class="btn danger" id="resetBtn">重开</button>
      </div>
    </header>

    <div class="layout">
      <aside class="panel">
        <h3>国家概览 <span class="sub">执掌时代潮流</span></h3>
        <select id="nationSelect" class="country-select" aria-label="国家选择"></select>

        <div class="stats-grid">
          <div class="stat-box">
            <span class="label">综合国力</span>
            <span class="value" id="powerValue">0</span>
          </div>
          <div class="stat-box">
            <span class="label">财政储备</span>
            <span class="value" id="treasuryValue">0</span>
          </div>
          <div class="stat-box">
            <span class="label">人口</span>
            <span class="value" id="populationValue">0</span>
          </div>
          <div class="stat-box">
            <span class="label">威望</span>
            <span class="value" id="prestigeValue">0</span>
          </div>
        </div>

        <div class="resource-bars">
          <div class="bar-row">
            <span>稳定</span>
            <div class="bar"><span id="stabilityBar"></span></div>
            <strong id="stabilityValue">0</strong>
          </div>
          <div class="bar-row">
            <span>经济</span>
            <div class="bar"><span id="economyBar"></span></div>
            <strong id="economyValue">0</strong>
          </div>
          <div class="bar-row">
            <span>军力</span>
            <div class="bar"><span id="militaryBar"></span></div>
            <strong id="militaryValue">0</strong>
          </div>
          <div class="bar-row">
            <span>科技</span>
            <div class="bar"><span id="scienceBar"></span></div>
            <strong id="scienceValue">0</strong>
          </div>
        </div>

        <div class="warning" id="warningText">国家正在步入新纪元，稳定与发展需要谨慎安排。</div>
      </aside>

      <main class="panel">
        <h3>世界局势 <span class="sub">各地区格局正在变化</span></h3>

        <div class="view-tabs">
          <button class="tab active" data-target="worldView">世界视图</button>
          <button class="tab" data-target="warView">战争与和平</button>
          <button class="tab" data-target="dipView">外交</button>
          <button class="tab" data-target="policyView">内政</button>
        </div>

        <div class="view active" id="worldView">
          <div class="region-grid" id="regionGrid"></div>
        </div>

        <div class="view" id="warView">
          <div class="summary-grid">
            <div class="mini-card">
              <span class="label">军力评估</span>
              <div class="value" id="warMilitary">0</div>
            </div>
            <div class="mini-card">
              <span class="label">战争承受力</span>
              <div class="value" id="warCapacity">0</div>
            </div>
          </div>
          <div class="summary-detail" id="warSummary"></div>
        </div>

        <div class="view" id="dipView">
          <div class="summary-grid">
            <div class="mini-card">
              <span class="label">国际影响</span>
              <div class="value" id="influenceValue">0</div>
            </div>
            <div class="mini-card">
              <span class="label">外交威望</span>
              <div class="value" id="diplomacyValue">0</div>
            </div>
          </div>
          <div class="summary-detail" id="dipSummary"></div>
        </div>

        <div class="view" id="policyView">
          <div class="summary-grid">
            <div class="mini-card">
              <span class="label">制度稳定</span>
              <div class="value" id="stabilitySummary">0</div>
            </div>
            <div class="mini-card">
              <span class="label">科技底盘</span>
              <div class="value" id="scienceSummary">0</div>
            </div>
          </div>
          <div class="summary-detail" id="policySummary"></div>
        </div>
      </main>

      <aside class="panel">
        <h3>战略行动 <span class="sub">每年自由部署</span></h3>
        <div class="actions-list" id="actionsList"></div>
      </aside>
    </div>

    <div class="bottom-grid">
      <section class="panel">
        <h3>历史日志 <span class="sub">你的战略将写进这段时代</span></h3>
        <div class="event-list" id="eventList"></div>
      </section>

      <section class="panel">
        <h3>目标与成就</h3>
        <div class="objective-list" id="objectiveList"></div>
        <div style="margin-top: 18px;">
          <h3 style="margin-bottom: 10px;">成就</h3>
          <div class="achievement-list" id="achievementList"></div>
        </div>
      </section>
    </div>
  </div>

  <div class="modal" id="eventModal" aria-modal="true" role="dialog">
    <div class="modal-card">
      <h2 id="modalTitle">时代事件</h2>
      <p id="modalText"></p>
      <div id="choiceList" class="choice-list"></div>
    </div>
  </div>

  <script>
    const nationData = {
      "大英帝国": { economy: 75, military: 68, science: 72, stability: 76, treasury: 620, prestige: 78, population: 240, influence: 81, era: "工业革命与全球扩张" },
      "清王朝": { economy: 58, military: 62, science: 52, stability: 60, treasury: 410, prestige: 64, population: 360, influence: 56, era: "近代转型与国运重塑" },
      "法兰西帝国": { economy: 64, military: 66, science: 69, stability: 68, treasury: 470, prestige: 72, population: 150, influence: 70, era: "文明与革命的冲击" },
      "德意志帝国": { economy: 70, military: 82, science: 76, stability: 67, treasury: 500, prestige: 79, population: 120, influence: 68, era: "工业强国与军国崛起" },
      "大日本帝国": { economy: 65, military: 74, science: 71, stability: 64, treasury: 420, prestige: 75, population: 90, influence: 63, era: "现代化与列强竞争" },
      "俄罗斯帝国": { economy: 57, military: 78, science: 58, stability: 63, treasury: 520, prestige: 70, population: 170, influence: 67, era: "欧亚巨擘与不断扩张" },
      "奥斯曼帝国": { economy: 51, military: 59, science: 55, stability: 52, treasury: 390, prestige: 58, population: 140, influence: 62, era: "帝国变革与东方危机" }
    };

    const regions = [
      { name: "欧洲", status: "主导" },
      { name: "东亚", status: "关键" },
      { name: "南亚", status: "敏感" },
      { name: "中东", status: "争夺" },
      { name: "非洲", status: "扩张" },
      { name: "美洲", status: "新机遇" }
    ];

    const eventPool = [
      {
        title: "工业运动兴起",
        text: "工厂与城市正在吸引大量劳动力，技术进步带来繁荣，但也制造新的社会矛盾。",
        choices: [
          { name: "改善劳动条件", desc: "稳定 +8，财政 -25", apply: s => { s.stability += 8; s.treasury -= 25; } },
          { name: "强硬压制", desc: "军力 +5，稳定 -6，威望 -3", apply: s => { s.military += 5; s.stability -= 6; s.prestige -= 3; } }
        ]
      },
      {
        title: "科学门类突破",
        text: "新的技术路线正在改变能源、交通和生产方式。",
        choices: [
          { name: "大力资助", desc: "科技 +10，财政 -35", apply: s => { s.science += 10; s.treasury -= 35; } },
          { name: "稳步推进", desc: "科技 +3，财政 +10", apply: s => { s.science += 3; s.treasury += 10; } }
        ]
      },
      {
        title: "边境危机",
        text: "邻国在关键边境调动军队，局势愈发紧张。",
        choices: [
          { name: "外交缓和", desc: "影响 +7，威望 +4", apply: s => { s.influence += 7; s.prestige += 4; } },
          { name: "公开威慑", desc: "军力 +9，财政 -30，稳定 -3", apply: s => { s.military += 9; s.treasury -= 30; s.stability -= 3; } }
        ]
      },
      {
        title: "贸易繁荣",
        text: "港口、航线和内陆贸易网络联通提升了商业活力。",
        choices: [
          { name: "扩大投资", desc: "经济 +9，财政 +25", apply: s => { s.economy += 9; s.treasury += 25; } },
          { name: "储备资金", desc: "财政 +55，经济 +2", apply: s => { s.treasury += 55; s.economy += 2; } }
        ]
      },
      {
        title: "行政改革浪潮",
        text: "地方治理和教育体制出现新的改革思路。",
        choices: [
          { name: "全力推进", desc: "稳定 +10，财政 -20，科技 +4", apply: s => { s.stability += 10; s.treasury -= 20; s.science += 4; } },
          { name: "维持现状", desc: "稳定 +2，财政 +15", apply: s => { s.stability += 2; s.treasury += 15; } }
        ]
      }
    ];

    const actionDefs = [
      { id: "industrialize", title: "工业化建设", description: "修建工厂、铁路和城市基础设施，推动制造业扩张。", cost: 40, apply: s => { s.economy += 12; s.science += 4; s.treasury -= 35; s.prestige += 3; s.stability += 1; } },
      { id: "army", title: "军制改革", description: "整顿编制、训练和后勤体系，提高军队作战效能。", cost: 35, apply: s => { s.military += 13; s.treasury -= 30; s.stability -= 2; s.prestige += 3; } },
      { id: "research", title: "科学教育", description: "扩充学校、实验室和科研基础，加速技术突破。", cost: 30, apply: s => { s.science += 13; s.economy += 3; s.treasury -= 28; s.prestige += 5; } },
      { id: "diplomacy", title: "外交联络", description: "争取友邦、国际会议与协定，扩大影响力与威望。", cost: 25, apply: s => { s.prestige += 10; s.influence += 10; s.treasury -= 22; s.stability += 2; } },
      { id: "reform", title: "政治改革", description: "改善制度、民生和行政效率，稳住内政秩序。", cost: 20, apply: s => { s.stability += 12; s.economy += 5; s.treasury -= 18; s.prestige += 3; } },
      { id: "expansion", title: "海外拓展", description: "控制贸易航线和资源地带，为国家打开全球空间。", cost: 45, apply: s => { s.influence += 13; s.treasury -= 40; s.military += 4; s.prestige += 5; s.stability -= 3; } },
      { id: "infrastructure", title: "基础设施", description: "修建港口、道路和城市网络，让地区互联互通。", cost: 35, apply: s => { s.economy += 9; s.population += 8; s.influence += 5; s.treasury -= 30; } },
      { id: "mobilization", title: "战时动员", description: "储备军需、扩展后勤和战备制度，应对外部冲击。", cost: 50, apply: s => { s.military += 17; s.treasury -= 48; s.stability -= 5; s.prestige += 3; } }
    ];

    const state = {
      year: 1830,
      nation: "大英帝国",
      economy: 0,
      military: 0,
      science: 0,
      stability: 0,
      treasury: 0,
      prestige: 0,
      population: 0,
      influence: 0,
      history: [],
      ended: false,
      achievements: {}
    };

    const $ = (id) => document.getElementById(id);

    function clamp(value, min = 0, max = 100) {
      return Math.min(max, Math.max(min, Math.round(value)));
    }

    function getEraLabel(year) {
      if (year <= 1850) return "工业前夜";
      if (year <= 1875) return "扩张时代";
      if (year <= 1900) return "大国博弈";
      if (year <= 1918) return "世界大战";
      if (year <= 1930) return "动荡交错";
      if (year <= 1950) return "重塑秩序";
      return "时代终章";
    }

    function computePower() {
      return Math.round((state.economy + state.military + state.science + state.stability + state.influence + state.prestige) / 6 + state.treasury / 25);
    }

    function pushHistory(text) {
      state.history.unshift(text);
      state.history = state.history.slice(0, 24);
    }

    function normalizeState() {
      state.economy = clamp(state.economy);
      state.military = clamp(state.military);
      state.science = clamp(state.science);
      state.stability = clamp(state.stability);
      state.prestige = clamp(state.prestige);
      state.influence = clamp(state.influence);
      state.population = Math.max(1, Math.round(state.population));
      state.treasury = Math.max(-500, Math.round(state.treasury));
    }

    function applyNation(nationName) {
      const base = nationData[nationName];
      state.nation = nationName;
      state.year = 1830;
      state.economy = base.economy;
      state.military = base.military;
      state.science = base.science;
      state.stability = base.stability;
      state.treasury = base.treasury;
      state.prestige = base.prestige;
      state.population = base.population;
      state.influence = base.influence;
      state.ended = false;
      state.achievements = {};
      state.history = [
        `1830年：你成为${nationName}的领导者。`,
        `时代背景：${base.era}`
      ];
      normalizeState();
      $("nextTurnBtn").disabled = false;
      render();
    }

    function renderNationOptions() {
      const select = $("nationSelect");
      select.innerHTML = Object.keys(nationData).map(name => `<option value="${name}">${name}</option>`).join("");
      select.value = state.nation;
    }

    function renderRegionCards() {
      const grid = $("regionGrid");
      const core = (state.influence + state.military + state.economy) / 3;
      grid.innerHTML = regions.map((region, index) => {
        const score = clamp(core * (0.7 + index * 0.08), 20, 99);
        const level = score > 75 ? "主导" : score > 60 ? "关键" : score > 45 ? "平衡" : "脆弱";
        return `
          <div class="region-card">
            <h4>${region.name}</h4>
            <div class="region-badge ${score < 45 ? "warn" : ""}">${level}</div>
            <div class="region-meta">
              <span>战略态势</span>
              <span class="tag">${score}%</span>
            </div>
            <div class="region-meta">
              <span>地区影响</span>
              <strong>${Math.min(100, clamp(30 + index * 8 + Math.round(state.influence / 4), 0, 100))}</strong>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderActions() {
      const list = $("actionsList");
      list.innerHTML = actionDefs.map(action => `
        <button class="action-btn" data-action="${action.id}">
          <div class="head">
            <strong>${action.title}</strong>
            <span class="cost">${action.cost} 财政</span>
          </div>
          <span>${action.description}</span>
        </button>
      `).join("");

      list.querySelectorAll(".action-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          if (state.ended) return;
          const action = actionDefs.find(item => item.id === btn.dataset.action);
          if (!action) return;
          executeAction(action);
        });
      });
    }

    function renderStats() {
      $("yearLabel").textContent = `${state.year}年 · ${getEraLabel(state.year)}`;
      $("powerValue").textContent = computePower();
      $("treasuryValue").textContent = `${state.treasury}`;
      $("populationValue").textContent = `${state.population}M`;
      $("prestigeValue").textContent = `${state.prestige}`;

      $("stabilityValue").textContent = state.stability;
      $("economyValue").textContent = state.economy;
      $("militaryValue").textContent = state.military;
      $("scienceValue").textContent = state.science;

      $("stabilityBar").style.width = `${state.stability}%`;
      $("economyBar").style.width = `${state.economy}%`;
      $("militaryBar").style.width = `${state.military}%`;
      $("scienceBar").style.width = `${state.science}%`;

      const warning = state.stability < 25
        ? "警告：国家秩序濒临崩溃，必须重建制度与民心。"
        : state.treasury < 0
          ? "警告：财政透支已形成压力，必须压缩开支或增加收入。"
          : state.military > state.economy + 20
            ? "提示：军备负担过重，经济增长正在被拖累。"
            : "国家正在步入新纪元，稳定与发展需要谨慎安排。";

      $("warningText").textContent = warning;

      $("warMilitary").textContent = state.military;
      $("warCapacity").textContent = Math.round(state.economy * 0.6 + state.stability * 0.4);
      $("influenceValue").textContent = state.influence;
      $("diplomacyValue").textContent = state.prestige;
      $("stabilitySummary").textContent = state.stability;
      $("scienceSummary").textContent = state.science;

      $("warSummary").textContent = state.military > 75
        ? "军力处于强势地位，但过度扩军会压缩财政和稳定。"
        : state.military > 55
          ? "军队具备一定竞争力，适合进行有限冲突与威慑。"
          : "军力较弱，仍需优先发展武器和后勤体系。";

      $("dipSummary").textContent = state.influence > 80 && state.prestige > 70
        ? "国际威望与影响力已较强，外交行动具备显著优势。"
        : state.prestige > 55
          ? "外交中盘已具备一定声望，逐步建立联盟和协定颇有机会。"
          : "国际环境仍然较为严峻，需先稳固内部基础再争取外交突破。";

      $("policySummary").textContent = state.stability > 75 && state.science > 70
        ? "制度稳定与科技底盘俱佳，国家具备持续增长的条件。"
        : state.stability > 50
          ? "目前治理尚可，适合稳步改革与有序扩张。"
          : "治理压力较大，改革与社会安定应优先于冒险扩张。";
    }

    function renderObjectives() {
      const power = computePower();
      const goals = [
        { text: `在${state.year}年之前保持稳定与竞争力，争取以强国姿态跨越时代。`, done: state.year >= 1950 },
        { text: `综合国力达到220以上，成为世界舞台上的关键势力。`, done: power >= 220 },
        { text: `稳定度保持在45以上，避免制度失控与内乱。`, done: state.stability >= 45 },
        { text: `经济与科技同时达到80，建立坚实的现代化底盘。`, done: state.economy >= 80 && state.science >= 80 },
        { text: `国际影响力达到80以上，确保地缘支配力持续增长。`, done: state.influence >= 80 }
      ];

      $("objectiveList").innerHTML = goals.map(goal => `
        <div class="objective-item ${goal.done ? "done" : ""}">
          <strong>${goal.done ? "已达成" : "进行中"}</strong>：${goal.text}
        </div>
      `).join("");
    }

    function renderAchievements() {
      const achievements = [
        { name: "工业先驱", done: state.economy >= 80 },
        { name: "科技灯塔", done: state.science >= 85 },
        { name: "世界霸主", done: state.influence >= 90 },
        { name: "和平缔造者", done: state.stability >= 85 && state.prestige >= 80 },
        { name: "跨越时代", done: state.year >= 1950 }
      ];

      $("achievementList").innerHTML = achievements.map(item => `
        <div class="achievement-item ${item.done ? "done" : ""}">
          <strong>${item.done ? "◆" : "◇"}</strong> ${item.name}
        </div>
      `).join("");
    }

    function renderLog() {
      const list = $("eventList");
      list.innerHTML = state.history.length
        ? state.history.map(item => `<div class="event-item">${item}</div>`).join("")
        : '<div class="empty">暂无历史记录</div>';
    }

    function render() {
      renderStats();
      renderRegionCards();
      renderObjectives();
      renderAchievements();
      renderLog();
    }

    function executeAction(action) {
      if (state.treasury < action.cost) {
        pushHistory(`${state.year}年：财政不足，无法执行“${action.title}”。`);
        render();
        return;
      }

      action.apply(state);
      normalizeState();
      pushHistory(`${state.year}年：执行“${action.title}”，国家战略方向出现新变化。`);
      maybeUnlockMilestones();
      render();
    }

    function maybeUnlockMilestones() {
      if (state.economy >= 80 && !state.achievements.industrial) {
        state.achievements.industrial = true;
        pushHistory(`${state.year}年：工业体系成熟，国家已具备强大的经济基础。`);
      }
      if (state.science >= 85 && !state.achievements.science) {
        state.achievements.science = true;
        pushHistory(`${state.year}年：科研能力提升到世界级水平。`);
      }
      if (state.stability <= 10 && !state.achievements.crisis) {
        state.achievements.crisis = true;
        pushHistory(`${state.year}年：内忧骤起，国家治理面临严峻挑战。`);
      }
      if (state.influence >= 90 && !state.achievements.superpower) {
        state.achievements.superpower = true;
        pushHistory(`${state.year}年：国际影响力已逼近世界强国的标准。`);
      }
    }

    function triggerRandomEvent() {
      const event = eventPool[Math.floor(Math.random() * eventPool.length)];
      const modal = $("eventModal");
      const title = $("modalTitle");
      const text = $("modalText");
      const list = $("choiceList");

      title.textContent = event.title;
      text.textContent = event.text;
      list.innerHTML = event.choices.map(choice => `
        <button class="choice-btn" data-choice="${choice.name}">
          <strong>${choice.name}</strong>
          <small>${choice.desc}</small>
        </button>
      `).join("");

      modal.classList.add("active");

      list.querySelectorAll(".choice-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const chosen = event.choices.find(item => item.name === btn.dataset.choice);
          if (!chosen) return;
          chosen.apply(state);
          normalizeState();
          pushHistory(`${state.year}年：在“${event.title}”中选择“${chosen.name}”，结果影响了国家命运。`);
          modal.classList.remove("active");
          maybeUnlockMilestones();
          render();
        });
      });
    }

    function finalizeGame() {
      state.ended = true;
      const power = computePower();
      const summary = power >= 260 && state.stability >= 55
        ? `你将${state.nation}塑造成一个拥有强大工业、坚实国防和深远国际影响力的时代巨擘。`
        : power >= 200
          ? `你在这段历史中留下了不可忽视的痕迹，国家虽未达到巅峰，却已成为时代的重要力量。`
          : `时代浪潮过于强大，你未能在这场历史风暴中站稳脚跟，但你的选择仍然载入史书。`;
      pushHistory(`时代终章：${summary}`);
      render();
      $("nextTurnBtn").disabled = true;
    }

    function checkEnding() {
      const power = computePower();
      const victory = power >= 260 && state.stability >= 55;
      const nearWin = power >= 200 && state.stability >= 40;
      if (state.year >= 1950 || (!victory && !nearWin && state.stability <= 12)) {
        finalizeGame();
      }
    }

    function advanceYear() {
      if (state.ended) return;
      if (state.year >= 1950) {
        finalizeGame();
        return;
      }

      state.year += 1;
      state.treasury += Math.max(18, Math.round(state.economy / 3));
      state.population += Math.round((state.economy + state.science) / 45);
      state.stability += Math.round((state.economy - state.military) / 20);
      state.economy += 2;
      state.military += 1;
      state.influence += 1;

      if (state.year >= 1914 && state.year <= 1918 && state.military > 60) {
        state.treasury -= 55;
        state.stability -= 8;
        pushHistory(`${state.year}年：世界大战阴影笼罩，资源消耗与社会压力持续上升。`);
      }

      if (state.year >= 1939 && state.year <= 1945 && state.military > 65) {
        state.treasury -= 60;
        state.stability -= 10;
        pushHistory(`${state.year}年：二战冲击再度震动全球，国家必须重新平衡安全与发展。`);
      }

      if (Math.random() < 0.55) {
        triggerRandomEvent();
      } else {
        pushHistory(`${state.year}年：时代风云变幻，国家的战略选择正在改变未来。`);
      }

      if (state.treasury < -100) {
        state.stability -= 10;
        pushHistory(`${state.year}年：财政危机爆发，债务压力传导到社会与政治领域。`);
      }

      if (state.stability <= 10) {
        pushHistory(`${state.year}年：国家秩序濒临崩解，社会秩序与统治基础受到强烈冲击。`);
      }

      normalizeState();
      maybeUnlockMilestones();
      checkEnding();
      render();
    }

    function saveGame() {
      try {
        localStorage.setItem("SVVIP_HISTORY_SAVE", JSON.stringify(state));
        pushHistory(`${state.year}年：存档成功，历史进程已保存在本地。`);
        render();
      } catch (error) {
        console.warn("存档失败", error);
        pushHistory(`${state.year}年：存档失败，当前环境不支持本地存储。`);
        render();
      }
    }

    function resetGame() {
      if (!window.confirm("确定要放弃当前历史并重新开始吗？")) return;
      const currentNation = $("nationSelect").value;
      applyNation(currentNation);
      $("nextTurnBtn").disabled = false;
    }

    document.getElementById("nationSelect").addEventListener("change", (e) => {
      applyNation(e.target.value);
    });

    document.getElementById("nextTurnBtn").addEventListener("click", advanceYear);
    document.getElementById("saveBtn").addEventListener("click", saveGame);
    document.getElementById("resetBtn").addEventListener("click", resetGame);

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(item => item.classList.remove("active"));
        document.querySelectorAll(".view").forEach(item => item.classList.remove("active"));
        tab.classList.add("active");
        const target = document.getElementById(tab.dataset.target);
        if (target) target.classList.add("active");
      });
    });

    renderNationOptions();

    const saved = localStorage.getItem("SVVIP_HISTORY_SAVE");
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed && parsed.nation && nationData[parsed.nation]) {
          Object.assign(state, parsed);
          $("nationSelect").value = state.nation;
          normalizeState();
          render();
          renderActions();
          return;
        }
      } catch (error) {
        console.warn("存档读取失败，已重置。", error);
      }
    }

    applyNation(state.nation);
    renderActions();
    render();
  </script>
</body>
</html>
