function availableEvents(){const pool=[...events,...(COUNTRY_EVENTS[S.country]||[])];return pool.filter(e=>e.year===S.year&&!S.flags[e.id]);}
function showEvent(e){S.event=e;$('eventTitle').textContent=e.title;$('eventText').textContent=e.text;$('choices').innerHTML=e.choices.map((c,i)=>`<button class="choice" data-i="${i}"><b>${c.n}</b><small>${c.r}</small></button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i));$('modal').classList.add('show')}
function choose(i){const e=S.event,c=e.choices[i];if(!c)return;apply(c.e);S.flags[e.id]=c.n;S.faction=c.f;log(`${S.year}年：${e.title} → ${c.n}`);$('modal').classList.remove('show');S.event=null;render();}
function action(id){if(S.used||S.ended)return;const a=[...actions,...(routeActions[S.route]||[])][id];if(!a)return;if(S.stats.财政<a.cost){log(`${S.year}年：财政不足，无法执行“${a.name}”。`);render();return}apply({财政:-a.cost,...a.e});S.used=true;log(`${S.year}年：执行“${a.name}”。`);render();}
function end(){const s=S.stats;let title='漫长延续';if(s.稳定<25)title='崩解与革命';else if(s.军力>=85&&s.影响>=80)title='大陆霸权';else if(s.科技>=85&&s.经济>=80)title='工业巨人';else if(s.稳定>=80&&s.威望>=80)title='宪政强国';else if(s.贸易>=85&&s.影响>=85)title='海洋霸权';log(`1950年结局：${title}。${S.faction}在最后阶段留下决定性影响。`);S.ended=true;render();}
function next(){if(S.ended||$('modal').classList.contains('show'))return;if(S.year>=1950){end();return}S.year++;S.used=false;const s=S.stats;s.财政+=Math.max(18,Math.round(24+s.经济*.35-s.军力*.1));s.社会+=2+(S.route==='reform'?2:0);s.贸易+=S.route==='federation'?2:1;s.产业+=S.route==='industrial'?3:1;s.军需+=S.route==='equilibrium'?2:0;if(s.财政<0){s.稳定-=4;s.威望-=2;log(`${S.year}年：债务压力削弱了政权合法性。`)}if(s.社会<35){s.稳定-=5;log(`${S.year}年：社会不安开始扩散。`)}clamp();const es=availableEvents();if(es.length){log(`${S.year}年：${es[0].title}正在发生。`);showEvent(es[0]);}if(S.year>=1950)end();render();}
function render(){const c=country(),r=route();$('year').textContent=`${S.year}年 · ${era(S.year)}`;$('nation').value=S.country;$('route').value=S.route;$('lineName').textContent=r.name;$('lineDesc').textContent=r.desc;$('institution').textContent=c.institution;$('anchor').textContent=anchors[S.year]||'结构性变化正在累积，下一次选择可能改变时代。';$('traits').innerHTML=c.tags.map(x=>`<span class="tag">${x}</span>`).join('');$('traitDesc').textContent=c.trait;$('narrative').textContent=`当前主导派系：${S.faction}。关键人物：${S.characters.join('、')}。${S.year<1875?'旧秩序与现代化的冲突仍是主线。':S.year<1914?'政党、军方和产业集团正在争夺国家方向。':'战争与危机使每个政治选择都带有不可逆的代价。'}`;$('stats').innerHTML=METRICS.map(k=>{let v=S.stats[k],w=k==='财政'?Math.max(5,Math.min(100,(v+500)/12)):k==='人口'?Math.min(100,v/4):v;return `<div class="metric"><div class="head"><span>${k}</span><b>${v}</b></div><div class="bar"><i style="width:${w}%;background:${k==='稳定'?'var(--green)':k==='军力'?'var(--red)':k==='财政'?'var(--gold)':'var(--blue)'}"></i></div></div>`}).join('');let core=(S.stats.影响+S.stats.军力+S.stats.经济+S.stats.产业)/4;$('regions').innerHTML=['欧洲','东亚','南亚','中东','非洲','美洲'].map((n,i)=>`<div class="region"><span class="muted">${n}</span><b>${Math.round(Math.min(100,Math.max(10,core*(.72+i*.08))))}</b></div>`).join('');const as=[...actions,...(routeActions[S.route]||[])];$('actions').innerHTML=as.map((a,i)=>`<button class="action" ${S.used||S.ended?'disabled':''} data-i="${i}"><div class="action-head"><span>${a.name}</span><span class="cost">${a.cost}财</span></div><small>${a.desc}</small></button>`).join('');document.querySelectorAll('.action').forEach(b=>b.onclick=()=>action(+b.dataset.i));$('logs').innerHTML=(S.logs.length?S.logs:['暂无历史记录。']).map(x=>`<div class="log">${x}</div>`).join('');const goals=[['跨越时代',S.year>=1950],['制度稳定',S.stats.稳定>=70],['工业化',S.stats.科技>=80&&S.stats.产业>=75],['国际影响',S.stats.影响>=80],['财政生存',S.stats.财政>=0]];$('goals').innerHTML=goals.map(g=>`<div class="goal"><span>${g[0]}</span><span class="chip ${g[1]?'done':'todo'}">${g[1]?'已达成':'待达成'}</span></div>`).join('');}
function save(){localStorage.setItem('SVVIP_SAVE',JSON.stringify(S));log('游戏已保存。');render();}
function load(){try{const x=JSON.parse(localStorage.getItem('SVVIP_SAVE'));if(x){S={...S,...x};S.stats={...S.stats};refreshCharacters();clamp();return true}}catch(e){}return false}
function init(){Object.keys(countries).forEach(n=>$('nation').add(new Option(n,n)));Object.keys(routes).forEach(k=>$('route').add(new Option(routes[k].name,k)));$('nation').onchange=e=>{S.country=e.target.value;reset()};$('route').onchange=e=>{S.route=e.target.value;reset()};$('next').onclick=next;$('save').onclick=save;$('reset').onclick=reset;if(!load())reset();else render();}
init();
</script></body></html>
