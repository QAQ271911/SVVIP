<div class="app">

      <select id="route"></select>

        <p id="lineDesc"></p>
      </div>
      <div class="card">

    </aside>

    <main class="panel">

        <h3>时代锚点</h3>
        <p id="anchor"></p>
      </div>
      <div class="card">
        <h3>国策特长</h3>
        <div class="tags" id="traits"></div>
        <p id="traitDesc" style="margin-top:9px"></p>
      </div>
      <div class="card">
        <h3>政党与角色</h3>
        <p id="narrative"></p>
      </div>
      <div class="card">
        <h3>地区格局</h3>
        <div class="regions" id="regions"></div>
      </div>
    </main>

    <aside class="panel">
      <h2>战略行动 <span class="sub">每年可部署一次</span></h2>
      <div class="actions" id="actions"></div>
    </aside>
  </div>

  <div class="bottom">
    <section class="panel">
      <h2>历史日志 <span class="sub">事件链与分支结果</span></h2>
      <div class="list" id="logs"></div>
    </section>
    <section class="panel">
      <h2>结局树 <span class="sub">关键目标与历史终局</span></h2>
      <div class="goals" id="goals"></div>
    </section>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="eventTitle"></h2>
    <p id="eventText"></p>
    <div class="choices" id="choices"></div>
  </div>
</div>

      choices:[
        { name:'改革官制', effect:{ 稳定:8, 社会:7, 威望:6, 财政:-15 }, result:'国家重获部分协调，但失去效率。', faction:'改革派', influence:{改革派:15, 地方派:6, 军方:-4} },

  '法兰西': [

      requires: () => true,
      choices:[
        { name:'开放共和', effect:{ 稳定:6, 威望:7, 社会:8, 财政:-10 }, result:'政治合法性提升，但争论也更激烈。', faction:'改革派', influence:{改革派:14, 保守派:-9, 工党:6} },
        { name:'强硬维稳', effect:{ 稳定:4, 威望:-4, 社会:-7, 财政:4 }, result:'秩序恢复，但改革派被打压。', faction:'保守派', influence:{保守派:14, 改革派:-11, 工党:-4} }
      ]
    },
    { id:'france_nationalism_1914', year:1914, title:'国防与民族主义', text:'民族主义与国防动员推动国家重新认定敌我。',
      requires: (state) => state.flags['1914_world_war'] || state.route === 'equilibrium',
      choices:[
        { name:'全民动员', effect:{ 军力:12, 军需:12, 稳定:-8, 社会:-5, 财政:-28 }, result:'战时效率提升，但社会疲劳颇重。', faction:'军方', influence:{军方:16, 工党:-12, 商业派:-6} },
        { name:'外交调停', effect:{ 影响:8, 稳定:5, 威望:3, 财政:-12 }, result:'避免直接冲突，外交空间扩大。', faction:'外交派', influence:{外交派:13, 军方:-6, 保守派:5} }
      ]
    }
  ],
  '德意志': [
    { id:'germany_realm_1871', year:1871, title:'帝国整合', text:'统一后的帝国必须决定到底让国家走向谁的方向。',
      requires: () => true,
      choices:[
        { name:'推行军备联盟', effect:{ 军力:12, 军需:10, 稳定:-4, 财政:-20 }, result:'帝国威慑增强，地缘压力加剧。', faction:'军方', influence:{军方:18, 商业派:-7, 外交派:-4} },
        { name:'推动工业协作', effect:{ 经济:10, 科技:8, 产业:10, 稳定:3, 财政:-12 }, result:'经济增长稳定，社会承压下降。', faction:'商业派', influence:{商业派:15, 军方:-5, 外交派:5} }
      ]
    },
    { id:'germany_continent_1914', year:1914, title:'大陆霸权之争', text:'全欧地图被重新对齐，联盟博弈变成了国家命运。',
      requires: (state) => state.flags['1914_world_war'] || state.route === 'equilibrium',
      choices:[
        { name:'形成同盟', effect:{ 影响:8, 军力:9, 财政:-18, 稳定:2 }, result:'外交框架更加清晰，联盟的保护更强。', faction:'外交派', influence:{外交派:13, 军方:4, 商业派:6} },
        { name:'单边扩张', effect:{ 军力:11, 威望:4, 稳定:-7, 财政:-24 }, result:'战力提升，但邻国关系恶化。', faction:'军方', influence:{军方:18, 外交派:-8, 商业派:-5} }
      ]
    }
  ],
  '日本': [
    { id:'japan_meiji_1880', year:1880, title:'维新第二轮', text:'新政派要求从工业和海军转向更大规模国力重组。',
      requires: () => true,
      choices:[
        { name:'推进海军优先', effect:{ 军力:9, 影响:7, 贸易:4, 财政:-18 }, result:'国防和影响力同时增长。', faction:'军方', influence:{军方:15, 商业派:-2, 外交派:5} },
        { name:'推进工业与教育', effect:{ 科技:8, 经济:9, 产业:8, 稳定:5, 财政:-15 }, result:'日本式现代化加速，长期增长明显。', faction:'改革派', influence:{改革派:15, 军方:-4, 商业派:6} }
      ]
    },
    { id:'japan_rearmament_1937', year:1937, title:'国家再动员', text:'冲突与安保危机重新塑造政权加速。',
      requires: () => true,
      choices:[
        { name:'全国动员', effect:{ 军力:13, 军需:12, 稳定:-6, 财政:-22 }, result:'国防准备完善，但社会代价高昂。', faction:'军方', influence:{军方:18, 工党:-10, 商业派:-5} },
        { name:'克制发展', effect:{ 稳定:7, 经济:6, 社会:5, 财政:-10 }, result:'社会稳定改善，军事节奏更慢。', faction:'改革派', influence:{改革派:12, 军方:-7, 工党:8} }
      ]
    }
  ],
  '美国': [
    { id:'usa_frontier_1860', year:1860, title:'西部扩张', text:'扩张、资本与工业化重新塑造国家边界与秩序。',
      requires: () => true,
      choices:[
        { name:'继续扩张', effect:{ 经济:10, 产业:9, 影响:8, 财政:-12, 社会:-4 }, result:'国力大幅扩张，但社会不平等加深。', faction:'商业派', influence:{商业派:16, 地方派:8, 工党:-8} },
        { name:'稳步工业化', effect:{ 稳定:7, 科技:8, 经济:6, 社会:6, 财政:-9 }, result:'发展更平缓，政治维持更稳。', faction:'改革派', influence:{改革派:13, 商业派:-6, 工党:7} }
      ]
    },
    { id:'usa_global_market_1919', year:1919, title:'全球市场', text:'工业资本的扩张让美国进入更深层的世界系统。',
      requires: (state) => state.flags['1914_world_war'] || state.route === 'federation',
      choices:[
        { name:'抢占全球市场', effect:{ 贸易:12, 影响:10, 财政:15, 威望:5 }, result:'美国在世界生产中占据更强主动。', faction:'商业派', influence:{商业派:16, 外交派:7, 军方:-3} },
        { name:'强化国内重建', effect:{ 稳定:8, 产业:7, 经济:5, 财政:-12 }, result:'内部稳定领先，国际扩张步伐放缓。', faction:'改革派', influence:{改革派:12, 商业派:-5, 工党:8} }
      ]
    }
  ]
};

const state = {
  year: 1830,
  country: '大英帝国',
  route: 'history',
  stats: {},
  logs: [],
  used: false,
  ended: false,
  flags: {},
  event: null,
  factionInfluence: {},
  characters: []
};

const $ = (id) => document.getElementById(id);

function clamp() {
  METRICS.forEach(k => {
    state.stats[k] = Number(state.stats[k] || 0);
    if (k === '财政') state.stats[k] = Math.round(state.stats[k]);
    else if (k === '人口') state.stats[k] = Math.max(1, Math.round(state.stats[k]));
    else state.stats[k] = Math.max(0, Math.min(100, Math.round(state.stats[k])));
  });
}

function apply(obj) {
  Object.keys(obj).forEach(k => {
    if (k in state.stats) state.stats[k] = (state.stats[k] || 0) + obj[k];
  });
  clamp();
}

function setFactionInfluence(overrides) {
  FACTIONS.forEach(f => {
    if (!state.factionInfluence[f]) state.factionInfluence[f] = 0;
  });
  Object.keys(overrides || {}).forEach(f => {
    state.factionInfluence[f] = (state.factionInfluence[f] || 0) + overrides[f];
  });
}

function getCountryData() { return countries[state.country]; }
function getRouteData() { return routes[state.route]; }
function getEraName(year) {
  if (year <= 1850) return '工业前夜';
  if (year <= 1875) return '扩张时代';
  if (year <= 1900) return '大国博弈';
  if (year <= 1918) return '世界大战';
  if (year <= 1930) return '重组时代';
  if (year <= 1945) return '全球冲突';
  return '战后秩序';
}
function log(msg) { state.logs.unshift(msg); state.logs = state.logs.slice(0, 40); }

function buildFactionSummary() {
  const arr = FACTIONS.map(f => ({ name: f, value: state.factionInfluence[f] || 0 }));
  arr.sort((a,b) => b.value - a.value);
  const leader = arr[0] ? arr[0].name : '未知';
  return `${leader}当前最强。${arr.slice(0,3).map(x => `${x.name}:${x.value}`).join(' / ')}`;
}

function getAvailableEvents() {
  const pool = [...GLOBAL_EVENTS, ...(COUNTRY_EVENTS[state.country] || [])];
  return pool.filter(event => event.year === state.year && (!event.requires || event.requires(state))); 
}

function renderStatus() {
  const c = getCountryData();
  const r = getRouteData();
  $('nation').value = state.country;
  $('route').value = state.route;
  $('year').textContent = `${state.year}年 · ${getEraName(state.year)}`;
  $('lineName').textContent = r.name;
  $('lineDesc').textContent = r.desc;
  $('institution').textContent = c.institution;
  $('anchor').textContent = anchors[state.year] || '结构性变化正在累积，下一次选择可能改变时代。';
  $('traits').innerHTML = c.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
  $('traitDesc').textContent = c.trait;
  $('narrative').textContent = buildFactionSummary() + ' 关键人物：' + c.leaders.join('、') + '。';

  $('stats').innerHTML = METRICS.map(k => {
    const value = Number(state.stats[k] || 0);
    let width = k === '财政' ? Math.max(5, Math.min(100, (value + 500) / 12)) : k === '人口' ? Math.min(100, value / 4) : value;
    const color = k === '稳定' ? 'var(--green)' : k === '军力' ? 'var(--red)' : k === '财政' ? 'var(--gold)' : k === '影响' ? 'var(--purple)' : 'var(--blue)';
    return `<div class="metric"><div class="head"><span>${k}</span><b>${value}</b></div><div class="bar"><i style="width:${width}%;background:${color};"></i></div></div>`;
  }).join('');

  const core = (state.stats.影响 + state.stats.军力 + state.stats.经济 + state.stats.产业) / 4;
  $('regions').innerHTML = ['欧洲','东亚','南亚','中东','非洲','美洲'].map((n, i) => {
    const v = Math.round(Math.min(100, Math.max(10, core * (0.72 + i * 0.08))));
    return `<div class="region"><span class="muted">${n}</span><b>${v}</b></div>`;
  }).join('');
}

function renderActions() {
  const actions = [...ACTIONS, ...(ROUTE_ACTIONS[state.route] || [])];
  $('actions').innerHTML = actions.map((a, i) => `
    <button class="action" data-i="${i}" ${state.used || state.ended ? 'disabled' : ''}>
      <div class="action-head"><span>${a.name}</span><span class="cost">${a.cost}财</span></div>
      <small>${a.desc}</small>
    </button>
  `).join('');
  document.querySelectorAll('.action').forEach(btn => btn.onclick = () => performAction(Number(btn.dataset.i)));
}

function renderLogs() {
  $('logs').innerHTML = (state.logs.length ? state.logs : ['暂无历史记录。']).map(x => `<div class="log">${x}</div>`).join('');
}

function renderGoals() {
  const goals = [
    ['跨越时代', state.year >= 1950],
    ['制度稳定', state.stats.稳定 >= 70],
    ['工业化', state.stats.科技 >= 80 && state.stats.产业 >= 75],
    ['国际影响', state.stats.影响 >= 80],
    ['财政生存', state.stats.财政 >= 0]
  ];
  $('goals').innerHTML = goals.map(([text, done]) => `<div class="goal"><span>${text}</span><span class="chip ${done ? 'done' : 'todo'}">${done ? '已达成' : '待达成'}</span></div>`).join('');
}

function render() {
  renderStatus();
  renderActions();
  renderLogs();
  renderGoals();
}

function resetGame() {
  const c = getCountryData();
  state.year = YEARS.start;
  state.used = false;
  state.ended = false;
  state.flags = {};
  state.event = null;
  state.logs = [];
  state.stats = { ...c.base };
  state.factionInfluence = {};
  FACTIONS.forEach(f => state.factionInfluence[f] = 0);
  apply(c.bias);
  apply(getRouteData().bonus);
  log(`${state.country} 于 1830 年起步，路线：${getRouteData().name}。`);
  render();
}

function showEventModal(event) {
  state.event = event;
  $('eventTitle').textContent = event.title;
  $('eventText').textContent = event.text;
  $('choices').innerHTML = event.choices.map((choice, idx) => `
    <button class="choice" data-i="${idx}"><b>${choice.name}</b><small>${choice.result}</small></button>
  `).join('');
  document.querySelectorAll('.choice').forEach(btn => btn.onclick = () => chooseEvent(Number(btn.dataset.i)));
  $('modal').classList.add('show');
}

function closeEventModal() {
  state.event = null;
  $('modal').classList.remove('show');
}

function chooseEvent(index) {
  if (!state.event) return;
  const choice = state.event.choices[index];
  if (!choice) return;
  apply(choice.effect);
  setFactionInfluence(choice.influence || {});
  state.flags[state.event.id] = choice.name;
  log(`${state.year}年：${state.event.title} → ${choice.name}：${choice.result}`);
  closeEventModal();
  render();
}

function performAction(index) {
  if (state.used || state.ended) return;
  const actions = [...ACTIONS, ...(ROUTE_ACTIONS[state.route] || [])];
  const a = actions[index];
  if (!a) return;
  if (state.stats.财政 < a.cost) {
    log(`${state.year}年：财政不足，无法执行“${a.name}”。`);
    render();
    return;
  }
  apply({ 财政: -a.cost, ...a.effect });
  state.used = true;
  log(`${state.year}年：执行“${a.name}”。`);
  render();
}

function checkEnding() {
  const s = state.stats;
  let target = '未决结局';
  if (s.稳定 < 25 && (s.军力 < 30 || s.经济 < 30)) target = '崩解与革命';
  else if (s.军力 >= 85 && s.影响 >= 80 && s.稳定 >= 65) target = '大陆霸权';
  else if (s.科技 >= 85 && s.经济 >= 80 && s.产业 >= 75) target = '工业巨人';
  else if (s.稳定 >= 80 && s.威望 >= 80 && state.route === 'reform') target = '宪政强国';
  else if (s.贸易 >= 85 && s.影响 >= 85 && state.route === 'federation') target = '海洋霸权';
  else if (state.year >= YEARS.end) target = '长时现代化';
  return target;
}

function finishGame() {
  const final = checkEnding();
  log(`1950年结局：${final}。`);
  state.ended = true;
  render();
}

function progressYear() {
  if (state.ended) return;
  if ($('modal').classList.contains('show')) return;
  if (state.year >= YEARS.end) {
    finishGame();
    return;
  }

  state.year += 1;
  state.used = false;
  const s = state.stats;
  s.财政 += Math.max(18, Math.round(24 + s.经济 * 0.35 - s.军力 * 0.10));
  s.社会 += 2 + (state.route === 'reform' ? 2 : 0);
  s.贸易 += state.route === 'federation' ? 2 : 1;
  s.产业 += state.route === 'industrial' ? 3 : 1;
  s.军需 += state.route === 'equilibrium' ? 2 : 0;
  if (s.财政 < 0) { s.稳定 -= 4; s.威望 -= 2; log(`${state.year}年：债务压力削弱了政权合法性。`); }
  if (s.社会 < 35) { s.稳定 -= 5; log(`${state.year}年：社会不安开始扩散。`); }
  clamp();

  const events = getAvailableEvents();
  if (events.length) {
    log(`${state.year}年：${events[0].title}正在发生。`);
    showEventModal(events[0]);
  }

  if (state.year >= YEARS.end) {
    finishGame();
  }

  render();
}

function saveGame() {
  localStorage.setItem('SVVIP_SAVE_V13', JSON.stringify(state));
  log('游戏已保存。');
  render();
}

function loadGame() {
  try {
    const raw = localStorage.getItem('SVVIP_SAVE_V13');
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data) return false;
    Object.assign(state, data);
    state.stats = { ...state.stats };
    state.factionInfluence = state.factionInfluence || {};
    FACTIONS.forEach(f => state.factionInfluence[f] = state.factionInfluence[f] || 0);
    clamp();
    render();
    return true;
  } catch (e) {
    return false;
  }
}

function initSelectors() {
  Object.keys(countries).forEach(name => $('nation').add(new Option(name, name)));
  Object.keys(routes).forEach(key => $('route').add(new Option(routes[key].name, key)));
  $('nation').onchange = (e) => {
    state.country = e.target.value;
    resetGame();
  };
  $('route').onchange = (e) => {
    state.route = e.target.value;
    resetGame();
  };
  $('next').onclick = progressYear;
  $('save').onclick = saveGame;
  $('reset').onclick = resetGame;
}

initSelectors();
if (!loadGame()) resetGame();
</script>
</body>
