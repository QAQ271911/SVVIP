<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>大时代：五线史诗 v0.1.10</title>
  <style>
    :root {
      --bg: #08121d;
      --panel: #102131;
      --line: #2b4d69;
      --text: #edf7ff;
      --muted: #9eb8cd;
      --gold: #f5d17a;
      --blue: #6ebaff;
      --green: #79e2a6;
      --red: #ff8888;
      --orange: #ffba70;
      --purple: #d3b1ff;
      --shadow: rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    body { min-height: 100vh; }

    .app { max-width: 1460px; margin: 0 auto; padding: 24px 20px 40px; }

    .top {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 18px 20px; margin-bottom: 18px; background: rgba(16,33,49,.96);
      border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 16px 22px var(--shadow);
    }

    .brand-wrap {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }

    .brand { font-size: 1.8rem; font-weight: 700; letter-spacing: 1px; color: var(--gold); }
    .version-tag {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 5px 10px; border-radius: 999px; font-size: .76rem; font-weight: 700;
      color: var(--gold); border: 1px solid rgba(245,209,122,.45); background: rgba(245,209,122,.08);
      letter-spacing: .05em;
    }

    .topright { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .year {
      font-size: 1.2rem; color: var(--text); opacity: .96; background: rgba(110,186,255,.12);
      border: 1px solid rgba(110,186,255,.35); border-radius: 10px; padding: 8px 14px;
    }

    .btn {
      border: 1px solid transparent; background: linear-gradient(180deg, #21466a, #162f47); color: var(--text);
      border-radius: 10px; padding: 10px 16px; cursor: pointer; transition: transform .12s ease, opacity .12s ease;
      font-weight: 700;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.main { background: linear-gradient(180deg, #8f6a1a, #654a0a); border-color: rgba(245,209,122,.5); }
    .btn.ghost { background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.15); }

    .grid {
      display: grid; grid-template-columns: 1.05fr 1.75fr 1.2fr; gap: 18px; margin-bottom: 18px;
    }

    .panel {
      background: rgba(16,33,49,.96); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 14px 22px var(--shadow); padding: 18px 16px 16px;
    }

    .panel h2 {
      margin: 0 0 12px; font-size: 1.1rem; letter-spacing: .5px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }

    .sub { font-size: .78rem; color: var(--muted); font-weight: 500; }

    select {
      width: 100%; background: rgba(255,255,255,.04); color: var(--text); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; font-size: 1rem; margin-bottom: 12px;
    }

    .timeline {
      background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px;
    }
    .timeline b { display: block; color: var(--gold); font-size: 1.05rem; margin-bottom: 6px; }
    .timeline .desc { color: var(--muted); line-height: 1.5; font-size: .92rem; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

    .metric {
      background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    }
    .metric .head { display: flex; justify-content: space-between; font-size: .82rem; margin-bottom: 8px; color: var(--muted); }
    .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--green)); }

    .world-box { display: grid; gap: 12px; }
    .info-card {
      background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    }
    .info-card h3 { margin: 0 0 8px; font-size: .95rem; color: var(--gold); }
    .info-card p { margin: 0; color: var(--muted); line-height: 1.6; font-size: .92rem; }

    .trait-list {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;
    }
    .trait {
      border: 1px solid rgba(245,209,122,.35); color: var(--gold); padding: 5px 8px; border-radius: 999px;
      background: rgba(245,209,122,.08); font-size: .75rem; white-space: nowrap;
    }

    .region-grid { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 10px; }
    .region {
      border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.02); padding: 10px 8px;
      display: flex; flex-direction: column; justify-content: center; min-height: 92px; gap: 6px;
    }
    .region .name { color: var(--muted); font-size: .82rem; }
    .region .value { font-weight: 700; font-size: 1.2rem; color: var(--text); }

    .actions { display: grid; gap: 10px; }
    .action {
      background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 12px; color: var(--text);
      text-align: left; padding: 12px; cursor: pointer; transition: border-color .15s ease, transform .12s ease;
    }
    .action:hover { border-color: rgba(110,186,255,.55); transform: translateY(-1px); }
    .action:disabled { opacity: .5; cursor: not-allowed; }
    .action-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; font-weight: 700; }
    .cost {
      color: var(--gold); font-size: .82rem; border: 1px solid rgba(245,209,122,.35); border-radius: 999px;
      padding: 4px 8px; background: rgba(245,209,122,.08);
    }
    .action small { display: block; color: var(--muted); line-height: 1.5; }

    .bottom { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
    .list { max-height: 360px; overflow: auto; display: grid; gap: 10px; padding-right: 4px; }
    .log {
      border-left: 3px solid var(--blue); background: rgba(255,255,255,.02); border: 1px solid var(--line);
      border-left-width: 3px; border-radius: 10px; padding: 10px 12px; color: var(--text); line-height: 1.6; font-size: .92rem;
    }

    .goals { display: grid; gap: 10px; }
    .goal {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 12px; background: rgba(255,255,255,.02);
    }
    .goal .text { color: var(--text); flex: 1; }
    .chip {
      display: inline-flex; align-items: center; justify-content: center; min-width: 62px; padding: 5px 8px; border-radius: 999px;
      font-size: .75rem; font-weight: 700; border: 1px solid transparent;
    }
    .chip.done { color: #06140e; background: var(--green); }
    .chip.todo { color: var(--text); background: rgba(255,255,255,.06); border-color: var(--line); }

    .modal {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(1,5,10,.72);
      backdrop-filter: blur(2px); z-index: 50;
    }
    .modal.show { display: flex; }
    .modal-box {
      width: min(720px, calc(100vw - 30px)); background: #0d1c2a; border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 25px 50px rgba(0,0,0,.45); padding: 20px 18px 18px;
    }
    .modal-box h2 { margin: 0 0 12px; color: var(--gold); font-size: 1.5rem; }
    .modal-box p { color: var(--muted); line-height: 1.7; margin: 0 0 16px; }
    .choices { display: grid; gap: 12px; }
    .choice {
      width: 100%; background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 12px; color: var(--text);
      text-align: left; padding: 12px; cursor: pointer;
    }
    .choice b { display: block; margin-bottom: 4px; font-size: 1rem; }
    .choice small { color: var(--muted); line-height: 1.6; }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: 1fr; }
      .bottom { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand-wrap">
        <div class="brand">大时代 · 五线史诗</div>
        <span class="version-tag" id="gameVersion">v0.1.10</span>
      </div>
      <div class="topright">
        <div class="year" id="year">1830年 · 工业前夜</div>
        <button class="btn main" id="next">推进一年</button>
        <button class="btn ghost" id="save">保存</button>
        <button class="btn ghost" id="reset">重置</button>
      </div>
    </header>

    <div class="grid">
      <aside class="panel">
        <h2>国家概览 <span class="sub">数据与路线</span></h2>
        <select id="nation"></select>

        <div class="timeline">
          <b id="lineName">真实主线</b>
          <div class="desc" id="lineDesc">尊重真实历史骨架，在约束中争取最优解。</div>
        </div>

        <select id="routeSelect"></select>
        <div class="stats" id="stats"></div>
      </aside>

      <main class="panel">
        <h2>历史舞台 <span class="sub">真实节点提供骨架，选择决定分叉</span></h2>
        <div class="world-box">
          <div class="info-card">
            <h3>当年锚点</h3>
            <p id="anchor">工业革命与铁路扩张改写国家能力。</p>
          </div>
          <div class="info-card">
            <h3>国策特长</h3>
            <div class="trait-list" id="traits"></div>
            <p id="traitDesc" style="margin-top:10px;">国家特长将决定长期增长与关键决策的效果。</p>
          </div>
          <div class="info-card">
            <h3>路线反馈</h3>
            <p id="routeFeedback">真实历史会照常发生，但你的应对会改变结果。</p>
          </div>
          <div class="info-card">
            <h3>地区格局</h3>
            <div class="region-grid" id="regions"></div>
          </div>
        </div>
      </main>

      <aside class="panel">
        <h2>战略行动 <span class="sub">每年可部署一次</span></h2>
        <div class="actions" id="actions"></div>
      </aside>
    </div>

    <div class="bottom">
      <section class="panel">
        <h2>历史日志 <span class="sub">真实事件与玩家决定</span></h2>
        <div class="list" id="logs"></div>
      </section>

      <section class="panel">
        <h2>路线目标 <span class="sub">关键指标与结局条件</span></h2>
        <div class="goals" id="goals"></div>
      </section>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h2 id="eventTitle">历史事件</h2>
      <p id="eventText">事件文本</p>
      <div class="choices" id="choices"></div>
    </div>
  </div>

  <script>
    const GAME_VERSION = "0.1.10";
    const WORLD = {
      years: { start: 1830, end: 1950 },
      anchors: {
        1830: "工业革命与铁路扩张改写国家能力。",
        1848: "欧洲革命浪潮与改革压力加剧。",
        1871: "德意志统一改变大陆力量平衡。",
        1914: "世界大战成为决定性分水岭。",
        1918: "战后秩序重塑全球格局。",
        1929: "经济危机打击全球增长与信心。",
        1939: "第二次世界大战重构地缘秩序。",
        1945: "战后秩序与新全球权力结构建立。"
      },
      regions: ["欧洲", "东亚", "南亚", "中东", "非洲", "美洲"]
    };

    const ALL_METRICS = ["经济", "军力", "科技", "稳定", "财政", "威望", "人口", "影响", "社会", "产业", "贸易", "军需"];

    const COUNTRY_TRAITS = {
      "大英帝国": {
        name: "海上霸权",
        bonus: { 影响: 6, 贸易: 8, 财政: 35 },
        description: "海外航线、金融网络与海军威慑使其在国际贸易和影响力中有明显优势。"
      },
      "清王朝": {
        name: "超大人口",
        bonus: { 人口: 30, 社会: 5, 稳定: 2 },
        description: "庞大人口与农业基础使其具备极强的资源承载能力，但现代化压力也更大。"
      },
      "法兰西": {
        name: "革命文化",
        bonus: { 威望: 6, 稳定: 4, 科技: 4 },
        description: "文化输出、制度创新和民族认同让其在政治与舆论层面具有独特优势。"
      },
      "德意志": {
        name: "军工重组",
        bonus: { 军力: 8, 产业: 7, 科技: 5 },
        description: "高效工业与军备组织能力能驱动快速扩张与强硬威慑。"
      },
      "日本": {
        name: "转型韧性",
        bonus: { 产业: 6, 稳定: 5, 贸易: 4 },
        description: "高度适应外部冲击，能够在资源有限下进行快速现代化改造。"
      },
      "美国": {
        name: "大陆资源",
        bonus: { 经济: 7, 产业: 8, 财政: 25 },
        description: "荒地扩张、原材料和制造业基础让其在工业崛起时拥有巨大潜能。"
      }
    };

    function buildCountryStats(base) {
      return Object.assign({}, base, { 社会: 58, 产业: 55, 贸易: 52, 军需: 60 });
    }

    const COUNTRIES = {
      "大英帝国": { stats: buildCountryStats({ 经济: 75, 军力: 68, 科技: 72, 稳定: 76, 财政: 620, 威望: 78, 人口: 240, 影响: 81 }), tags: ["海权", "工业", "金融"] },
      "清王朝": { stats: buildCountryStats({ 经济: 58, 军力: 62, 科技: 52, 稳定: 60, 财政: 410, 威望: 64, 人口: 360, 影响: 68 }), tags: ["帝国", "农业", "改革"] },
      "法兰西": { stats: buildCountryStats({ 经济: 66, 军力: 67, 科技: 69, 稳定: 72, 财政: 540, 威望: 74, 人口: 200, 影响: 73 }), tags: ["革命", "文化", "军政"] },
      "德意志": { stats: buildCountryStats({ 经济: 61, 军力: 74, 科技: 70, 稳定: 67, 财政: 500, 威望: 71, 人口: 190, 影响: 70 }), tags: ["统一", "军备", "工业"] },
      "日本": { stats: buildCountryStats({ 经济: 57, 军力: 66, 科技: 63, 稳定: 64, 财政: 430, 威望: 69, 人口: 180, 影响: 62 }), tags: ["转型", "海军", "近代化"] },
      "美国": { stats: buildCountryStats({ 经济: 64, 军力: 63, 科技: 73, 稳定: 75, 财政: 610, 威望: 72, 人口: 210, 影响: 79 }), tags: ["新大陆", "工业", "扩张"] }
    };

    const ROUTES = {
      history: {
        name: "真实主线",
        summary: "尊重真实历史骨架，在约束中争取最优解。",
        feedback: "真实历史会照常发生，但你的应对会改变结果。",
        focus: ["稳定", "科技", "军力", "影响"],
        bonuses: { 稳定: 2, 社会: 2 },
        endings: [
          { key: "strong", title: "强国结局", condition: (state) => state.stats.经济 >= 80 && state.stats.稳定 >= 60 && state.stats.影响 >= 75 },
          { key: "normal", title: "中庸结局", condition: (state) => state.year >= WORLD.years.end },
          { key: "fail", title: "历史重压", condition: (state) => state.stats.稳定 <= 30 || state.stats.财政 <= -200 }
        ]
      },
      reform: {
        name: "宪政改革",
        summary: "以制度、教育与社会平衡重写现代化进程。",
        feedback: "改革可以带来稳定，也可能制造新的政治断裂。",
        focus: ["稳定", "威望", "科技", "财政"],
        bonuses: { 稳定: 4, 威望: 3, 社会: 5 },
        endings: [
          { key: "constitutional", title: "现代宪政强国", condition: (state) => state.stats.稳定 >= 80 && state.stats.威望 >= 75 && state.stats.科技 >= 70 },
          { key: "managed", title: "渐进改革结局", condition: (state) => state.year >= WORLD.years.end },
          { key: "collapse", title: "改革失控", condition: (state) => state.stats.稳定 <= 25 || state.stats.威望 <= 20 }
        ]
      },
      federation: {
        name: "海洋联邦",
        summary: "以贸易、海权与外交网络改写全球秩序。",
        feedback: "海军与商业网络能扩大影响，但也会放大财政压力。",
        focus: ["财政", "影响", "威望", "经济"],
        bonuses: { 影响: 4, 财政: 20, 贸易: 8 },
        endings: [
          { key: "maritime", title: "海洋霸权", condition: (state) => state.stats.影响 >= 85 && state.stats.财政 >= 500 && state.stats.经济 >= 75 },
          { key: "trade", title: "商业强国", condition: (state) => state.year >= WORLD.years.end },
          { key: "decline", title: "海权衰退", condition: (state) => state.stats.财政 <= -100 || state.stats.影响 <= 25 }
        ]
      },
      industrial: {
        name: "工业跃迁",
        summary: "以技术革命与重工业彻底拉开时代差距。",
        feedback: "重工业与科技能创造爆发式增长，但也可能造成过度扩张。",
        focus: ["科技", "经济", "财政", "影响"],
        bonuses: { 科技: 5, 经济: 4, 产业: 10 },
        endings: [
          { key: "industrial", title: "工业巨人", condition: (state) => state.stats.科技 >= 85 && state.stats.经济 >= 80 && state.stats.财政 >= 400 },
          { key: "tiered", title: "工业现代化", condition: (state) => state.year >= WORLD.years.end },
          { key: "overdrive", title: "过度扩张", condition: (state) => state.stats.财政 <= -200 || state.stats.稳定 <= 30 }
        ]
      },
      equilibrium: {
        name: "大陆均衡",
        summary: "以均势、高度军备和地缘威慑保住国家地位。",
        feedback: "强大的军备体系能制造威慑，也可能拖垮财政和稳定。",
        focus: ["军力", "稳定", "影响", "威望"],
        bonuses: { 军力: 5, 稳定: 2, 军需: 8 },
        endings: [
          { key: "continental", title: "大陆霸权", condition: (state) => state.stats.军力 >= 90 && state.stats.稳定 >= 65 && state.stats.影响 >= 80 },
          { key: "balance", title: "均势秩序", condition: (state) => state.year >= WORLD.years.end },
          { key: "break", title: "军事失衡", condition: (state) => state.stats.军力 <= 25 || state.stats.稳定 <= 20 }
        ]
      }
    };

    const ACTIONS = {
      common: [
        { id: "industrialize", name: "工业化建设", cost: 40, description: "修建工厂、铁路与城市基础设施。", effect: { 经济: 12, 科技: 4, 财政: -35, 威望: 3, 产业: 10 } },
        { id: "reform_army", name: "军制改革", cost: 35, description: "整顿编制、提高训练与军需效率。", effect: { 军力: 9, 稳定: 3, 财政: -25, 军需: 8 } },
        { id: "education", name: "教育改革", cost: 25, description: "扩展学校体系与科教投入。", effect: { 科技: 6, 稳定: 4, 财政: -15, 威望: 2, 社会: 5 } },
        { id: "diplomacy", name: "外交扩展", cost: 30, description: "增进国际影响力与带来协作机会。", effect: { 影响: 8, 财政: -18, 威望: 3, 贸易: 4 } }
      ],
      routeSpecific: {
        reform: [
          { id: "constitutional", name: "宪政改革", cost: 30, description: "扩大议会、法治与参与层级。", effect: { 稳定: 9, 威望: 7, 财政: -20, 社会: 8 } },
          { id: "public_education", name: "公共教育", cost: 28, description: "普及公立教育以提升社会流动。", effect: { 科技: 8, 稳定: 6, 财政: -20, 社会: 6 } }
        ],
        federation: [
          { id: "naval_rise", name: "海军扩张", cost: 35, description: "强化海上威慑与航线控制。", effect: { 影响: 9, 财政: -25, 军力: 5, 贸易: 6 } },
          { id: "trade_pact", name: "贸易协定", cost: 26, description: "建立更广泛的国际贸易网络。", effect: { 财政: 28, 影响: 7, 威望: 3, 贸易: 12 } }

    const STATE = {
      year: 1830,

      actionUsedThisYear: false,
      yearSummary: ""

    const $ = (id) => document.getElementById(id);

    function createInitialStats(baseStats) {
      const normal = {};
      for (const key of ALL_METRICS) {
        normal[key] = Number((baseStats && baseStats[key]) || 0);
      }
      normal.社会 = normal.社会 || 58;
      normal.产业 = normal.产业 || 55;
      normal.贸易 = normal.贸易 || 52;
      normal.军需 = normal.军需 || 60;
      return normal;
    }

    function getRouteData() {
      return ROUTES[STATE.route] || ROUTES.history;
    }

    function getCountryData() {
      return COUNTRIES[STATE.country] || COUNTRIES["大英帝国"];
    }

    function getCountryTraits() {
      return COUNTRY_TRAITS[STATE.country] || { name: "国策平衡", bonus: {}, description: "该国并无明显的国策优势，需依赖路线抉择来决定成败。" };
    }

    function applyCountryTraitBonuses() {
      const trait = getCountryTraits();
      if (!trait || !trait.bonus) return;
      for (const key in trait.bonus) {
        if (STATE.stats[key] !== undefined) {
          STATE.stats[key] += Number(trait.bonus[key]);
        }
      }
      clampStats();
    }

    function applyRouteBonus() {
      const route = getRouteData();
      if (!route || !route.bonuses) return;
      for (const key in route.bonuses) {
        if (STATE.stats[key] !== undefined) {
          STATE.stats[key] += route.bonuses[key];
        }
      }
      clampStats();
    }

    function clampStats() {
      for (const key of ALL_METRICS) {
        if (STATE.stats[key] === undefined) STATE.stats[key] = 0;
        if (key === "财政") {
          STATE.stats[key] = Math.round(STATE.stats[key]);
        } else if (key === "人口") {
          STATE.stats[key] = Math.max(1, Math.round(STATE.stats[key]));
        } else {
          STATE.stats[key] = Math.min(100, Math.max(0, Math.round(STATE.stats[key])));
        }
      }
    }

    function applyEffect(effect) {
      for (const key in effect) {
        const value = Number(effect[key]);
        if (key === "财政") {
          STATE.stats.财政 += value;
        } else if (key === "人口") {
          STATE.stats.人口 += value;
        } else {
          STATE.stats[key] = (STATE.stats[key] || 0) + value;
        }
      }
      clampStats();
    }

    function getEraName(year) {
      if (year <= 1850) return "工业前夜";
      if (year <= 1875) return "扩张时代";
      if (year <= 1900) return "大国博弈";
      if (year <= 1918) return "世界大战";
      if (year <= 1930) return "重组时代";
      if (year <= 1945) return "全球冲突";
      return "战后秩序";
    }

    function addLog(msg) {
      STATE.logs.unshift(msg);
      if (STATE.logs.length > 30) STATE.logs.pop();
    }

    function getPowerScore() {
      const s = STATE.stats;
      return Math.round((s.经济 + s.军力 + s.科技 + s.稳定 + s.影响 + s.威望 + s.贸易 + s.产业) / 8);
    }

    function computeWinnerPool() {
      const route = getRouteData();
      return [
        { text: "跨越时代", done: STATE.year >= WORLD.years.end },
        { text: "强国崛起", done: getPowerScore() >= 220 },
        { text: `稳定度达到 ${route.name.includes("宪政") ? "80" : "60"}`, done: STATE.stats.稳定 >= (route.name.includes("宪政") ? 80 : 60) },
        { text: `科技或军力达到 ${route.name.includes("工业") ? "85" : "75"}`, done: STATE.stats.科技 >= (route.name.includes("工业") ? 85 : 75) || STATE.stats.军力 >= 75 }
      ];
    }

    function resetGame() {
      const base = getCountryData().stats;
      STATE.year = WORLD.years.start;
      STATE.ended = false;
      STATE.currentEvent = null;
      STATE.logs = [];
      STATE.actionUsedThisYear = false;
      STATE.stats = createInitialStats(base);
      applyCountryTraitBonuses();
      applyRouteBonus();
      addLog(`${STATE.country} 于 ${STATE.year} 年起步，路线：${getRouteData().name}。`);
      render();
    }

    function getYearEventCandidates() {
      const pool = [...REAL_EVENTS, ...(ROUTE_EVENTS[STATE.route] || [])];
      const uniq = new Map();
      pool.forEach(event => uniq.set(event.id, event));
      return Array.from(uniq.values()).filter(event => event.year === STATE.year);
    }

    function showEventModal(event) {
      STATE.currentEvent = event;
      $("eventTitle").textContent = event.title;
      $("eventText").textContent = event.text;
      $("choices").innerHTML = event.choices.map((choice, index) => `
        <button class="choice" data-idx="${index}"><b>${choice.name}</b><small>${choice.resultText}</small></button>
      `).join("");

      $("choices").querySelectorAll(".choice").forEach(btn => {
        btn.onclick = () => chooseEventOption(Number(btn.dataset.idx));
      });
      $("modal").classList.add("show");
    }

    function closeEventModal() {
      STATE.currentEvent = null;
      $("modal").classList.remove("show");
    }

    function chooseEventOption(index) {
      if (!STATE.currentEvent) return;
      const choice = STATE.currentEvent.choices[index];
      if (!choice) return;
      applyEffect(choice.effect);
      addLog(`${STATE.year}年：${STATE.currentEvent.title} -> ${choice.name}：${choice.resultText}`);
      closeEventModal();
      render();
    }

    function renderStats() {
      const list = ALL_METRICS.map(key => {
        const val = STATE.stats[key] ?? 0;
        let width = key === "财政" ? Math.min(100, Math.max(5, (val + 500) / 12)) : val;
        if (key === "人口") width = Math.min(100, Math.max(5, val / 4));

        let color = "var(--blue)";
        if (key === "军力") color = "var(--red)";
        if (key === "稳定") color = "var(--green)";
        if (key === "财政") color = "var(--gold)";
        if (key === "影响") color = "var(--purple)";
        if (key === "威望") color = "var(--orange)";
        if (key === "产业") color = "var(--green)";
        if (key === "军需") color = "var(--red)";
        if (key === "社会") color = "var(--orange)";

        return `
          <div class="metric">
            <div class="head"><span>${key}</span><span>${val}</span></div>
            <div class="bar"><i style="width:${Math.min(100, width)}%; background:${color};"></i></div>
          </div>
        `;
      }).join("");
      $("stats").innerHTML = list;
    }

    function renderRoute() {
      const route = getRouteData();
      $("lineName").textContent = route.name;
      $("lineDesc").textContent = route.summary;
      $("routeSelect").value = STATE.route;
      $("nation").value = STATE.country;
      $("year").textContent = `${STATE.year}年 · ${getEraName(STATE.year)}`;
      $("anchor").textContent = WORLD.anchors[STATE.year] || "当前年份位于两个历史节点之间，结构性变化正在累积。";
      $("routeFeedback").textContent = route.feedback;
    }

    function renderTraits() {
      const trait = getCountryTraits();
      const str = trait.name || "国策平衡";
      $("traits").innerHTML = (COUNTRIES[STATE.country]?.tags || [str]).map(tag => `<span class="trait">${tag}</span>`).join("");
      $("traitDesc").textContent = `${str}：${trait.description}`;
    }

    function renderRegions() {
      const core = (STATE.stats.影响 + STATE.stats.军力 + STATE.stats.经济 + STATE.stats.产业) / 4;
      const regions = WORLD.regions.map((name, index) => {
        const value = Math.min(100, Math.max(10, Math.round(core * (0.72 + index * 0.08))));
        return `
          <div class="region">
            <div class="name">${name}</div>
            <div class="value">${value}</div>
          </div>
        `;
      });
      $("regions").innerHTML = regions.join("");
    }

    function getAvailableActions() {
      const common = ACTIONS.common.map(a => ({ ...a, type: "common" }));
      const routeSpecific = (ACTIONS.routeSpecific[STATE.route] || []).map(a => ({ ...a, type: "route" }));
      return [...common, ...routeSpecific];
    }

    function renderActions() {
      const actions = getAvailableActions();
      $("actions").innerHTML = actions.map(action => `
        <button class="action" data-action="${action.id}" ${STATE.ended || STATE.actionUsedThisYear ? "disabled" : ""}>
          <div class="action-head">
            <span>${action.name}</span>
            <span class="cost">${action.cost}财</span>
          </div>
          <small>${action.description}</small>
        </button>
      `).join("");

      $("actions").querySelectorAll(".action").forEach(btn => {
        btn.onclick = () => executeAction(btn.dataset.action);
      });
    }

    function renderLogs() {
      const logs = STATE.logs.length ? STATE.logs : ["暂无历史记录，时间线尚未写下任何决定。"];
      $("logs").innerHTML = logs.map(log => `<div class="log">${log}</div>`).join("");
    }

    function renderGoals() {
      const goals = computeWinnerPool();
      $("goals").innerHTML = goals.map(goal => `
        <div class="goal">
          <div class="text">${goal.text}</div>
          <span class="chip ${goal.done ? "done" : "todo"}">${goal.done ? "已达成" : "待达成"}</span>
        </div>
      `).join("");
    }

    function render() {
      renderRoute();
      renderStats();
      renderTraits();
      renderRegions();
      renderActions();
      renderLogs();
      renderGoals();
      $("gameVersion").textContent = `v${GAME_VERSION}`;
      document.title = `大时代：五线史诗 v${GAME_VERSION}`;
    }

    function resolveEnding() {
      const route = getRouteData();
      const ending = route.endings.find(e => e.condition(STATE));
      const target = ending ? ending.title : "未决结局";
      addLog(`结局判定：${target}`);
      STATE.ended = true;
      render();
      return target;
    }

    function executeAction(actionId) {
      if (STATE.ended) return;
      if (STATE.actionUsedThisYear) {
        addLog(`${STATE.year}年：本年已部署行动，不能重复操作。`);
        render();
        return;
      }

      const action = getAvailableActions().find(a => a.id === actionId);
      if (!action) return;
      if (STATE.stats.财政 < action.cost) {
        addLog(`${STATE.year}年：财政不足，无法执行“${action.name}”。`);
        render();
        return;
      }

      STATE.stats.财政 -= action.cost;
      applyEffect(action.effect);
      STATE.actionUsedThisYear = true;
      addLog(`${STATE.year}年：执行 ${action.name}，影响已落地。`);
      render();
    }

    function handleAnnualPressure() {
      const s = STATE.stats;
      if (s.财政 < 0) {
        s.稳定 -= 4;
        s.威望 -= 2;
        addLog(`${STATE.year}年：财政紧绷，债务压力正在削弱社会稳定。`);
      }
      if (s.社会 < 35) {
        s.稳定 -= 5;
        addLog(`${STATE.year}年：社会不安加剧，动荡正在扩散。`);
      }
      if (s.军需 < 45 && s.军力 > 60) {
        s.军力 -= 4;
        addLog(`${STATE.year}年：军需储备不足，战斗力被削弱。`);
      }
      if (s.贸易 < 30 && s.经济 > 60) {
        s.经济 -= 4;
        addLog(`${STATE.year}年：贸易网络受损，经济增长失去支撑。`);
      }
      clampStats();
    }

    function progressYear() {
      if (STATE.ended) return;
      if ($("modal").classList.contains("show")) return;
      if (STATE.year >= WORLD.years.end) {
        resolveEnding();
        return;
      }

      STATE.year += 1;
      STATE.actionUsedThisYear = false;

      const income = Math.max(18, Math.round(24 + STATE.stats.经济 * 0.35 - STATE.stats.军力 * 0.10));
      STATE.stats.财政 += income;
      STATE.stats.社会 += 2 + (STATE.route === "reform" ? 2 : 0);
      STATE.stats.贸易 += STATE.route === "federation" ? 2 : 1;
      STATE.stats.产业 += STATE.route === "industrial" ? 3 : 1;
      STATE.stats.军需 += STATE.route === "equilibrium" ? 2 : 0;
      STATE.stats.稳定 += STATE.route === "history" ? 1 : 0;
      if (STATE.year >= 1914 && STATE.year <= 1918) STATE.stats.稳定 -= 3;
      if (STATE.year >= 1939 && STATE.year <= 1945) STATE.stats.稳定 -= 4;

      clampStats();
      handleAnnualPressure();

      const events = getYearEventCandidates();
      if (events.length) {
        const event = events[0];
        addLog(`${STATE.year}年：${event.title}正在发生。`);
        showEventModal(event);
      }

      if (STATE.year >= WORLD.years.end) {
        resolveEnding();
      }

      render();
    }

    function saveGame() {
      const data = {
        version: GAME_VERSION,
        year: STATE.year,
        country: STATE.country,
        route: STATE.route,
        stats: STATE.stats,
        logs: STATE.logs,
        ended: STATE.ended,
        actionUsedThisYear: STATE.actionUsedThisYear
      };
      localStorage.setItem("SVVIP_SAVE", JSON.stringify(data));
      addLog("游戏已保存。");
      render();
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem("SVVIP_SAVE");
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (!data) return false;

        STATE.year = data.year || 1830;
        STATE.country = data.country || "大英帝国";
        STATE.route = data.route || "history";
        STATE.ended = !!data.ended;
        STATE.actionUsedThisYear = !!data.actionUsedThisYear;
        const base = createInitialStats({ ...getCountryData().stats, ...(data.stats || {}) });
        STATE.stats = base;
        STATE.logs = Array.isArray(data.logs) ? data.logs : [];
        clampStats();
        render();
        return true;
      } catch (err) {
        return false;
      }
    }

    function initSelects() {
      $("nation").innerHTML = Object.keys(COUNTRIES).map(name => `<option value="${name}">${name}</option>`).join("");
      $("routeSelect").innerHTML = Object.entries(ROUTES).map(([key, route]) => `<option value="${key}">${route.name}</option>`).join("");

      $("nation").onchange = (e) => {
        STATE.country = e.target.value;
        resetGame();
      };

      $("routeSelect").onchange = (e) => {
        STATE.route = e.target.value;
        resetGame();
      };
    }

    function init() {
      initSelects();
      const loaded = loadGame();
      if (!loaded) {
        STATE.stats = createInitialStats(getCountryData().stats);
        applyCountryTraitBonuses();
        applyRouteBonus();
        addLog(`${STATE.country} 于 ${STATE.year} 年起步，路线：${getRouteData().name}。`);
      }
      render();
      $("next").onclick = progressYear;
      $("save").onclick = saveGame;
      $("reset").onclick = () => {
        resetGame();
      };
    }

    init();
  </script>
</body>
</html>
