<style>
:root{--bg:#09121d;--panel:#101e2c;--card:#172b3e;--line:#2b4965;--text:#edf6ff;--muted:#9bb5ca;--gold:#f5d17a;--blue:#6eb8ff;--green:#78e0a5;--red:#ff8989;--orange:#ffb86f;--purple:#d2b0ff}*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(circle at top,#294d70 0,#09121d 38%);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif}.app{max-width:1480px;margin:auto;background:#0c1722ed;border:1px solid #ffffff25;border-radius:20px;overflow:hidden;box-shadow:0 24px 60px #0008}.top{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{color:var(--gold);font-size:1.3rem;font-weight:bold;letter-spacing:.12em}.topright{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.year{padding:10px 16px;border-radius:20px;background:#1a344b;border:1px solid var(--line);font-weight:bold}.btn,.tab,.choice{cursor:pointer;color:var(--text);background:#ffffff0a;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-weight:bold}.btn:hover,.tab:hover,.choice:hover{border-color:var(--blue);transform:translateY(-1px)}.btn.main{background:#276a9e}.btn.warn{color:var(--gold)}.grid{display:grid;grid-template-columns:285px minmax(0,1fr) 350px}.panel{margin:15px;padding:16px;border:1px solid var(--line);border-radius:15px;background:#101e2ccc}.panel h2{font-size:1rem;color:var(--gold);margin:0 0 13px}.sub{font-size:.74rem;color:var(--muted);font-weight:normal;margin-left:6px}.select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0b1824;color:var(--text);margin-bottom:11px}.timeline{padding:12px;border:1px solid #d2b0ff55;background:#d2b0ff0c;border-radius:12px;margin-bottom:12px}.timeline b{display:block;color:var(--purple);margin-bottom:5px}.timeline small{color:var(--muted);line-height:1.5}.stats,.minis{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat,.mini{border:1px solid var(--line);border-radius:10px;background:#ffffff05;padding:10px}.stat label,.mini label{display:block;color:var(--muted);font-size:.72rem;margin-bottom:6px}.stat strong,.mini strong{font-size:1.08rem}.bars{display:grid;gap:10px;margin-top:14px}.barline{display:grid;grid-template-columns:50px 1fr 28px;gap:7px;align-items:center;color:var(--muted);font-size:.78rem}.bar{height:9px;background:#ffffff12;border-radius:9px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:inherit}.notice{margin-top:13px;padding:10px;border-radius:10px;border:1px solid #ffb86f55;background:#ffb86f12;color:var(--orange);font-size:.78rem;line-height:1.5}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tab{font-size:.8rem;color:var(--muted);padding:8px 11px}.tab.active{background:#3279ae;color:#fff}.view{display:none}.view.active{display:block}.regions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.region,.detail,.goal,.log,.action{border:1px solid var(--line);border-radius:11px;background:#ffffff05;padding:12px}.region h3{font-size:.95rem;margin:0 0 8px}.badge{display:inline-block;color:var(--green);border:1px solid #78e0a555;background:#78e0a512;border-radius:20px;padding:3px 7px;font-size:.7rem}.badge.warn{color:var(--orange);border-color:#ffb86f55;background:#ffb86f12}.region p,.detail{color:var(--muted);font-size:.8rem;line-height:1.6}.meter{height:6px;background:#ffffff12;border-radius:8px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:var(--blue)}.actions{display:grid;gap:9px}.action{width:100%;text-align:left;color:var(--text);cursor:pointer}.action:hover{border-color:var(--blue)}.action b{display:flex;justify-content:space-between;margin-bottom:5px}.cost{color:var(--gold);font-size:.72rem}.action span{display:block;color:var(--muted);font-size:.75rem;line-height:1.5}.bottom{display:grid;grid-template-columns:1.5fr 1fr;border-top:1px solid var(--line)}.list{display:grid;gap:8px;max-height:260px;overflow:auto}.log,.goal{font-size:.8rem;line-height:1.55;color:var(--muted)}.log{border-left:3px solid var(--blue)}.goal.done{border-color:#78e0a555;color:var(--green)}.goal b{color:var(--text)}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:4}.modal.show{display:flex}.modalbox{width:min(590px,100%);background:#102335;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 20px 60px #000}.modalbox h2{color:var(--gold);margin:0 0 8px}.modalbox p{color:var(--muted);line-height:1.7}.choices{display:grid;gap:9px}.choice{text-align:left}.choice small{display:block;color:var(--muted);margin-top:4px;font-weight:normal}.empty{text-align:center;color:var(--muted);padding:20px}@media(max-width:1080px){.grid,.bottom{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:580px){body{padding:7px}.panel{margin:9px;padding:12px}.regions{grid-template-columns:1fr}.stats,.minis{grid-template-columns:1fr}}
</style>

<body><div class="app">
<header class="top"><div class="brand">大时代 · 五线史诗</div><div class="topright"><div class="year" id="year">1830年 · 工业前夜</div><button class="btn main" id="next">推进一年</button><button class="btn warn" id="save">保存</button><button class="btn" id="reset">重开</button></div></header>
<div class="grid"><aside class="panel"><h2>国家概览<span class="sub">选择你的国家</span></h2><select id="nation" class="select"></select><div class="timeline"><b id="lineName"></b><small id="lineDesc"></small></div><div class="stats"><div class="stat"><label>综合国力</label><strong id="power"></strong></div><div class="stat"><label>财政储备</label><strong id="money"></strong></div><div class="stat"><label>人口</label><strong id="people"></strong></div><div class="stat"><label>国际威望</label><strong id="prestige"></strong></div></div><div class="bars"><div class="barline"><span>稳定</span><div class="bar"><i id="stabilityBar"></i></div><b id="stability"></b></div><div class="barline"><span>经济</span><div class="bar"><i id="economyBar"></i></div><b id="economy"></b></div><div class="barline"><span>军力</span><div class="bar"><i id="militaryBar"></i></div><b id="military"></b></div><div class="barline"><span>科技</span><div class="bar"><i id="scienceBar"></i></div><b id="science"></b></div></div><div class="notice" id="notice"></div></aside>
<main class="panel"><h2>历史舞台<span class="sub">真实节点提供骨架，选择决定分叉方向</span></h2><div class="tabs"><button class="tab active" data-v="world">世界局势</button><button class="tab" data-v="history">主线记录</button><button class="tab" data-v="future">架空推演</button><button class="tab" data-v="diplomacy">外交内政</button></div><section class="view active" id="world"><div class="regions" id="regions"></div></section><section class="view" id="history"><div class="detail"><b>真实历史锚点</b><p>本游戏不会抹除真实时代背景：工业革命、帝国竞争、两次世界大战和战后秩序会按年份出现。玩家可以改变一国的应对方式，但无法让时代失去因果。</p><p id="anchor"></p></div><div class="detail" style="margin-top:10px"><b>当前路线反馈</b><p id="routeFeedback"></p></div></section><section class="view" id="future"><div class="detail"><b>架空线原则</b><p>架空不是脱离现实，而是在真实节点上改变决策：一次改革、一次结盟、一次技术投资，都可能把同一个危机导向不同结局。</p></div><div class="minis" style="margin-top:10px"><div class="mini"><label>历史偏离度</label><strong id="divergence"></strong></div><div class="mini"><label>路线一致性</label><strong id="coherence"></strong></div></div></section><section class="view" id="diplomacy"><div class="minis"><div class="mini"><label>国际影响</label><strong id="influence"></strong></div><div class="mini"><label>外交威望</label><strong id="dip"></strong></div><div class="mini"><label>制度稳定</label><strong id="policyStability"></strong></div><div class="mini"><label>科技底盘</label><strong id="scienceBase"></strong></div></div><div class="detail" style="margin-top:10px" id="assessment"></div></section></main>
<aside class="panel"><h2>战略行动<span class="sub">用行动塑造分叉</span></h2><div class="actions" id="actions"></div></aside></div>
<div class="bottom"><section class="panel"><h2>历史日志<span class="sub">真实节点与玩家决定都会留下痕迹</span></h2><div class="list" id="logs"></div></section><section class="panel"><h2>路线目标与成就</h2><div class="list" id="goals"></div></section></div></div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="eventTitle"></h2><p id="eventText"></p><div class="choices" id="choices"></div></div></div>
<script>
const 国家={"大英帝国":{经济:75,军力:68,科技:72,稳定:76,财政:620,威望:78,人口:240,影响:81},"清王朝":{经济:58,军力:62,科技:52,稳定:60,财政:410,威望:64,人口:360,影响:56},"法兰西帝国":{经济:64,军力:66,科技:69,稳定:68,财政:470,威望:72,人口:150,影响:70},"德意志帝国":{经济:70,军力:82,科技:76,稳定:67,财政:500,威望:79,人口:120,影响:68},"大日本帝国":{经济:65,军力:74,科技:71,稳定:64,财政:420,威望:75,人口:90,影响:63},"俄罗斯帝国":{经济:57,军力:78,科技:58,稳定:63,财政:520,威望:70,人口:170,影响:67},"奥斯曼帝国":{经济:51,军力:59,科技:55,稳定:52,财政:390,威望:58,人口:140,影响:62}};
const 线路={
历史主线:{名:"历史主线 · 原轨",简介:"尊重真实历史的主要节点，在约束中寻找最优解。",色:"#f5d17a",加成:{稳定:2},反馈:"你正在沿着真实历史的主航道前进。历史节点会发生，但你的应对将改变代价与余波。"},
宪政改革:{名:"架空线一 · 宪政改革",简介:"在真实危机出现时优先推进制度改革，让国家以渐进方式完成现代化。",加成:{稳定:5,科技:2},反馈:"这条线不是凭空创造和平，而是把真实的社会矛盾导向协商、议会和制度更新。"},
海洋联邦:{名:"架空线二 · 海洋联邦",简介:"以贸易、港口和多边协定替代单纯殖民竞争，重塑全球网络。",加成:{经济:4,影响:4},反馈:"帝国竞争仍然存在，但你试图把真实的航运与资源竞争改造成互惠联邦。"},
工业跃迁:{名:"架空线三 · 工业跃迁",简介:"抓住真实工业革命的技术窗口，提前投资教育、能源与基础设施。",加成:{经济:5,科技:5},反馈:"技术不会凭空出现；你只是比历史中的多数决策者更早、更集中地投入。"},
大陆均衡:{名:"架空线四 · 大陆均衡",简介:"面对真实的列强对峙，优先建立安全体系，避免危机滑向全面战争。",加成:{军力:4,威望:3},反馈:"战争风险没有消失，你通过联盟、威慑与妥协改变冲突的规模和持续时间。"}
};
const 地区=["欧洲","东亚","南亚","中东","非洲","美洲"];
const 锚点={1830:"工业革命扩散，铁路、工厂与金融网络开始重塑国家能力。",1848:"欧洲革命浪潮与社会改革压力上升。",1871:"德意志统一改变欧洲力量平衡。",1884:"列强加快争夺海外市场与资源。",1914:"联盟体系失控，第一次世界大战爆发。",1918:"战争结束，民族国家与新秩序开始重组。",1929:"经济大萧条冲击贸易、财政和社会稳定。",1939:"第二次世界大战爆发，工业与动员能力受到极限考验。",1945:"战争结束，国际制度与世界秩序重新建立。",1950:"战后时代开启，玩家的国家进入新的历史阶段。"};
const 状态={年:1830,国家:"大英帝国",线路:"历史主线",经济:0,军力:0,科技:0,稳定:0,财政:0,威望:0,人口:0,影响:0,日志:[],偏离:0,结束:false};
const 事件=[{题:"1848年的改革压力",文:"真实的革命与社会改革浪潮已经传来。你可以压制它，也可以把压力转成制度更新。",选项:[{名:"召开改革会议",说:"稳定+9，科技+3，财政-25，历史偏离+4",做:s=>{s.稳定+=9;s.科技+=3;s.财政-=25;s.偏离+=4}},{名:"强化秩序",说:"军力+5，稳定-5，威望-2，历史偏离+1",做:s=>{s.军力+=5;s.稳定-=5;s.威望-=2;s.偏离+=1}}]},{题:"1871年的力量重组",文:"德意志统一改变了欧洲的力量结构。旧有外交平衡需要重新安排。",选项:[{名:"推动均势会议",说:"威望+8，影响+6，财政-20，历史偏离+6",做:s=>{s.威望+=8;s.影响+=6;s.财政-=20;s.偏离+=6}},{名:"扩军备战",说:"军力+10，财政-35，稳定-3，历史偏离+2",做:s=>{s.军力+=10;s.财政-=35;s.稳定-=3;s.偏离+=2}}]},{题:"1929年的经济危机",文:"真实的金融危机正在摧毁贸易与就业。国家必须决定谁来承担代价。",选项:[{名:"公共投资救市",说:"经济+7，稳定+6，财政-50，历史偏离+7",做:s=>{s.经济+=7;s.稳定+=6;s.财政-=50;s.偏离+=7}},{名:"紧缩保财政",说:"财政+30，经济-5，稳定-7，历史偏离+2",做:s=>{s.财政+=30;s.经济-=5;s.稳定-=7;s.偏离+=2}}]},{题:"1945年的新秩序",文:"大战结束，战后制度正在形成。你可以参与规则制定，也可以退回孤立。",选项:[{名:"参与国际建设",说:"影响+10，威望+8，财政-30，历史偏离+5",做:s=>{s.影响+=10;s.威望+=8;s.财政-=30;s.偏离+=5}},{名:"优先重建国内",说:"经济+6，稳定+5，影响-3，历史偏离+1",做:s=>{s.经济+=6;s.稳定+=5;s.影响-=3;s.偏离+=1}}]}];
const 行动=[{名:"工业化建设",费:40,描述:"修建工厂、铁路与城市基础设施。",做:s=>{s.经济+=12;s.科技+=4;s.财政-=35;s.威望+=3}},{名:"军制改革",费:35,描述:"整顿训练、编制和后勤体系。",做:s=>{s.军力+=13;s.财政-=30;s.稳定-=2;s.威望+=3}},{名:"科学教育",费:30,描述:"扩充学校和研究机构，获得长期技术收益。",做:s=>{s.科技+=13;s.经济+=3;s.财政-=28;s.威望+=5}},{名:"外交联络",费:25,描述:"争取友邦、会议与协定。",做:s=>{s.威望+=10;s.影响+=10;s.财政-=22;s.稳定+=2}},{名:"政治改革",费:20,描述:"改善制度与民生，稳住社会秩序。",做:s=>{s.稳定+=12;s.经济+=5;s.财政-=18;s.威望+=3}},{名:"海外拓展",费:45,描述:"控制贸易航线和资源地带。",做:s=>{s.影响+=13;s.财政-=40;s.军力+=4;s.威望+=5;s.稳定-=3}},{名:"基础设施",费:35,描述:"建设港口、道路和城市网络。",做:s=>{s.经济+=9;s.人口+=8;s.影响+=5;s.财政-=30}},{名:"战时动员",费:50,描述:"储备军需，扩大后勤和战备制度。",做:s=>{s.军力+=17;s.财政-=48;s.稳定-=5;s.威望+=3}}];
const $=id=>document.getElementById(id),钳=(n,a=0,b=100)=>Math.min(b,Math.max(a,Math.round(n))),时代=y=>y<=1850?"工业前夜":y<=1875?"扩张时代":y<=1900?"大国博弈":y<=1918?"世界大战":y<=1930?"动荡交错":y<=1950?"重塑秩序":"时代终章",国力=()=>Math.round((状态.经济+状态.军力+状态.科技+状态.稳定+状态.影响+状态.威望)/6+状态.财政/25);
function 规范(){["经济","军力","科技","稳定","威望","影响"].forEach(k=>状态[k]=钳(状态[k]));状态.财政=Math.max(-500,Math.round(状态.财政));状态.人口=Math.max(1,Math.round(状态.人口))}function 记(t){状态.日志.unshift(t);状态.日志=状态.日志.slice(0,28)}
function 重开(){let b=国家[状态.国家];Object.assign(状态,{年:1830,经济:b.经济,军力:b.军力,科技:b.科技,稳定:b.稳定,财政:b.财政,威望:b.威望,人口:b.人口,影响:b.影响,偏离:0,结束:false,日志:["1830年：历史帷幕开启，你接管了"+状态.国家+"。",`路线：${线路[状态.线路].名}`]});for(let k in 线路[状态.线路].加成)状态[k]+=线路[状态.线路].加成[k];规范();渲染();}
function 初始化选项(){ $("nation").innerHTML=Object.keys(国家).map(n=>`<option>${n}</option>`).join("");$("lineName").innerHTML=Object.values(线路).map(l=>`<option>${l.名}</option>`).join(""); }
function 渲染线路选择(){let box=$("lineName");box.innerHTML=`<select id="lineSelect" class="select">${Object.entries(线路).map(([k,l])=>`<option value="${k}">${l.名}</option>`).join("")}</select><small>${线路[状态.线路].简介}</small>`;$("lineSelect").value=状态.线路;$("lineSelect").onchange=e=>{状态.线路=e.target.value;重开()};}
function 渲染(){渲染线路选择();$("nation").value=状态.国家;$("year").textContent=`${状态.年}年 · ${时代(状态.年)}`;$("power").textContent=国力();$("money").textContent=状态.财政;$("people").textContent=状态.人口+"百万";$("prestige").textContent=状态.威望;[["stability",状态.稳定],["economy",状态.经济],["military",状态.军力],["science",状态.科技]].forEach(([k,v])=>{$(k).textContent=v;$(k+"Bar").style.width=钳(v)+"%"});$("notice").textContent=状态.稳定<25?"警告：秩序濒临崩溃。":状态.财政<0?"警告：财政透支，需优先恢复收入。":状态.军力>状态.经济+20?"提示：军备负担过重。":"国家运行稳定，可以继续塑造历史。";渲染地区();渲染视图();渲染行动();渲染日志();}
function 渲染地区(){let core=(状态.影响+状态.军力+状态.经济)/3;$("regions").innerHTML=地区.map((n,i)=>{let v=钳(core*(.7+i*.08),20,99);return`<div class="region"><h3>${n}</h3><span class="badge ${v<45?"warn":""}">${v>75?"主导":v>60?"关键":v>45?"平衡":"脆弱"}</span><p>战略态势：${v}%<br>真实背景：${地区背景(n,状态.年)}</p><div class="meter"><i style="width:${v}%"></i></div></div>`}).join("")}
function 地区背景(n,y){if(y>=1914&&y<=1918)return"战争动员影响扩大";if(y>=1939&&y<=1945)return"全球战争重塑格局";if(n==="欧洲"&&y>=1871)return"统一与均势竞争";if(n==="东亚"&&y>=1894)return"现代化与列强竞争";return"贸易、改革与势力角逐"}
function 渲染视图(){$("anchor").textContent=锚点[状态.年]||"当前年份处于两个历史节点之间，结构性变化正在累积。";$(`routeFeedback`).textContent=线路[状态.线路].反馈;$("divergence").textContent=状态.偏离+"%";$("coherence").textContent=状态.偏离>20?"高风险分叉":"符合时代因果";$("influence").textContent=状态.影响;$("dip").textContent=状态.威望;$("policyStability").textContent=状态.稳定;$("scienceBase").textContent=状态.科技;$("assessment").textContent=状态.影响>80?"外交网络强大，可以用协定和威慑改变危机走向。":状态.稳定<45?"内政压力较高，建议先改革再扩张。":"国家处于可持续发展区间。"}
function 渲染行动(){$("actions").innerHTML=行动.map((a,i)=>`<button class="action" data-i="${i}"><b>${a.名}<span class="cost">${a.费}财政</span></b><span>${a.描述}</span></button>`).join("");document.querySelectorAll(".action").forEach(b=>b.onclick=()=>执行(行动[b.dataset.i]))}
function 执行(a){if(状态.结束)return;if(状态.财政<a.费){记(`${状态.年}年：财政不足，无法执行“${a.名}”。`);return渲染()}a.做(状态);规范();状态.偏离+=状态.线路==="历史主线"?1:2;记(`${状态.年}年：${a.名}完成，路线发生细微偏转。`);渲染()}
function 渲染日志(){$("logs").innerHTML=状态.日志.map(x=>`<div class="log">${x}</div>`).join("");let p=国力();let gs=[["跨越时代",状态.年>=1950,"坚持到1950年"],["强国崛起",p>=220,"综合国力达到220"],["制度根基",状态.稳定>=75,"稳定度达到75"],["工业先驱",状态.经济>=80&&状态.科技>=80,"经济与科技达到80"],["路线塑造者",状态.偏离>=20&&状态.年>=1900,"在真实骨架上形成明显分叉"]];$("goals").innerHTML=gs.map(g=>`<div class="goal ${g[1]?"done":""}"><b>${g[1]?"已完成":"进行中"} · ${g[0]}</b><br>${g[2]}</div>`).join("")}
function 事件弹窗(){let e=事件[Math.floor(Math.random()*事件.length)];$("eventTitle").textContent=e.题;$("eventText").textContent=e.文;$("choices").innerHTML=e.选项.map((o,i)=>`<button class="choice" data-i="${i}"><b>${o.名}</b><small>${o.说}</small></button>`).join("");$("modal").classList.add("show");document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{let o=e.选项[b.dataset.i];o.做(状态);规范();记(`${状态.年}年：在“${e.题}”中选择“${o.名}”。`);$("modal").classList.remove("show");渲染()})}
function 真实节点(){if(锚点[状态.年]){记(`${状态.年}年·真实节点：${锚点[状态.年]}`);if(状态.线路!=="历史主线")记(`${状态.年}年·路线分叉：${线路[状态.线路].名}改变了应对方式，但时代约束仍然存在。`)}}
function 推进(){if(状态.结束)return;if(状态.年>=1950)return结算();状态.年++;状态.财政+=Math.max(18,Math.round(状态.经济/3));状态.人口+=(状态.经济+状态.科技)/45;状态.经济+=2;状态.军力+=1;状态.影响+=1;状态.稳定+=Math.round((状态.经济-状态.军力)/20);if((状态.年>=1914&&状态.年<=1918)||(状态.年>=1939&&状态.年<=1945)){状态.财政-=状态.军力>60?55:25;状态.稳定-=状态.军力>60?8:3}真实节点();if([1848,1871,1929,1945].includes(状态.年)||Math.random()<.4)事件弹窗();else 记(`${状态.年}年：时代在真实结构中继续推进，你的路线影响正在累积。`);规范();渲染()}
function 结算(){状态.结束=true;let p=国力(),t=p>=260&&状态.稳定>=55?"强国结局：你在真实历史骨架上塑造了一个足以改变世界的国家。":p>=200?"中坚结局：你改变了部分历史走向，但仍受时代约束。":"失序结局：分叉过早、资源不足，国家未能承受时代冲击。";记(`1950年·时代终章：${t}`);渲染();$("next").disabled=true}
$("nation").onchange=e=>{状态.国家=e.target.value;重开()};$("next").onclick=推进;$("save").onclick=()=>{localStorage.setItem("SVVIP_五线存档",JSON.stringify(状态));记("存档成功：五线历史已保存。");渲染()};$("reset").onclick=()=>{if(confirm("确定重开当前路线吗？"))重开()};document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab,.view").forEach(x=>x.classList.remove("active"));t.classList.add("active");$(t.dataset.v).classList.add("active")});初始化选项();重开();
</script></body></html>
