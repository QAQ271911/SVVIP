      { id:'1929_credit_crash', year:1929, title:'1929：经济危机', text:'银行、工厂和家庭都在失去安全感。救市意味着债务，紧缩意味着失业。', choices:[
        { name:'大规模救市', result:'暂时稳定，但财政承压。', effect:{稳定:10,财政:-34,经济:8,社会:6}, influence:{商业派:16,改革派:10} },
        { name:'紧缩复苏', result:'财政更稳，但社会代价很高。', effect:{财政:15,稳定:-8,社会:-10,威望:-5}, influence:{保守派:18,军方:6} },
        { name:'社会工程', result:'工人与城市获得一轮缓冲，国家更具合法性。', effect:{稳定:7,社会:12,威望:8,财政:-20}, influence:{工党:18,改革派:10} }
      ] },
      { id:'1945_new_world', year:1945, title:'1945：新世界', text:'战争结束，帝国、民族国家与新国际组织争夺未来叙事。', choices:[
        { name:'参与新秩序', result:'影响提升，但需要成本与妥协。', effect:{影响:12,财政:-20,威望:7,稳定:4}, influence:{外交派:20,商业派:9} },
        { name:'保守主权', result:'更容易稳住国家，但失去部分国际话语权。', effect:{稳定:7,军力:6,影响:-8,财政:10}, influence:{保守派:16,军方:8} },
        { name:'改革联盟', result:'让制度更现代化，代价是更大社会调整。', effect:{稳定:8,社会:12,威望:9,财政:-12}, influence:{改革派:18,工党:10} }
      ] }
    ];

    const state = {
      year: YEARS.start,
      country: '大英帝国',
      route: 'history',
      stats: {},
      factionInfluence: {},
      logs: [],
      inertia: [],
      used: false,
      ended: false,
      event: null,
      flags: {},
      leader: {},
      regions: [],
      aiAdvice: '',
      pressure: 0
    };

    const $ = (id) => document.getElementById(id);

    function clamp() {
      METRICS.forEach(k => {
        const v = Number(state.stats[k] || 0);
        if (k === '财政') state.stats[k] = Math.round(v);
        else if (k === '人口') state.stats[k] = Math.min(500, Math.max(0, v));
        else state.stats[k] = Math.min(100, Math.max(0, v));
      });
    }

    function apply(obj) {
      Object.keys(obj || {}).forEach(k => {
        if (k in state.stats) state.stats[k] += Number(obj[k] || 0);
      });
      clamp();
    }

    function setFactionInfluence(overrides) {
      FACTIONS.forEach(f => { if (!state.factionInfluence[f]) state.factionInfluence[f] = 0; });
      Object.keys(overrides || {}).forEach(f => {
        if (f in state.factionInfluence) state.factionInfluence[f] += Number(overrides[f] || 0);
      });
      FACTIONS.forEach(f => state.factionInfluence[f] = Math.max(0, Math.min(100, state.factionInfluence[f])));
    }

    function getCountryData() { return countries[state.country]; }
    function getRouteData() { return routes[state.route]; }
    function getEraName(year) {
      if (year <= 1850) return '工业前夜';
      if (year <= 1875) return '扩张时代';
      if (year <= 1900) return '大国博弈';
      if (year <= 1918) return '世界大战';
      if (year <= 1929) return '战后重构';
      if (year <= 1939) return '经济断层';
      if (year <= 1945) return '全球冲突';
      return '新世界秩序';
    }

    function log(msg) {
      state.logs.unshift(msg);
      state.logs = state.logs.slice(0, 36);
    }

    function buildLeaderProfile(countryData) {
      const preset = countryData.leaderPreset || { name:'国家领袖', charisma:60, resolve:60, wisdom:60, ruthlessness:40, reform:50, legitimacy:60 };
      state.leader = {
        ...preset,
        authority: Math.round((preset.resolve + preset.legitimacy + preset.charisma) / 3),
        ambition: Math.round((preset.wisdom + preset.reform + preset.ruthlessness) / 3)
      };
    }

    function buildRegions(countryData) {
      state.regions = (countryData.regions || []).map((region) => ({
        ...region,
        heat: Math.min(100, Math.max(0, region.heat || 20)),
        risk: Math.min(100, Math.max(0, region.risk || 50)),
        contenderScore: Math.round((region.heat || 20) * 0.55 + (region.risk || 50) * 0.45)
      }));
    }

    function computePressure() {
      const s = state.stats;
      const avgHeat = state.regions.reduce((total, r) => total + r.heat, 0) / Math.max(1, state.regions.length);
      const pressure = Math.round((100 - s.稳定) * 0.38 + (100 - s.威望) * 0.18 + avgHeat * 0.44 + (100 - s.财政 / 6) * 0.12);
      state.pressure = Math.max(0, Math.min(100, pressure));
      return state.pressure;
    }

    function getFactionSummary() {
      const arr = FACTIONS.map(f => ({ name: f, value: state.factionInfluence[f] || 0 })).sort((a,b) => b.value - a.value);
      return arr.slice(0,4).map(x => `${x.name}:${x.value}`).join(' / ');
    }

    function buildAIAdvice() {
      const s = state.stats;
      const hot = [...state.regions].sort((a,b) => b.heat - a.heat)[0];
      if (s.稳定 < 42 || (hot && hot.heat > 70)) {
        return `AI判断：国家正在承受地方叛乱与制度压力，建议优先镇压${hot ? hot.name : '关键地区'}，随后整编地方军政，避免“镇压-反弹”的循环。`;
      }
      if (s.财政 < 180) return 'AI判断：财政压制日益明显，建议压缩盲目扩张、保护税源和重工业，降低债务对社会合法性的冲击。';
      if (s.军力 < 58 && s.稳定 > 55) return 'AI判断：军力与军需水平不足，建议推进军制改革、关键铁路与边境防御，避免外部威胁叠加。';
      if (s.科技 < 65) return 'AI判断：知识、教育与工业生态仍偏弱，建议以教育改革和工业建设为主，不宜在外部扩张上过度冒险。';
      if (s.影响 < 55) return 'AI判断：国际影响力不足，建议与海权/协约网络同行，稳步提升外交、贸易和国家信誉。';
      return 'AI判断：国家处于相对稳固期，建议保持稳定、财政和社会之间的平衡，并在地区博弈中选取最能提升合法性的路线。';
    }

    function getAvailableEvent() {
      const matched = GLOBAL_EVENTS.filter(ev => ev.year === state.year && !state.flags[ev.id]);
      if (matched.length) return matched[0];
      const hotRegion = [...state.regions].sort((a,b) => b.heat - a.heat)[0];
      if (hotRegion && hotRegion.heat > 70) {
        return {
          id: `crisis_${state.year}_${hotRegion.name}`,
          title: `${state.year}：${hotRegion.name}割据危机`,
          text: `${hotRegion.contender}在${hotRegion.name}集结力量，地区潜力与国家政治冲突叠加。`,
          choices: [
            { name:'镇压并整编', result:'短期秩序恢复，但损耗社会与法制。', effect:{稳定:8,军力:5,社会:-8,财政:-22}, influence:{军方:20,地方派:10} },
            { name:'地方自治改革', result:'维持稳定与延缓叛乱，但牺牲部分中央控制。', effect:{稳定:5,社会:8,影响:7,财政:-15}, influence:{改革派:15,地方派:18} },
            { name:'联合当地名士', result:'提升合法性，削弱割据热度。', effect:{稳定:6,威望:7,社会:5,财政:-12}, influence:{工党:10,外交派:8} }
          ]
        };
      }
      return null;
    }

    function renderLeaderPanel() {
      const c = getCountryData();
      $('leaderName').textContent = `${state.leader.name} · ${state.leader.authority}权威`;
      $('leaderDesc').textContent = `${c.mood} 其统治风格以${state.leader.charisma > 75 ? '威严型' : state.leader.reform > 65 ? '改革型' : state.leader.ruthlessness > 55 ? '铁腕型' : '务实型'}为核心。`;
      const metricMap = [ ['威望', state.leader.charisma], ['决断', state.leader.resolve], ['智慧', state.leader.wisdom], ['合法', state.leader.legitimacy], ['改革', state.leader.reform], ['铁腕', state.leader.ruthlessness] ];
      $('leaderStats').innerHTML = metricMap.map(([label, value]) => `
        <div class="attr-box"><div class="label">${label}</div><div class="val">${value}</div></div>
      `).join('');
    }

    function renderStateGrid() {
      const s = state.stats;
      const blocks = [
        ['合法性', Math.max(0, Math.min(100, Math.round((s.稳定 + s.威望 + state.leader.legitimacy) / 3)))],
        ['财政', Math.max(0, Math.min(100, Math.round((s.财政 + 100) / 10)))],
        ['军政', Math.max(0, Math.min(100, Math.round((s.军力 + state.leader.resolve) / 2)))],
        ['社会', Math.max(0, Math.min(100, Math.round((s.社会 + s.稳定 + state.leader.reform) / 3))) ]
      ];
      $('stateGrid').innerHTML = blocks.map(([label, value]) => `
        <div class="state-box"><div class="label">${label}</div><div class="value">${value}</div></div>
      `).join('');
    }

    function renderPartyPower() {
      $('powerList').innerHTML = FACTIONS.map(f => {
        const value = state.factionInfluence[f] || 0;
        return `
          <div class="power-row">
            <div class="name">${f}</div>
            <div class="power-track"><i style="width:${value}%;"></i></div>
            <div><b>${Math.round(value)}</b></div>
          </div>
        `;
      }).join('');
    }

    function renderRegions() {
      $('regions').innerHTML = state.regions.map(region => {
        const cls = region.heat > 70 ? 'hot' : region.heat > 45 ? 'warm' : 'cool';
        return `
          <div class="region-card">
            <div class="region-head"><strong>${region.name}</strong><b class="${cls}">${Math.round(region.heat)}</b></div>
            <small>热度 / 关键人物 / 风险</small>
            <div style="margin-top:8px;color:#dfeefb;font-size:12px;line-height:1.6;">
              ${region.contender}<br>风险 ${region.risk} | 评估 ${region.contenderScore}<br>目标：${region.ambition}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderMiniInfo() {
      const c = getCountryData();
      $('miniList').innerHTML = [
        `路线：${getRouteData().name}`,
        `政治气候：${c.mood}`,
        `统治集团：${getFactionSummary()}`,
        `地区风险：${state.regions.filter(r => r.heat > 50).length}个热点`,
        `当前压力：${computePressure()} / 100`
      ].map(x => `<div class="mini">${x}</div>`).join('');
    }

    function renderActions() {
      const route = getRouteData();
      const extras = [];
      if (route.name === '宪政改革') extras.push({ id:'parliament', name:'扩大议会', cost:30, desc:'提高制度合法性与社会参与。', effect:{稳定:8,社会:8,威望:7,财政:-20} });
      if (route.name === '海洋联邦') extras.push({ id:'navy', name:'海军扩张', cost:35, desc:'控制航线并维护海外网络。', effect:{影响:9,贸易:6,军力:5,财政:-25} });
      if (route.name === '工业跃迁') extras.push({ id:'steel', name:'钢铁与电力', cost:40, desc:'以重工业换取技术与产能。', effect:{科技:9,经济:14,产业:12,财政:-30} });
      if (route.name === '大陆均衡') extras.push({ id:'railway', name:'战略铁路', cost:32, desc:'连接军工、资源与边疆。', effect:{军力:7,经济:6,产业:7,军需:10,财政:-23} });

      const actions = [...ACTIONS, ...extras];
      $('actions').innerHTML = actions.map((a, i) => `
        <button class="action" data-i="${i}" ${state.used || state.ended ? 'disabled' : ''}>
          <div class="action-head"><span>${a.name}</span><span class="cost">${a.cost}财</span></div>
          <small>${a.desc}</small>
        </button>
      `).join('');
      $('actions').querySelectorAll('.action').forEach(btn => btn.onclick = () => performAction(Number(btn.dataset.i)));
    }

    function renderLogs() {
      $('logs').innerHTML = (state.logs.length ? state.logs : ['暂无历史记录。']).map(x => `<div class="log">${x}</div>`).join('');
    }

    function renderGoals() {
      const s = state.stats;
      const goals = [
        ['跨越时代', state.year >= YEARS.end],
        ['制度稳定', s.稳定 >= 70],
        ['工业化', s.科技 >= 80 && s.产业 >= 75],
        ['国际影响', s.影响 >= 80],
        ['社会契约', s.社会 >= 70],
        ['地方整合', state.regions.every(r => r.heat < 40)]
      ];
      $('goals').innerHTML = goals.map(([text, done]) => `
        <div class="goal-row"><span>${text}</span><span class="chip ${done ? 'done' : 'todo'}">${done ? '已达成' : '待达成'}</span></div>
      `).join('');
    }

    function renderInertia() {
      const list = [...(state.inertia || []), ...state.logs.slice(0, 2)];
      $('inertia').innerHTML = list.slice(0, 8).map(x => `<div class="point">${x}</div>`).join('') || '<div class="point">暂无惯性</div>';
    }

    function renderStatus() {
      const c = getCountryData();
      const r = getRouteData();
      $('year').textContent = `${state.year}年 · ${getEraName(state.year)}`;
      $('nation').value = state.country;
      $('route').value = state.route;
      $('institution').textContent = c.institution;
      $('anchor').textContent = anchors[state.year] || '结构性变化正在累积，下一次选择可能改变时代。';
      $('traits').innerHTML = c.tags.map(tag => `<span class="tag">${tag}</span>`).join('') + ` <span class="tag">${state.leader.name}</span> <span class="tag">${r.name}</span>`;
      $('traitDesc').textContent = `${c.trait} 当前路线：${r.desc}`;
      state.aiAdvice = buildAIAdvice();
      $('aiAdvisor').textContent = state.aiAdvice;

      const statsWrap = document.createElement('div');
      statsWrap.className = 'stats';
      statsWrap.innerHTML = METRICS.map(k => {
        const v = Number(state.stats[k] || 0);
        const width = k === '财政' ? Math.max(5, Math.min(100, (v + 500) / 12)) : k === '人口' ? Math.min(100, v / 4) : Math.min(100, v);
        const color = k === '稳定' ? 'var(--green)' : k === '军力' ? 'var(--red)' : k === '财政' ? 'var(--gold)' : k === '影响' ? 'var(--purple)' : 'var(--blue)';
        return `<div class="metric"><div class="head"><span>${k}</span><b>${v}</b></div><div class="bar"><i style="width:${width}%;background:${color};"></i></div></div>`;
      }).join('');
      const old = document.querySelector('.stats');
      if (old) old.replaceWith(statsWrap);

      renderLeaderPanel();
      renderStateGrid();
      renderPartyPower();
      renderRegions();
      renderMiniInfo();
      renderActions();
      renderLogs();
      renderGoals();
      renderInertia();
    }

    function resetGame() {
      const c = getCountryData();
      state.year = YEARS.start;
      state.used = false;
      state.ended = false;
      state.event = null;
      state.flags = {};
      state.logs = [];
      state.inertia = [
        '制度偏向：中央与地方的边界正被重新划定。',
        '国策偏向：国家正在围绕增长、稳健和威慑做选择。',
        '国际惯性：世界秩序仍在重新分配权力与资源。'
      ];
      state.stats = { ...c.base };
      state.factionInfluence = {};
      FACTIONS.forEach(f => state.factionInfluence[f] = 0);
      state.factionInfluence['保守派'] = 18;
      state.factionInfluence['改革派'] = 12;
      state.factionInfluence['军方'] = 16;
      state.factionInfluence['商业派'] = 14;
      state.factionInfluence['外交派'] = 10;
      state.factionInfluence['工党'] = 8;
      state.factionInfluence['地方派'] = 11;
      buildLeaderProfile(c);
      buildRegions(c);
      apply(getRouteData().bonus || {});
      log(`${state.country} 于 1830 年起步，路线：${getRouteData().name}。你以 ${state.leader.name} 的姿态统治国家。`);
      render();
    }

    function showEventModal(event) {
      state.event = event;
      $('eventTitle').textContent = event.title;
      $('eventText').textContent = event.text;
      $('choices').innerHTML = event.choices.map((choice, idx) => `
        <button class="choice" data-i="${idx}"><b>${choice.name}</b><small>${choice.result}</small></button>
      `).join('');
      $('choices').querySelectorAll('.choice').forEach(btn => btn.onclick = () => chooseEvent(Number(btn.dataset.i)));
      $('modal').classList.add('show');
    }

    function closeEventModal() {
      state.event = null;
      $('modal').classList.remove('show');
    }

    function chooseEvent(index) {
      if (!state.event) return;
      const choice = state.event.choices[index];
      if (!choice) return;
      apply(choice.effect || {});
      setFactionInfluence(choice.influence || {});
      state.flags[state.event.id] = choice.name;
      log(`${state.year}年：${state.event.title} → ${choice.name}：${choice.result}`);
      closeEventModal();
      render();
    }

    function performAction(index) {
      if (state.used || state.ended) return;
      const route = getRouteData();
      const extras = [];
      if (route.name === '宪政改革') extras.push({ id:'parliament', name:'扩大议会', cost:30, desc:'提高制度合法性与社会参与。', effect:{稳定:8,社会:8,威望:7,财政:-20} });
      if (route.name === '海洋联邦') extras.push({ id:'navy', name:'海军扩张', cost:35, desc:'控制航线并维护海外网络。', effect:{影响:9,贸易:6,军力:5,财政:-25} });
      if (route.name === '工业跃迁') extras.push({ id:'steel', name:'钢铁与电力', cost:40, desc:'以重工业换取技术与产能。', effect:{科技:9,经济:14,产业:12,财政:-30} });
      if (route.name === '大陆均衡') extras.push({ id:'railway', name:'战略铁路', cost:32, desc:'连接军工、资源与边疆。', effect:{军力:7,经济:6,产业:7,军需:10,财政:-23} });
      const actions = [...ACTIONS, ...extras];
      const a = actions[index];
      if (!a) return;
      if (state.stats.财政 < a.cost) {
        log(`${state.year}年：财政不足，无法执行“${a.name}”。`);
        render();
        return;
      }
      apply({ 财政: -a.cost, ...(a.effect || {}) });
      state.used = true;
      const hottest = [...state.regions].sort((a,b) => b.heat - a.heat)[0];
      if (a.id === 'control' && hottest) hottest.heat = Math.max(0, hottest.heat - 18);
      if (a.id === 'integrate' && hottest) hottest.heat = Math.max(0, hottest.heat - 12);
      if (a.id === 'education') state.factionInfluence['工党'] = Math.min(100, (state.factionInfluence['工党'] || 0) + 8);
      if (a.id === 'army') state.factionInfluence['军方'] = Math.min(100, (state.factionInfluence['军方'] || 0) + 6);
      log(`${state.year}年：执行“${a.name}”。`);
      render();
    }

    function checkEnding() {
      const s = state.stats;
      if (s.稳定 < 25 && (s.军力 < 30 || s.经济 < 30)) return '国家崩解与革命';
      if (s.军力 >= 85 && s.影响 >= 80 && s.稳定 >= 65) return '大陆霸权';
      if (s.科技 >= 85 && s.经济 >= 80 && s.产业 >= 75) return '工业巨人';
      if (s.稳定 >= 80 && s.威望 >= 80 && state.route === 'reform') return '宪政强国';
      if (s.贸易 >= 85 && s.影响 >= 85 && state.route === 'federation') return '海洋霸权';
      if (state.year >= YEARS.end) return '长时现代化';
      return '未决结局';
    }

    function finishGame() {
      log(`1950年结局：${checkEnding()}。`);
      state.ended = true;
      render();
    }

    function progressYear() {
      if (state.ended) return;
      if ($('modal').classList.contains('show')) return;
      if (state.year >= YEARS.end) { finishGame(); return; }

      state.year += 1;
      state.used = false;
      const s = state.stats;
      s.财政 += Math.max(18, Math.round(24 + s.经济 * 0.35 - s.军力 * 0.10));
      s.社会 += 2 + (state.route === 'reform' ? 2 : 0);
      s.贸易 += state.route === 'federation' ? 2 : 1;
      s.产业 += state.route === 'industrial' ? 3 : 1;
      s.军需 += state.route === 'equilibrium' ? 2 : 0;
      state.regions.forEach(region => {
        region.heat = Math.min(100, Math.max(0, region.heat + (state.stats.稳定 < 60 ? 3 : 1) + (state.route === 'reform' ? 1 : 0)));
      });
      if (s.财政 < 0) { s.稳定 -= 4; s.威望 -= 2; log(`${state.year}年：债务压力削弱了政权合法性。`); }
      if (s.社会 < 35) { s.稳定 -= 5; log(`${state.year}年：社会不安开始扩散。`); }
      if (state.regions.some(r => r.heat > 60)) {
        const hot = [...state.regions].sort((a,b) => b.heat - a.heat)[0];
        state.inertia.unshift(`地区热点：${hot.name}热度${Math.round(hot.heat)}，地方割据正在形成。`);
      }
      state.inertia = state.inertia.slice(0, 6);
      clamp();
      const available = getAvailableEvent();
      if (available) {
        log(`${state.year}年：${available.title}正在发生。`);
        showEventModal(available);
      }
      if (state.year >= YEARS.end) finishGame();
      render();
    }

    function saveGame() {
      localStorage.setItem('SVVIP_SAVE_V18', JSON.stringify(state));
      log('游戏已保存。');
      render();
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem('SVVIP_SAVE_V18');
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (!data || !data.country) return false;
        Object.assign(state, data);
        if (!state.regions || !state.regions.length) {
          buildRegions(getCountryData());
        }
        if (!state.factionInfluence) state.factionInfluence = {};
        FACTIONS.forEach(f => state.factionInfluence[f] = state.factionInfluence[f] || 0);
        if (!state.leader || !state.leader.name) buildLeaderProfile(getCountryData());
        clamp();
        render();
        return true;
      } catch (e) {
        return false;
      }
    }

    function initSelectors() {
      Object.keys(countries).forEach(name => $('nation').add(new Option(name, name)));
      Object.keys(routes).forEach(key => $('route').add(new Option(routes[key].name, key)));
      $('nation').onchange = e => { state.country = e.target.value; resetGame(); };
      $('route').onchange = e => { state.route = e.target.value; resetGame(); };
      $('next').onclick = progressYear;
      $('save').onclick = saveGame;
      $('reset').onclick = resetGame;
      $('plan').onclick = () => { log(`AI推演：${state.aiAdvice}`); render(); };
    }

    initSelectors();
    if (!loadGame()) resetGame();
  </script>
</body>
</html>
